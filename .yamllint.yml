# ==============================================================================
# Baobab Enterprise Platform
# ==============================================================================
#
# File        : .yamllint.yml
# Repository  : https://github.com/baobab-platform/baobab-cp
# Organization: NABHOLD Group Africa
#
# ------------------------------------------------------------------------------
# PURPOSE
# ------------------------------------------------------------------------------
#
# This file is the authoritative YAML linting configuration for the Baobab
# Enterprise Platform.
#
# Responsibilities
# ----------------
#
# • YAML syntax validation
# • Style enforcement
# • Consistent indentation
# • CI/CD quality assurance
# • Kubernetes & Docker configuration validation
#
# Documentation
# -------------
#
# https://yamllint.readthedocs.io
#
# ==============================================================================

# ==============================================================================
# Base Rule Set
# ==============================================================================

extends: default

# ==============================================================================
# Files & Directories
# ==============================================================================

ignore: |
  .git/
  .venv/
  node_modules/
  build/
  dist/
  site/

# ==============================================================================
# Rules
# ==============================================================================

rules:

  # ---------------------------------------------------------------------------
  # Document Markers
  # ---------------------------------------------------------------------------

  document-start: disable

  # ---------------------------------------------------------------------------
  # Line Length
  # ---------------------------------------------------------------------------

  line-length:
    max: 120
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true

  # ---------------------------------------------------------------------------
  # Empty Lines
  # ---------------------------------------------------------------------------

  empty-lines:
    max: 2
    max-start: 0
    max-end: 1

  # ---------------------------------------------------------------------------
  # Indentation
  # ---------------------------------------------------------------------------

  indentation:
    spaces: 2
    indent-sequences: consistent
    check-multi-line-strings: false

  # ---------------------------------------------------------------------------
  # Comments
  # ---------------------------------------------------------------------------

  comments:
    min-spaces-from-content: 1

  comments-indentation: enable

  # ---------------------------------------------------------------------------
  # Braces
  # ---------------------------------------------------------------------------

  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1

  # ---------------------------------------------------------------------------
  # Brackets
  # ---------------------------------------------------------------------------

  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1

  # ---------------------------------------------------------------------------
  # Colons
  # ---------------------------------------------------------------------------

  colons:
    max-spaces-before: 0
    max-spaces-after: 1

  # ---------------------------------------------------------------------------
  # Commas
  # ---------------------------------------------------------------------------

  commas:
    max-spaces-before: 0
    min-spaces-after: 1
    max-spaces-after: 1

  # ---------------------------------------------------------------------------
  # Hyphens
  # ---------------------------------------------------------------------------

  hyphens:
    max-spaces-after: 1

  # ---------------------------------------------------------------------------
  # Trailing Spaces
  # ---------------------------------------------------------------------------

  trailing-spaces: enable

  # ---------------------------------------------------------------------------
  # Truthy Values
  #
  # Allow Kubernetes, GitHub Actions and Docker conventions while still
  # encouraging explicit YAML booleans.
  # ---------------------------------------------------------------------------

  truthy:
    allowed-values:
      - "true"
      - "false"
      - "on"
      - "off"

# ==============================================================================
# End of File
# ==============================================================================
