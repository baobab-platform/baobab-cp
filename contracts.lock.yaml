  - contracts/control-plane/v1/provisioning-state-machine.yaml
  - contracts/control-plane/v1/openapi.yaml
  - contracts/control-plane/v1/security-policy.yaml
  - contracts/control-plane/v1/tenant-provisioning-milestone.schema.json
  - contracts/control-plane/v1/market-participation-created.schema.json
  - contracts/control-plane/v1/market-participation-updated.schema.json
  - contracts/errors/v1/problem-details.schema.json
  - contracts/idempotency/v1/policy.yaml
  - contracts/identity/v1/principal.schema.json
  - contracts/identity/v1/external-identity.schema.json
  - contracts/identity/v1/external-reference.schema.json
