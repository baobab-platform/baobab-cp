# The CP Console (frontend/) is this repository's only Node package. The
# workspace root holds its single lockfile, where the organisation's
# foundation gates install and audit it. Newly published versions are held
# back by pnpm's default minimum release age; no exclusions.
packages:
  - frontend
overrides:
  # Patched against GHSA-r28c-9q8g-f849 (path traversal) and prior advisories.
  postcss: 8.5.28
  # Patched against GHSA-mrhx-c7xc-m3w5 and GHSA-xjj6-f33q-929c.
  zod: 4.6.6
  undici: 8.12.2
  sharp: 0.35.5
  source-map-js: 1.2.2
  # vitest's vite: patched against GHSA-587h-7wmj-h5pm (launch-editor
  # existence-check bypass, vite >=8.3.0 <=8.3.2).
  vite: 8.3.4
  # Next 16.3.6 uses only globSync(pattern, { onlyDirectories: true })
  # in get-root-dirs. tinyglobby supports that API without the vulnerable
  # braces dependency (GHSA-vfj7-8cjw-p6xm). lint runs its integration fixture.
  '@next/eslint-plugin-next>fast-glob': npm:tinyglobby@0.2.17
allowBuilds:
  # Its native resolver ships as prebuilt optional packages; the install
  # script is not needed.
  unrs-resolver: false

# Freshly published BXS packages have verified SHA512 registry receipts.
# Fixed-version exceptions are allowed only after independently verified
# GitHub Packages SHA512/export run 39073362603 (2026-10-17).
minimumReleaseAgeExclude:
  - "@baobab-platform/experience-geo-core@0.3.1"
  - "@baobab-platform/experience-tokens@0.3.1"
  - "@baobab-platform/experience-ui@0.3.1"
