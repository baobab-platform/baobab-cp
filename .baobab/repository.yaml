schema_version: 1
repository:
  lifecycle: active
capabilities:
  - go
  - node
  - container
  - control-plane
package_managers:
  node: pnpm
environment:
  baobab_dev:
    required: true
    profile: full
artifacts:
  container:
    enabled: true
    dockerfile: Dockerfile
    context: .
    runtime: true
security:
  # ADR-0020: private repository without licensed CodeQL upload support.
  # Foundation records fallback coverage and retains portable security scans.
  sast_provider: fallback
