name: Temporary PEO-02S CP client generation
on:
  push:
    branches: [feat/peo02s-governed-documentary-review-decisions]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: frontend/.node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Regenerate typed CP Console client from pinned canonical OpenAPI
        run: |
          set -euo pipefail
          pnpm --filter @baobab-platform/cp-console generate:cp-client
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/src/generated/control-plane/openapi.d.ts
            git commit -m "chore(peo-02s): regenerate CP Console types from pinned Shared schema"
            git push origin HEAD:refs/heads/feat/peo02s-governed-documentary-review-decisions
          fi
