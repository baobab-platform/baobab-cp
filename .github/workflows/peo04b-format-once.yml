name: PEO-04B temporary gofmt
on:
  push:
    branches: [feat/peo04b-founding-onboarding-qualification]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    if: github.repository == 'baobab-platform/baobab-cp'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: feat/peo04b-founding-onboarding-qualification
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format code with repository Go version
        run: |
          set -euo pipefail
          gofmt -w internal/service/organisation/founding_roster_qualification*.go
          gofmt -w cmd/qualify-founding-onboarding/*.go
          gofmt -w internal/store/postgres/peo04b_four_business_registration_test.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/service/organisation/founding_roster_qualification*.go
            git add cmd/qualify-founding-onboarding/*.go
            git add internal/store/postgres/peo04b_four_business_registration_test.go
            git commit -m "style(peo04b): gofmt founding-onboarding runtime and PostgreSQL acceptance"
            git pull --rebase origin feat/peo04b-founding-onboarding-qualification
            git push origin HEAD:feat/peo04b-founding-onboarding-qualification
          fi
