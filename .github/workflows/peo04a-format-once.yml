name: PEO-04A temporary gofmt
on:
  push:
    branches: [feat/peo04a-independent-founding-corporate-proof]
    paths: [.github/workflows/peo04a-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'baobab-platform/baobab-cp'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: feat/peo04a-independent-founding-corporate-proof
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          set -euo pipefail
          gofmt -w internal/service/organisation/founding_evidence_reconciliation*.go
          gofmt -w internal/service/organisation/founding_control_store*.go
          gofmt -w internal/service/verification/official_capture*.go
          gofmt -w internal/repository/postgres_organisation_governance.go
          gofmt -w internal/service/organisation/firstparty_reconciler_test.go
          gofmt -w cmd/controlplane/main.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/service/organisation internal/service/verification/official_capture*.go
            git add internal/repository/postgres_organisation_governance.go cmd/controlplane/main.go
            git commit -m "style(peo04a): gofmt independent founding corporate verification"
            git pull --rebase origin feat/peo04a-independent-founding-corporate-proof
            git push origin HEAD:feat/peo04a-independent-founding-corporate-proof
          fi
