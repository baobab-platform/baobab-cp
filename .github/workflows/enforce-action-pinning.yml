# ==============================================================================
# BAOBAB Enterprise Platform
# Enforce Action Pinning
#
# File: .github/workflows/enforce-action-pinning.yml
#
# PURPOSE:
#   Delegates to baobab-platform/shared's reusable enforce-action-pinning.yml —
#   fails CI if any `uses:` reference in this repo's .github/workflows
#   or .github/actions isn't pinned to a full 40-character commit SHA.
#   This check already exists in baobab-platform/shared and is recommended for
#   every repo (see shared's templates/README.md); this repo had simply
#   never adopted it before now, despite already following the pinning
#   discipline it enforces throughout .github/workflows.
#
#   Copied from baobab-platform/shared's templates/caller-enforce-action-pinning.yml
#   verbatim — no repo-specific adjustments were needed.
#
# CHANGE LOG (most recent first)
# ------------------------------------------------------------------------------
# * Initial version — this repo previously had no CI check enforcing the
#   action-pinning policy it otherwise already follows.
# ==============================================================================

name: Enforce Action Pinning

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
    # SHA is baobab-platform/shared's v1.0.0 tag (annotated — peeled commit, not
    # the tag object's own SHA), re-verified live via
    # `git ls-remote --tags https://github.com/baobab-platform/shared.git v1.0.0`
    # on 2026-08-25.
    uses: baobab-platform/shared/.github/workflows/enforce-action-pinning.yml@80d7f2556ba05d4a9524acd525152892a55316fa # v2.0.0
