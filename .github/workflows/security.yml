# ==============================================================================
# BAOBAB Enterprise Platform
# Security
#
# File: .github/workflows/security.yml
#
# PURPOSE:
#   Owns the trigger and elevated per-job permissions; delegates the
#   actual scanning to baobab-platform/shared's reusable security-*.yml
#   workflows, per this org's "build common capabilities once, govern
#   centrally" principle — same pattern as this repo's pages.yml,
#   greetings.yml and release.yml. Turns SECURITY.md's documented
#   expectations (SAST, dependency auditing, secrets detection — see its
#   "Security Testing" section) and this repo's own already-configured
#   local tooling (bandit.yaml, .secrets.baseline, the `security`
#   dependency-group, `make security`) into an actual CI gate for the
#   first time — previously this file was an empty placeholder and none
#   of that tooling ran anywhere except a developer's own machine.
#
#   Also adds `dependency-review`, which is NOT a baobab-platform/shared call —
#   it's GitHub's own actions/dependency-review-action, invoked directly.
#   Wrapping a single upstream action in another workflow_call layer adds
#   indirection without adding anything shared/'s own Guiding Principle
#   ("one implementation, many consumers... if a component cannot satisfy
#   those characteristics, it should probably remain local") asks for —
#   the action itself is already the shared unit.
#
# WHY THIS FILE ALSO ADOPTS enforce-action-pinning.yml AND
# enforce-dependabot-config.yml AS SEPARATE FILES, NOT JOBS HERE:
#   Both already exist as reusable workflows in baobab-platform/shared and are
#   recommended for every repo (see shared's templates/README.md), but
#   this repo had never actually adopted either. Delivered alongside this
#   file as their own `.github/workflows/enforce-action-pinning.yml` /
#   `enforce-dependabot-config.yml`, copied from shared's own caller
#   templates verbatim (not merged into this file) — that mirrors how
#   baobab-platform/shared's own ci.yml keeps them as separate jobs/files rather
#   than folding them into this repo's security policy file, and keeps
#   each check's trigger `paths:` narrow to what it actually needs to
#   re-run on (workflow/action files, and dependabot.yml, respectively)
#   rather than the broad paths appropriate for a security scan.
#
# CHANGE LOG (most recent first)
# ------------------------------------------------------------------------------
# * Re-pinned all three baobab-platform/shared `uses:` lines to the v1.1.0 tag —
#   security-secrets-scan.yml, security-codeql.yml and security-python.yml
#   all shipped in that release. SHA is the tag's peeled/dereferenced
#   commit (not the annotated tag object's own SHA), verified live via
#   `git ls-remote --tags https://github.com/baobab-platform/shared.git v1.1.0
#   v1.1.0^{}` on 2026-08-25 (f8df9b90ffe8fef5cbf6d14a9bcf868f723d1464),
#   and confirmed present via `git ls-tree -r <that SHA> -- .github/workflows`.
# * Initial version, replacing the previously-empty security.yml
#   placeholder file. (Shipped with honest 0000...0000 placeholder pins
#   at the time, since none of the three baobab-platform/shared reusable
#   workflows existed yet — see this file's git history for that revision.)
# ==============================================================================

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly — catches newly-disclosed CVEs against unchanged
    # dependencies, and secrets committed before these checks existed.
    # Staggered across the hour against baobab-dev's own Monday 00:00
    # UTC lockfile job and this repo's own security-*.yml caller
    # schedules to avoid every org workflow queueing at once.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secret scanning
    permissions:
      contents: read
    # SHA is baobab-platform/shared's v1.1.0 tag (annotated — peeled commit, not
    # the tag object's own SHA), verified live via `git ls-remote --tags
    # https://github.com/baobab-platform/shared.git v1.1.0 v1.1.0^{}` on 2026-08-25.
    uses: baobab-platform/shared/.github/workflows/security-secrets-scan.yml@80d7f2556ba05d4a9524acd525152892a55316fa # v2.0.0

  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
      actions: read
    # SHA is baobab-platform/shared's v1.1.0 tag (annotated — peeled commit, not
    # the tag object's own SHA), verified live via `git ls-remote --tags
    # https://github.com/baobab-platform/shared.git v1.1.0 v1.1.0^{}` on 2026-08-25.
    uses: baobab-platform/shared/.github/workflows/security-codeql.yml@80d7f2556ba05d4a9524acd525152892a55316fa # v2.0.0
    with:
      languages: '["go"]'
      build-mode: "autobuild"

  dependency-review:
    name: Dependency review
    # PR-only by design: this action diffs the dependency graph between
    # base and head refs, which is only meaningful on a pull request —
    # it has nothing to compare against on a plain push to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

