# Security coverage is governed by .baobab/repository.yaml and foundation.yml.
# ADR-0020 selects portable scans for this private repository without GHAS.
# Foundation runs Trivy, native dependency audits and explicit coverage notices.
# Keep the independent weekly secret scan; unsupported SARIF uploads and GitHub
# dependency-graph review are configured through Foundation's coverage decision.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly — catches newly-disclosed CVEs against unchanged
    # dependencies, and secrets committed before these checks existed.
    # Staggered across the hour against baobab-dev's own Monday 00:00
    # UTC lockfile job and this repo's own security-*.yml caller
    # schedules to avoid every org workflow queueing at once.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secret scanning
    permissions:
      contents: read
    uses: baobab-platform/shared/.github/workflows/security-secrets-scan.yml@31de2bc3dcd56128c019c640dc7e12c10ae9ca69 # v2.3.0
