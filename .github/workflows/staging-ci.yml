name: Staging Tagged Images
on:
  push:
    tags: ['v*.*.*-staging']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/baobab-platform/baobab-cp
            dockerfile: Dockerfile
    permissions:
      contents: read
      actions: read
      packages: write
      attestations: write
      id-token: write
    uses: baobab-platform/shared/.github/workflows/reusable-staging-image.yml@6e37c6ff13c00655aa23eaf2909ad4dc0ffb19b3
    with:
      dockerfile: ${{ matrix.dockerfile }}
      image: ${{ matrix.image }}
      go-tests: true
