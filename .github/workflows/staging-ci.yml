name: Staging Tagged Images
on:
  push:
    tags: ['v*.*.*-staging']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-staging')
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/baobab-platform/baobab-cp
            dockerfile: Dockerfile
    permissions:
      contents: read
      actions: read
      packages: write
      attestations: write
      id-token: write
    uses: baobab-platform/shared/.github/workflows/reusable-staging-image.yml@8d2b3d9e1c0007522adcba72fd0d88c58ddff047
    with:
      dockerfile: ${{ matrix.dockerfile }}
      image: ${{ matrix.image }}
      go-tests: true
