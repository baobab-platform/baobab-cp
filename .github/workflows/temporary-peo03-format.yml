name: Temporary PEO-03 Go Formatting
on:
  push:
    branches:
      - feat/peo03-v2-admission-decision-bridge
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format owned Go files, commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w api/progressive_bridge_handler.go internal/store/postgres/progressive_admission_bridge.go
          if ! git diff --quiet -- api/progressive_bridge_handler.go internal/store/postgres/progressive_admission_bridge.go; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add api/progressive_bridge_handler.go internal/store/postgres/progressive_admission_bridge.go
            git commit -m "style(peo-03b): apply gofmt to reviewed admission bridge"
            git push origin HEAD:refs/heads/feat/peo03-v2-admission-decision-bridge
          fi
