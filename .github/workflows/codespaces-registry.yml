name: Codespaces Registry and Image Contract
on:
  push:
    branches: [main]
    paths: [.devcontainer/**, scripts/codespaces/**, .github/workflows/codespaces-registry.yml]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  source:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - run: node --test scripts/codespaces/*.node.mjs
  ghcr:
    runs-on: ubuntu-26.04
    steps:
      - name: Verify separate Actions read-only GHCR entitlement
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
      - name: Verify published multi-language image
        run: docker buildx imagetools inspect ghcr.io/baobab-platform/baobab-dev:1.4.4@sha256:9603f0e7402aa85771e904db1c20f2ecc02f705131b266cb4ec3d1c24ea58ae4 >/dev/null
