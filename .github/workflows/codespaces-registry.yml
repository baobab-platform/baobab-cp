name: Codespaces Registry and Image Contract
on:
  push:
    branches: [main]
    paths: [.devcontainer/**, .baobab/environment.yaml, scripts/codespaces/**, .github/workflows/codespaces-registry.yml]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  source:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
      - name: Verify Node 26 / Corepack 0.36 / pnpm 12 tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v26.13.0
          npm install --global --no-audit --no-fund corepack@0.36.0
          test "$(corepack --version)" = 0.36.0
          corepack enable
          test "$(pnpm --version)" = 12.16.1
      - run: node --test scripts/codespaces/*.node.mjs
  ghcr:
    runs-on: ubuntu-26.04
    steps:
      - name: Verify separate Actions read-only GHCR entitlement
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
      - name: Verify published signed v1.5.1 GA multi-language image
        run: docker buildx imagetools inspect ghcr.io/baobab-platform/baobab-dev:1.5.1@sha256:faf9022ef06288767651a0ec1071d5199bc2b645f2cf7ada50477774dd297eed >/dev/null
