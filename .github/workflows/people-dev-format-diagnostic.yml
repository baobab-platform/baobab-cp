name: People development formatting diagnostic (temporary)
on:
  pull_request:
    paths:
      - 'internal/repository/postgres_people_dev_governance*.go'
      - '.github/workflows/people-dev-format-diagnostic.yml'
permissions:
  contents: read
jobs:
  gofmt-diff:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show exact gofmt diff to review before accepting release
        run: gofmt -d internal/repository/postgres_people_dev_governance.go internal/repository/postgres_people_dev_governance_test.go
