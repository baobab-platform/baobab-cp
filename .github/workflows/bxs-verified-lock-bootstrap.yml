# One-use branch-only lockfile reconciliation of the versions whose SHA512 and
# compiled exports were verified by Shared Actions run 39073362603.
# This workflow removes itself in the resulting commit. Ordinary frozen-lock
# browser, Security and Foundation CI remains mandatory on the final source.
name: BXS verified consumer lock reconciliation
on:
  push:
    branches: [feat/bxs-published-experience-upgrade-20261018]
    paths: [.github/workflows/bxs-verified-lock-bootstrap.yml]
permissions:
  contents: write
  packages: read
jobs:
  reconcile:
    if: ${{ github.repository == 'baobab-platform/baobab-cp' && github.ref == 'refs/heads/feat/bxs-published-experience-upgrade-20261018' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout approved branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Pin pnpm from repository packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Node 24 with private GitHub registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          registry-url: https://npm.pkg.github.com
          scope: '@baobab-platform'
      - name: Compute exact published package lock entries and self-remove
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'require("./package.json").packageManager')" = 'pnpm@11.24.0'
          test "$(node -p 'process.versions.node.split(".")[0]')" = '24'
          # Existing lockfile still contains old 0.2.0 BXS packages. Those
          # exact versions were independently verified in Shared run
          # 39029098417. Allow them ONLY during the migration resolver pass.
          # Restore permanent 0.3.1-only policy before frozen validation.
          cp pnpm-workspace.yaml "$RUNNER_TEMP/pnpm-workspace.original.yaml"
          printf '%s\\n' \
            '  - "@baobab-platform/experience-tokens@0.2.0"' \
            '  - "@baobab-platform/experience-ui@0.2.0"' \
            '  - "@baobab-platform/experience-geo-core@0.2.0"' \
            >> pnpm-workspace.yaml
          pnpm install --lockfile-only --no-frozen-lockfile
          cp "$RUNNER_TEMP/pnpm-workspace.original.yaml" pnpm-workspace.yaml
          pnpm install --lockfile-only --frozen-lockfile
          # Compare every resolved archive to the independent, read-only
          # Shared registry verification: run 39073362603.
          grep -Fq "'@baobab-platform/experience-tokens@0.3.1':" pnpm-lock.yaml
          grep -Fq "integrity: sha512-lUHUINcCglprrMjYVjD05L/gqifmuSgfBT7nBK9LR4GWlDE9lNLEMM1z1EinHB/bF5NyX3OGto16wrNB8jW0Lw==" pnpm-lock.yaml
          grep -Fq "'@baobab-platform/experience-ui@0.3.1':" pnpm-lock.yaml
          grep -Fq "integrity: sha512-r5Lw24EH+eMW/XWDxVIe8RPT8/iLxdXNFXBJx4pwVXegL5Mz1fOHTRZtdOy9W+LKzJ4JRIDWAjz5aumVS6AaJA==" pnpm-lock.yaml
          grep -Fq "'@baobab-platform/experience-geo-core@0.3.1':" pnpm-lock.yaml
          grep -Fq "integrity: sha512-d4Yi791fQDQAM7QjZpzMLpfnDksoZBW6A9kODXAliF3NcOuXgFxr19voTX325/Ksi1IFtsxXVwCTfWgl5IYj8Q==" pnpm-lock.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-lock.yaml
          git rm -- .github/workflows/bxs-verified-lock-bootstrap.yml
          git commit -m 'build(bxs): lock published verified Experience package digests'
          git push origin HEAD:refs/heads/feat/bxs-published-experience-upgrade-20261018
