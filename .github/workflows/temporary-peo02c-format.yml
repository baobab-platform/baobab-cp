name: Temporary PEO-02C Go Formatting
on:
  push:
    branches:
      - feat/peo02-lifecycle-outbox-and-policy-enforcement
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Format PEO-02C and stacked PEO-03B code
        shell: bash
        run: |
          set -euo pipefail
          files=(
            internal/store/postgres/peo02_lifecycle_outbox.go
            internal/store/postgres/peo02_expiry_sweep.go
            internal/store/postgres/peo02_founding_policy.go
            internal/store/postgres/peo02_governance_lifecycle.go
            internal/store/postgres/peo02_governance_commands.go
            internal/service/organisation/eligibility.go
            internal/store/postgres/progressive_admission_bridge.go
            api/progressive_bridge_handler.go
          )
          gofmt -w "${files[@]}"
          if ! git diff --quiet -- "${files[@]}"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${files[@]}"
            git commit -m "style(peo-02c): format founding lifecycle and PEO-03 stack"
            git push origin HEAD:refs/heads/feat/peo02-lifecycle-outbox-and-policy-enforcement
          fi
