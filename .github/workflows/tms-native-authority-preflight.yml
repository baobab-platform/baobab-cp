name: CP TMS Native Authority Held Preflight
on:
  pull_request:
    paths:
      - "internal/tmsauthority/**"
      - "docs/integrations/tms-native-execution-authority.md"
      - ".github/workflows/tms-native-authority-preflight.yml"
  push:
    branches: [main]
    paths:
      - "internal/tmsauthority/**"
      - ".github/workflows/tms-native-authority-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed:
    name: TMS native CP decision remains unaccepted and always HELD
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./internal/tmsauthority
