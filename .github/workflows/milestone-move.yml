# ==============================================================================
# BAOBAB Enterprise Platform
# Move Card on Milestone Change
#
# File: .github/workflows/milestone-move.yml
#
# PURPOSE:
#   When an issue's milestone is set/changed, moves that issue's card to the
#   "Sprint" column of this org's Baobab Platform project board
#   (https://github.com/orgs/nabhold/projects/5), via github/update-project-
#   action. Status column values ("Backlog", "Ready", "Sprint", "In
#   Progress", "Review", "Testing", "Done") and the "Status" field name are
#   this org's documented convention — see docs/governance/github-issues.md
#   ("GitHub Project Fields" / "Status" sections).
#
# SETUP REQUIRED BEFORE THIS WORKFLOW CAN RUN — read before merging:
#   1. Create a secret named PROJECTS_PAT (repository secret, or an
#      organization secret shared across repos if other NABHOLD repos will
#      need the same board-automation pattern). Per github/update-project-
#      action's own documented requirement, the token needs `repo` and
#      `write:org` scopes — the default GITHUB_TOKEN cannot write to an
#      organization-level Projects (beta/v2) board no matter what
#      `permissions:` this workflow declares, so this step is not optional.
#      A classic PAT is what the action's docs specify; if your org
#      restricts classic PATs, a fine-grained PAT with organization
#      "Projects" read/write permission is the modern equivalent — confirm
#      it works against project #5 specifically before relying on it, since
#      fine-grained project permissions are a newer surface than this
#      action's own documentation covers.
#   2. Confirm the PAT's owner has write access to
#      https://github.com/orgs/nabhold/projects/5 — a token from an account
#      that can't open the board itself will fail the same way regardless
#      of scopes.
#
# CHANGE LOG (most recent first)
# ------------------------------------------------------------------------------
# * Fixed from a copy-pasted tutorial example that was never wired up to
#   this repository: organization was the literal placeholder string
#   "YOUR_GITHUB_USERNAME" (now "nabhold"), project_number was a
#   placeholder guess of 3 (now 5, the Baobab Platform board's real
#   number per its URL). Also added the previously-missing required
#   `content_id` input — github/update-project-action needs the target
#   issue's GraphQL node ID, not just its number; without it the action
#   fails immediately on "content_id is required" regardless of the other
#   inputs. Pinned the action to a full commit SHA per org policy (it was
#   floating on @v4 before).
# ==============================================================================

name: Move Card on Milestone Change

on:
  issues:
    types: [milestoned] # Triggers when a milestone is added or changed

permissions:
  contents: read

jobs:
  update-kanban-status:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      # SHA is github/update-project-action's v4 tag, verified live via
      # `git ls-remote --tags https://github.com/github/update-project-action.git`
      # on 2026-08-25 — v4 is a LIGHTWEIGHT tag (unlike baobab-platform/shared's own
      # v1.0.0, which is annotated), so the tag's own SHA is already the
      # commit SHA; there is no separate peeled object to resolve here.
      - name: Move issue to Sprint column
        uses: github/update-project-action@af4f6083118f5080c89828b421ef598d1906fb60 # v4
        with:
          # See "SETUP REQUIRED" above — this secret must exist before this
          # workflow can succeed.
          github_token: ${{ secrets.PROJECTS_PAT }}

          organization: "nabhold"

          # From https://github.com/orgs/nabhold/projects/5
          project_number: 5

          # The GraphQL global node ID of the issue that was milestoned —
          # required by this action and NOT the same as github.event.issue.number.
          content_id: ${{ github.event.issue.node_id }}

          field: "Status"
          value: "Sprint"
