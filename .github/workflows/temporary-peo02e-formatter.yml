name: Temporary peo02e gofmt
on:
  push:
    branches:
      - feat/peo02e-authenticated-lifecycle-delivery
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Canonical Go formatting
        run: |
          set -euo pipefail
          gofmt -w cmd/controlplane/main.go internal/store/postgres/peo02_founding_outbox_relay.go internal/store/postgres/peo02_founding_outbox_relay_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cmd/controlplane/main.go internal/store/postgres/peo02_founding_outbox_relay.go internal/store/postgres/peo02_founding_outbox_relay_test.go
            git commit -m "style(peo02e): canonical gofmt of implementation"
            git push origin HEAD:refs/heads/feat/peo02e-authenticated-lifecycle-delivery
          fi
