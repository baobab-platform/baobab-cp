name: Website lockfile bootstrap (temporary)
# Temporary maintenance workflow; remove immediately after lock regeneration.
on:
  push:
    branches:
      - feat/platform-public-website-foundation
    paths:
      - .github/workflows/website-lock-bootstrap.yml
permissions:
  contents: write
jobs:
  update-lockfile:
    if: github.repository == 'baobab-platform/baobab-cp' && github.ref == 'refs/heads/feat/platform-public-website-foundation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
      - run: corepack enable
      - name: Regenerate exact workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile only
        run: |
          git config user.name "baobab-dependency-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "build(frontend): regenerate pinned pnpm lockfile for Tailwind and shadcn"
            git push origin HEAD:refs/heads/feat/platform-public-website-foundation
          fi
