name: PEO05 formatting diagnostic (temporary)
on:
  push:
    branches:
      - feat/peo05a-founding-tenant-runtime-qualification
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Show authoritative gofmt patch
        run: |
          gofmt -d internal/service/organisation/founding_peo05_qualification.go
          gofmt -d internal/service/organisation/founding_peo05_qualification_test.go
          gofmt -l internal/service/organisation/founding_peo05_qualification.go internal/service/organisation/founding_peo05_qualification_test.go
