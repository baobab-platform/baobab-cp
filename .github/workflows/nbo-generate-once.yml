name: NBO one-time generated client sync
on:
  push:
    branches: [feat/nbo-01-admission-and-nbo-00-baseline]
    paths: [.github/workflows/nbo-generate-once.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: feat/nbo-01-admission-and-nbo-00-baseline
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @baobab-platform/cp-console generate:cp-client
      - name: Commit generated API types to isolated PR branch only
        run: |
          git add frontend/src/generated/control-plane/openapi.d.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(nbo-01): regenerate CP OpenAPI TypeScript client'
            git push origin HEAD:refs/heads/feat/nbo-01-admission-and-nbo-00-baseline
          fi
