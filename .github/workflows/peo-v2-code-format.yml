name: PEO-03 source formatter (one-time)
on:
  pull_request:
    paths:
      - internal/store/postgres/progressive_applications.go
      - internal/store/postgres/peo02_governance_commands.go internal/store/postgres/peo02_03_commands_test.go
      - internal/store/postgres/peo02_03_commands_test.go
      - api/peo02_governance_handler.go
      - api/peo02_03_security_test.go
      - api/progressive_application_handler.go
      - api/router.go
      - cmd/controlplane/main.go
      - .github/workflows/peo-v2-code-format.yml
permissions:
  contents: write
jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == 'baobab-platform/baobab-cp' &&
      github.event.pull_request.head.ref == 'feat/peo-02-03-progressive-admission-runtime'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Go canonical formatting
        run: gofmt -w api/progressive_application_handler.go api/peo02_governance_handler.go api/peo02_03_security_test.go api/router.go cmd/controlplane/main.go internal/store/postgres/progressive_applications.go internal/store/postgres/peo02_governance_commands.go internal/store/postgres/peo02_03_commands_test.go
      - name: Commit only formatting
        run: |
          if git diff --quiet -- api/progressive_application_handler.go api/peo02_governance_handler.go api/peo02_03_security_test.go api/router.go cmd/controlplane/main.go internal/store/postgres/progressive_applications.go internal/store/postgres/peo02_governance_commands.go internal/store/postgres/peo02_03_commands_test.go; then exit 0; fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/progressive_application_handler.go api/peo02_governance_handler.go api/peo02_03_security_test.go api/router.go cmd/controlplane/main.go internal/store/postgres/progressive_applications.go internal/store/postgres/peo02_governance_commands.go internal/store/postgres/peo02_03_commands_test.go
          git commit -m 'style(peo-03): format applicant v2 API and store'
          git push origin 'HEAD:refs/heads/feat/peo-02-03-progressive-admission-runtime'
