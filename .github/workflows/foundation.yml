name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write

jobs:
  foundation:
    uses: baobab-platform/shared/.github/workflows/foundation-repository-gates.yml@ab7a473a1f69784f115ad353e36383faf9b95965
    secrets:
      SHARED_READ_TOKEN: ${{ secrets.SHARED_READ_TOKEN }}
    with:
      foundation_ref: "756892fbdbcf0eb89bf62f720c372bad53748dea"
      # Private repository without GHAS: portable Trivy and native audits run.
      # GitHub dependency-graph review is unavailable (ADR-0020).
      dependency_review_enabled: false
