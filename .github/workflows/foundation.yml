name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write

jobs:
  foundation:
    uses: baobab-platform/shared/.github/workflows/foundation-repository-gates.yml@584d7f3cd8426ffd3d1dc9f068f0b444dc74346e
    secrets:
      SHARED_READ_TOKEN: ${{ secrets.SHARED_READ_TOKEN }}
    with:
      foundation_ref: "584d7f3cd8426ffd3d1dc9f068f0b444dc74346e"
      # Private repository without GHAS: portable Trivy and native audits run.
      # GitHub dependency-graph review is unavailable (ADR-0020).
      dependency_review_enabled: false
