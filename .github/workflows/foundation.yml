name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write

jobs:
  foundation:
    uses: baobab-platform/shared/.github/workflows/foundation-repository-gates.yml@6899a2d8f143bf23d36c4f4ac904e0a1e10c3cea
    secrets:
      SHARED_READ_TOKEN: ${{ secrets.SHARED_READ_TOKEN }}
    with:
      foundation_ref: "6899a2d8f143bf23d36c4f4ac904e0a1e10c3cea"
      # Private repository without GHAS: portable Trivy and native audits run.
      # GitHub dependency-graph review is unavailable (ADR-0020).
      dependency_review_enabled: false
