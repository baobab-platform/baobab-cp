name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write

jobs:
  foundation:
    uses: baobab-platform/shared/.github/workflows/foundation-repository-gates.yml@db79dda34d2161e57f09438f7ed87a04570f2308
    with:
      foundation_ref: "db79dda34d2161e57f09438f7ed87a04570f2308"
      dependency_review_enabled: true
      advanced_security_enabled: true
      legacy_metadata_enabled: false
