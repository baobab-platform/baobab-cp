name: PEO-03J temporary format-only
on:
  push:
    branches: [feat/peo03j-governed-document-worker]
    paths: [.github/workflows/peo03j-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'baobab-platform/baobab-cp'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          set -euo pipefail
          gofmt -w internal/service/verification/document_worker.go internal/service/verification/document_worker_test.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/service/verification/document_worker.go internal/service/verification/document_worker_test.go
            git commit -m "style(peo03j): gofmt governed extraction worker and tests"
            git push origin HEAD:feat/peo03j-governed-document-worker
          fi
