# ==============================================================================
# BAOBAB Enterprise Platform
# Greet First-Time Contributors
#
# File: .github/workflows/greetings.yml
#
# PURPOSE:
#   Owns the trigger and the elevated issues/pull-requests permissions;
#   delegates the greeting mechanism itself to baobab-platform/shared, per this
#   org's "build common capabilities once, govern centrally" principle. A
#   reusable workflow cannot declare its own repository-event trigger
#   (only workflow_call), so this thin wrapper is the only place
#   pull_request_target / issues live for this repo.
#
# WHY pull_request_target is safe here: this job never checks out the PR's
# own code (no `actions/checkout` step in this file), so a malicious fork
# PR has no code-execution surface despite the base-repo token permissions.
#
# NOTE ON THIS REVISION: an earlier copy of this file (carried over
# directly from baobab-dev) referenced "config/resolve.sh" and
# "config/versions.lock" in the pr-message text below — neither exists in
# this repository (baobab's own version manifest is
# .devcontainer/docker/scripts/config/versions.sh plus the root
# .python-version file; see pages.yml's header). That mismatch didn't
# break the workflow mechanically, but it would have posted a factually
# wrong comment to first-time contributors. Corrected below to describe
# this repository's actual layout.
#
# IF THIS WORKFLOW STILL ISN'T FIRING: the workflow mechanics here are
# identical to baobab-dev's (same shared/ pin, same trigger shape), so a
# missing greeting on this repo's first issue/PR is most likely a
# repository-settings issue rather than a workflow-file issue — check,
# in this repo's own Settings (not visible from a local clone):
#   1. Settings -> Actions -> General -> Actions permissions: if this repo
#      restricts to an explicit allow-list rather than "Allow all actions
#      and reusable workflows", baobab-platform/shared must be added to it, or
#      every job below fails at the `uses:` step before it can run.
#   2. Settings -> Actions -> General -> Workflow permissions: must allow
#      GITHUB_TOKEN to create issue/PR comments for actions/first-
#      interaction to succeed (org- or repo-level default can override
#      the job-level `permissions:` block below downward, never upward).
#   3. That this file is present on the repository's *default* branch —
#      GitHub only evaluates workflow files as they exist on the branch
#      an event targets (or, for pull_request_target, the base branch),
#      so a copy sitting only on a feature branch never triggers.
# ==============================================================================

name: Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  contents: read

jobs:
  greeting:
    permissions:
      issues: write
      pull-requests: write
    # SHA is baobab-platform/shared's v1.0.0 tag (annotated tag — this is the
    # peeled commit, not the tag object's own SHA), verified live via
    # `git ls-remote --tags https://github.com/baobab-platform/shared.git v1.0.0`
    # on 2026-08-25. Future baobab-platform/shared releases should flow through
    # Dependabot from here (see .github/dependabot.yml's github-actions
    # entry) — but re-verify manually on the first bump PR regardless,
    # since Dependabot has a documented issue (dependabot-core#14716)
    # resolving updates correctly the first time a previously-untagged
    # pin moves onto an actual tag.
    uses: baobab-platform/shared/.github/workflows/greetings.yml@f7466cc89a17c0b6e02b5a1e5fce3ce76073a718 # v1.4.0
    with:
      issue-message: |
        👋 Thanks for opening your first issue in **BAOBAB Enterprise Platform**!

        A maintainer will take a look shortly. In the meantime, if this is a bug
        report, a repro (module/service affected and the exact steps that
        failed) will help us get to a fix faster.
      pr-message: |
        🎉 Thanks for your first pull request to **BAOBAB Enterprise Platform**!

        A maintainer will review it soon. If your change touches
        `.devcontainer/`, `pyproject.toml`, or `.python-version`, please keep
        them in sync — `.python-version` is this repository's single source of
        truth for the pinned Python version (see `pyproject.toml`'s
        `requires-python`).

        See the [Contributing guide](https://github.com/baobab-platform/baobab-cp/blob/main/CONTRIBUTING.md) for more.
