name: LA-05 pinned contract regeneration (temporary)

on:
  push:
    branches:
      - feat/la05-p2-staging-scope-vendor
    paths:
      - ".github/workflows/la05-contract-regeneration.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'baobab-platform/baobab-cp' && github.ref == 'refs/heads/feat/la05-p2-staging-scope-vendor'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Pin exact Shared revision
        id: pin
        run: |
          pinned=$(grep -m1 'source_commit:' contracts.lock.yaml | awk '{print $2}')
          test "$pinned" = "f2790abb8833fb40fdc7ef1d300faf887920fae4"
          echo "commit=$pinned" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: baobab-platform/shared
          token: ${{ secrets.SHARED_READ_TOKEN || github.token }}
          persist-credentials: false
          ref: ${{ steps.pin.outputs.commit }}
          path: .shared-contracts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
      - name: Generate exact checked-in contract closure
        run: |
          set -euo pipefail
          make sync-shared-contracts SHARED_CONTRACTS_DIR="$GITHUB_WORKSPACE/.shared-contracts"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @baobab-platform/cp-console generate:cp-client
          pnpm --filter @baobab-platform/cp-console check:cp-client
          echo "Embedded contract changes:"
          git status --short internal/contracts/shared frontend/src/generated/control-plane/openapi.d.ts
      - name: Commit only pinned generated artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/contracts/shared frontend/src/generated/control-plane/openapi.d.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(la05): sync exact pinned Shared schemas and regenerate Console client"
            git push origin HEAD:refs/heads/feat/la05-p2-staging-scope-vendor
          fi
