name: Temporary P-CAP-08 Go Format

on:
  push:
    branches:
      - feat/p-cap-08-ea-09-certification

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'gofmt repaired files')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Format Go sources
        run: gofmt -w cmd internal
      - name: Commit formatting when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- cmd internal; then
            echo "Go sources already formatted."
            exit 0
          fi
          echo "Formatting changed:"
          git diff --name-only -- cmd internal
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd internal
          git commit -m "chore(p-cap-08): gofmt repaired files"
          git push origin HEAD:"$GITHUB_REF_NAME"
