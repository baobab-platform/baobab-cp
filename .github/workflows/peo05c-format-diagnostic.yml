name: PEO05C formatting diagnostic (temporary)
on:
  push:
    branches:
      - feat/peo05c-provider-iam-runtime-adapters
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Show precise gofmt patch
        run: |
          gofmt -d internal/repository/postgres_peo05_bound_provider.go
          gofmt -d internal/service/organisation/founding_peo05_certified_providers.go
          gofmt -d internal/service/organisation/founding_peo05_certified_providers_test.go
          gofmt -d internal/service/organisation/founding_peo05_authenticated_iam.go
          gofmt -d internal/service/organisation/founding_peo05_authenticated_iam_test.go
