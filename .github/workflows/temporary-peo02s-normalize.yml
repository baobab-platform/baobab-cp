name: Temporary PEO-02S canonical format and Shared pin
on:
  push:
    branches: [feat/peo02s-governed-documentary-review-decisions]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: baobab-platform/shared
          token: ${{ secrets.SHARED_READ_TOKEN || github.token }}
          persist-credentials: false
          ref: daf40a46d333d4ff8eb3eb53e3adadea81695367
          path: .shared-contracts
      - name: Sync canonical Shared contract closure and format Go
        env:
          SHARED_CONTRACTS_DIR: ${{ github.workspace }}/.shared-contracts
        run: |
          set -euo pipefail
          make sync-shared-contracts
          gofmt -w api/peo02_documentary_review_handler.go api/peo02_documentary_review_handler_test.go api/router.go cmd/controlplane/main.go internal/store/postgres/peo02_governed_documentary_reviews.go internal/store/postgres/peo02_governed_documentary_reviews_test.go internal/store/postgres/migrate.go internal/store/postgres/migrate_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add api cmd internal/contracts/shared internal/store/postgres
            git commit -m "style(peo-02s): format Go and sync pinned Shared schemas"
            git push origin HEAD:refs/heads/feat/peo02s-governed-documentary-review-decisions
          fi
