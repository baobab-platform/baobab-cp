name: CX-05A typed-client regeneration (temporary)
on:
  push:
    branches: [feat/cx05-server-scoped-directory-table]
    paths:
      - .github/workflows/cx05a-regenerate.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'baobab-platform/baobab-cp' && github.ref == 'refs/heads/feat/cx05-server-scoped-directory-table'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Check immutable Shared source pin
        run: |
          set -euo pipefail
          test "$(grep -m1 'source_commit:' contracts.lock.yaml | awk '{print $2}')" = "2238596a4f79c70ca421bae82f0eb0655c8f3448"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
      - name: Generate control-plane types and format Go
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @baobab-platform/cp-console generate:cp-client
          pnpm --filter @baobab-platform/cp-console check:cp-client
          gofmt -w api/organisation_directory_page.go api/organisation_directory_page_test.go api/organisation_directory_handler.go api/router.go api/admin_shadow.go
      - name: Commit generated and formatted files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/generated/control-plane/openapi.d.ts api/organisation_directory_page.go api/organisation_directory_page_test.go api/organisation_directory_handler.go api/router.go api/admin_shadow.go
          if ! git diff --cached --quiet; then
            git commit -m "build(cx05a): regenerate pinned client and format paged directory"
            git push origin HEAD:refs/heads/feat/cx05-server-scoped-directory-table
          fi
