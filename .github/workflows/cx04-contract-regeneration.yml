name: CX-04 pinned contract and Go format bootstrap (temporary)
on:
  push:
    branches: [feat/cx04-authoritative-org360-integration]
    paths:
      - .github/workflows/cx04-contract-regeneration.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'baobab-platform/baobab-cp' && github.ref == 'refs/heads/feat/cx04-authoritative-org360-integration'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Validate exact Shared contract pin
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          pinned=$(grep -m1 'source_commit:' contracts.lock.yaml | awk '{print $2}')
          test "$pinned" = "2f0d671973154b7c63b4c45ef5011de52e81553b"
          echo "commit=$pinned" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: baobab-platform/shared
          token: ${{ secrets.SHARED_READ_TOKEN || github.token }}
          persist-credentials: false
          ref: ${{ steps.pin.outputs.commit }}
          path: .shared-contracts
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
      - name: Synchronise closure, regenerate OpenAPI types and format Go
        run: |
          set -euo pipefail
          cp .shared-contracts/contracts/organisation/v1/overview.schema.json internal/contracts/shared/organisation/v1/overview.schema.json
          make sync-shared-contracts SHARED_CONTRACTS_DIR="$GITHUB_WORKSPACE/.shared-contracts"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @baobab-platform/cp-console generate:cp-client
          pnpm --filter @baobab-platform/cp-console check:cp-client
          gofmt -w api/organisation_overview_handler.go api/organisation_overview_handler_test.go api/router.go cmd/controlplane/main.go
      - name: Commit only generated and formatted source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/contracts/shared frontend/src/generated/control-plane/openapi.d.ts api/organisation_overview_handler.go api/organisation_overview_handler_test.go api/router.go cmd/controlplane/main.go
          if ! git diff --cached --quiet; then
            git commit -m "build(cx04): sync pinned Shared overview contract and generated API types"
            git push origin HEAD:refs/heads/feat/cx04-authoritative-org360-integration
          fi
