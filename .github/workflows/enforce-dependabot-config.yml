# ==============================================================================
# BAOBAB Enterprise Platform
# Enforce Dependabot Config
#
# File: .github/workflows/enforce-dependabot-config.yml
#
# PURPOSE:
#   Delegates to baobab-platform/shared's reusable enforce-dependabot-config.yml —
#   fails CI if this repo's .github/dependabot.yml drifts from the org's
#   structural requirements (missing ecosystem entry, missing schedule,
#   missing labels, etc). Pairs with enforce-action-pinning.yml above the
#   same way it does in baobab-platform/shared itself.
#
#   Copied from baobab-platform/shared's
#   templates/caller-enforce-dependabot-config.yml verbatim — no
#   repo-specific adjustments were needed.
#
# CHANGE LOG (most recent first)
# ------------------------------------------------------------------------------
# * Initial version — this repo previously had no CI check guarding
#   .github/dependabot.yml against structural drift.
# ==============================================================================

name: Enforce Dependabot Config

on:
  push:
    branches: [main]
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/enforce-dependabot-config.yml"
      - "scripts/tests/test_dependency_maintenance.py"
      - "docs/security/dependency-maintenance.md"
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/enforce-dependabot-config.yml"
      - "scripts/tests/test_dependency_maintenance.py"
      - "docs/security/dependency-maintenance.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
    # SHA is baobab-platform/shared's v1.0.0 tag (annotated — peeled commit, not
    # the tag object's own SHA), re-verified live via
    # `git ls-remote --tags https://github.com/baobab-platform/shared.git v1.0.0`
    # on 2026-08-25.
    uses: baobab-platform/shared/.github/workflows/enforce-dependabot-config.yml@31de2bc3dcd56128c019c640dc7e12c10ae9ca69 # v2.3.0
    with:
      required-ecosystems: "github-actions,gomod,npm,docker,docker-compose"

offline-policy-regression:
    name: BA-SEC-DEP-001 source and negative fixtures
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout the exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap isolated pinned YAML test runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ba-sec-dep"
          "$RUNNER_TEMP/ba-sec-dep/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Exercise real manifests, grouped routine updates and negative cases
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ba-sec-dep/bin/python" -B -m unittest discover -s scripts/tests -p 'test_dependency_maintenance.py' -v
