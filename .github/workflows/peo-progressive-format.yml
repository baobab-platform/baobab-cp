name: Format additional progressive business identity code (temporary)
on:
  pull_request:
    paths:
      - internal/service/progressive/business_identity*
      - .github/workflows/peo-progressive-format.yml
permissions:
  contents: write
jobs:
  gofmt:
    if: >-
      github.event.pull_request.head.repo.full_name == 'baobab-platform/baobab-cp' &&
      github.event.pull_request.head.ref == 'feat/peo-02-03-progressive-admission-runtime'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: gofmt -w internal/service/progressive/business_identity.go internal/service/progressive/business_identity_test.go
      - run: |
          if git diff --quiet -- internal/service/progressive; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/service/progressive/business_identity.go internal/service/progressive/business_identity_test.go
          git commit -m 'style(peo-03): canonical gofmt for Shared v2 business claims'
          git push origin 'HEAD:refs/heads/feat/peo-02-03-progressive-admission-runtime'
