name: CX05 bounded contract client regeneration
on:
  push:
    branches: [feat/cx05n-shared-dataset-sync]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'baobab-platform/baobab-cp' && github.head_ref == 'feat/cx05n-shared-dataset-sync'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: feat/cx05n-shared-dataset-sync
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: frontend/.node-version
      - name: Use immutable package-lock dependency tree
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Regenerate only checked-in client types from pinned OpenAPI
        run: corepack pnpm --filter @baobab-platform/cp-console generate:cp-client
      - name: Commit regenerated types only
        run: |
          set -euo pipefail
          git add frontend/src/generated/control-plane/openapi.d.ts
          if git diff --cached --quiet; then
            echo "No client changes"
            exit 0
          fi
          git config user.name 'baobab-contract-sync[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(cx05n): regenerate pinned OpenAPI TypeScript types'
          git push origin HEAD:feat/cx05n-shared-dataset-sync
