name: PEO-03K one-off gofmt
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
  push:
    branches: [feat/peo03k-scanned-custody-candidate-ledger]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'baobab-platform/baobab-cp'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          set -euo pipefail
          gofmt -w internal/verification/authority/{scanned_document_vault,candidate_envelope,scanned_custody_test}.go
          gofmt -w internal/repository/postgres_document_candidates.go
          gofmt -w internal/service/verification/{document_custody_reader,document_custody_reader_test,document_custody_postgres_integration_test}.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/verification/authority internal/repository/postgres_document_candidates.go internal/service/verification
            git commit -m "style(peo03k): format scanned custody and candidate ledger"
            git push origin HEAD:feat/peo03k-scanned-custody-candidate-ledger
          fi
