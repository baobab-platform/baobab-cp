name: CX-04B contract and formatting bootstrap (temporary)
on:
  push:
    branches: [feat/cx04b-governed-directory-services]
    paths:
      - .github/workflows/cx04b-regenerate.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'baobab-platform/baobab-cp' && github.ref == 'refs/heads/feat/cx04b-governed-directory-services'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Validate exact Shared contract pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -m1 'source_commit:' contracts.lock.yaml | awk '{print $2}')" = "9edcab1c219c83b34a9be688b2fc5605f4288cf7"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
      - name: Regenerate API client and format Go source
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @baobab-platform/cp-console generate:cp-client
          pnpm --filter @baobab-platform/cp-console check:cp-client
          gofmt -w api/organisation_overview_handler.go api/organisation_directory_handler.go api/organisation_tenant_overview.go api/organisation_directory_handler_test.go api/router.go api/admin_shadow.go internal/repository/postgres_console_overview.go
      - name: Commit generated assets only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/generated/control-plane/openapi.d.ts api/organisation_overview_handler.go api/organisation_directory_handler.go api/organisation_tenant_overview.go api/organisation_directory_handler_test.go api/router.go api/admin_shadow.go internal/repository/postgres_console_overview.go
          if ! git diff --cached --quiet; then
            git commit -m "build(cx04b): regenerate Shared client and format authority-scoped readers"
            git push origin HEAD:refs/heads/feat/cx04b-governed-directory-services
          fi
