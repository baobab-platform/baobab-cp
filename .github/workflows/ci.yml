name: Go CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    # A real PostgreSQL 17 instance so the *_integration_test.go suites
    # (migrations, exclusion constraints, tenant lifecycle) actually run in
    # CI instead of always hitting their `TEST_DATABASE_URL not set` skip -
    # see docs/reconciliation/shared-control-plane-audit.md §4, "Database CI
    # SHALL directly test... against PostgreSQL 17, not an SQLite
    # substitute" (BCP-DB-001 §24).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: baobab_cp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/baobab_cp_ci?sslmode=disable
      SHARED_CONTRACTS_DIR: ${{ github.workspace }}/.shared-contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin integrity + contract-compatibility (§16/§10.5 of
      # docs/reconciliation/shared-control-plane-audit.md): check out
      # baobab-platform/shared at exactly the commit contracts.lock.yaml pins, so
      # internal/contracttest's tests validate this repository's payloads
      # against the same schemas it declares a dependency on - not
      # whatever baobab-platform/shared's default branch happens to contain today.
      - name: Read immutable shared-contract pin
        id: pin
        run: echo "commit=$(grep -m1 'commit:' contracts.lock.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Checkout baobab-platform/shared at pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: baobab-platform/shared
          token: ${{ secrets.SHARED_READ_TOKEN || github.token }}
          persist-credentials: false
          ref: ${{ steps.pin.outputs.commit }}
          path: .shared-contracts
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: LA03 temporary gofmt capture
        run: |
          gofmt -l cmd internal > /tmp/la03-gofmt-list
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            gofmt -w "$file"
            printf 'LA03_FORMATTED_FILE:%s:' "$file"
            base64 -w0 "$file"
            printf '\n'
          done < /tmp/la03-gofmt-list
      - run: go test -race ./...
      - name: Test NBO founding-enterprise fixture guardrails
        run: python3 -m unittest discover -s scripts/showcase -p 'test_nbo_*.py'
      - name: Prove founding-enterprise fixture dry-run has no side effects
        run: python3 scripts/showcase/nbo_apply.py --manifest docs/showcase/fixtures/nabhold-group-v1.json
      - run: go vet ./...
      - run: test -z "$(gofmt -l cmd internal)"
