version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message: { prefix: "ci" }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message: { prefix: "build" }
    groups:
      go-modules: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message: { prefix: "build" }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message: { prefix: "build" }
    groups:
      frontend: { patterns: ["*"], update-types: ["minor", "patch"] }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message: { prefix: "build" }
