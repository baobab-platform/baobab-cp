# BA-SEC-DEP-001 — Approved Dependency & Security Maintenance Policy v1.0.
# Source of truth: baobab-platform/shared/docs/governance/baobab-dependency-security-maintenance-policy-v1.0.md
# Routine groups are version updates only. Advisory-driven security updates
# target default branch independently; never set redundant target-branch.
# Major changes to Go, Node, Docker runtimes and privileged workflows require
# separate review, provenance, native authority negatives and consumer tests.
# npm covers the root pnpm workspace (frontend/ and pnpm-lock.yaml).
# The DEV-10 pnpm 12 TWO-DOCUMENT lockfile has a known GitHub dependency-graph
# detection gap: see docs/security/dependency-maintenance.md. Do not infer
# effective security Alerts from successful Dependabot version updates.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-routine:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:10"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      go-routine:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:20"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      frontend-routine:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:40"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:50"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: "build"
      include: "scope"
