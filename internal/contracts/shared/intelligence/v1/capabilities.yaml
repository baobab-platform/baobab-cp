# contracts/intelligence/v1/capabilities.yaml
#
# Canonical capability definitions for the first Baobab Intelligence tranche.
#
# Authority:
#   ADR-SHARED-017 — canonical capability governance
#   ADR-SHARED-025 — intelligence namespace / Pulse provider boundary
#   ADR-SHARED-029 — Pulse capability census and first canonical tranche
#
# These definitions specify WHAT an Intelligence provider may be asked to do.
# They do not imply provider implementation, certification, Control Plane
# registration, activation, binding, grants, entitlement or health.

schema:
  name: baobab-capability-definitions
  version: "1.0"

capabilities:
  - capability_key: intelligence.evidence.search
    name: Search intelligence evidence
    description: >-
      Search the authorised Pulse evidence corpus using provider-neutral semantic
      retrieval and return canonical evidence identities plus retrieval freshness.
      Tenant scope comes from caller-bound Control Plane context; operation
      authority and classification clearance come from the authenticated Pulse
      resource-server token. The capability does not expose vector-store identities,
      embeddings or provider-specific retrieval structures.
    domain: intelligence
    owner: baobab-pulse
    lifecycle: DRAFT
    maturity: EXPERIMENTAL
    contracts:
      - major: 1
        request_schema: domain.schema.json#/$defs/evidenceSearchRequest
        response_schema: domain.schema.json#/$defs/evidenceSearchResponse
        error_schema: ../../errors/v1/problem-details.schema.json
    data_classification: TENANT_CONFIDENTIAL
    metadata:
      authority: ADR-SHARED-031
      provider_implementation: p-cap-07-readiness-governed

  - capability_key: intelligence.research-mission.manage
    name: Manage intelligence research mission
    description: >-
      Create or retrieve a governed research mission that frames an intelligence
      question, evidence expectations, scope, classification and confidence
      requirement without exposing Haystack, model-provider or pipeline internals.
      Tenant scope comes from caller-bound Control Plane context; operation and
      classification authority come from the authenticated Pulse resource-server
      token. This capability owns the Pulse research workflow only; it does not
      confer authority over operational engines or regulatory decisions.
    domain: intelligence
    owner: baobab-pulse
    lifecycle: DRAFT
    maturity: EXPERIMENTAL
    contracts:
      - major: 1
        request_schema: domain.schema.json#/$defs/researchMissionManageRequest
        response_schema: domain.schema.json#/$defs/researchMissionResponse
        error_schema: ../../errors/v1/problem-details.schema.json
    data_classification: TENANT_CONFIDENTIAL
    metadata:
      authority: ADR-SHARED-031
      provider_implementation: p-cap-07-readiness-governed
