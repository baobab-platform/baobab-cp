# contracts/regulations/v1/capabilities.yaml
#
# Canonical capability definitions for the Regulations domain.
#
# Authority:
#   ADR-SHARED-017 — canonical capability governance
#   ADR-SHARED-022 — Regulations ↔ Trade Docs documentary exchange
#   ADR-SHARED-027 — Regulations capability census and first canonical tranche
#   ADR-SHARED-028 — Canonical regulatory decision evaluation contract
#
# These definitions describe WHAT the platform can request from a Regulations
# provider. Provider implementation state is governed by the engine declaration;
# certification and activation remain separate authorities.
#
# RTD-06 established complete Shared request/response schemas for these two
# operations. ADR-SHARED-027 catalogued the first documentary vocabulary.
# ADR-SHARED-028 / R-CAP-08 contracts the broader deterministic decision
# evaluation surface. Provider implementation, certification and activation
# remain separate governance facts.

schema:
  name: baobab-capability-definitions
  version: "1.0"

capabilities:
  - capability_key: regulations.decision.evaluate
    name: Evaluate regulatory decision
    description: >-
      Evaluate a declared regulatory question against an authorised caller-bound
      PlatformContext, pinned Regulations rule-set, explicit legal/knowledge time,
      bounded typed facts and pinned evidence references, producing a
      Regulations-owned deterministic RegulatoryDecision with structured reasons,
      legal/evidence provenance and replay identity. The capability is
      provider-neutral and never performs operational business-state enforcement.
    domain: regulations
    owner: baobab-regulations
    lifecycle: DRAFT
    maturity: EXPERIMENTAL
    contracts:
      - major: 1
        request_schema: ../../regulatory-decision/v1/domain.schema.json#/$defs/decisionEvaluateRequest
        response_schema: ../../regulatory-decision/v1/domain.schema.json#/$defs/decisionEvaluateResponse
        error_schema: ../../errors/v1/problem-details.schema.json
    data_classification: TENANT_CONFIDENTIAL
    metadata:
      authority: ADR-SHARED-028
      openapi_operation: evaluateRegulatoryDecision
      provider_implementation: governed-by-engine-declaration

  - capability_key: regulations.evidence.assess
    name: Assess regulatory documentary evidence
    description: >-
      Assess bounded documentary facts and exact Trade Docs DocumentVersion
      references against one pinned Regulations requirement in an authorised
      Control Plane context, producing a Regulations-owned evidence-sufficiency
      result and, where applicable, a resulting RegulatoryDecision reference.
      The capability never mutates a TradeDocument or operational shipment state.
    domain: regulations
    owner: baobab-regulations
    lifecycle: DRAFT
    maturity: EXPERIMENTAL
    contracts:
      - major: 1
        request_schema: ../../regulatory-document-exchange/v1/domain.schema.json#/$defs/documentEvidenceAssessmentRequest
        response_schema: ../../regulatory-document-exchange/v1/domain.schema.json#/$defs/documentEvidenceAssessmentResult
        error_schema: ../../errors/v1/problem-details.schema.json
        event_schemas:
          - ../../regulatory-document-exchange/v1/events.schema.json#/$defs/requirementSatisfactionEvaluatedEventData
    data_classification: TENANT_CONFIDENTIAL
    metadata:
      authority: ADR-SHARED-022
      openapi_operation: assessDocumentaryEvidence
      provider_implementation: governed-by-engine-declaration

  - capability_key: regulations.requirement.resolve
    name: Resolve regulatory documentary requirement
    description: >-
      Resolve the exact pinned Regulations-owned documentary, permit or evidence
      requirement projection for an authorised tenant context and canonical
      Regulations references. This capability resolves an existing requirement;
      it does not create a TradeDocument and does not replace broader regulatory
      applicability or decision evaluation.
    domain: regulations
    owner: baobab-regulations
    lifecycle: DRAFT
    maturity: EXPERIMENTAL
    contracts:
      - major: 1
        request_schema: ../../regulatory-document-exchange/v1/domain.schema.json#/$defs/requirementResolveRequest
        response_schema: ../../regulatory-document-exchange/v1/domain.schema.json#/$defs/requirementResolveResponse
        error_schema: ../../errors/v1/problem-details.schema.json
    data_classification: TENANT_CONFIDENTIAL
    metadata:
      authority: ADR-SHARED-022
      openapi_operation: resolveDocumentaryRequirement
      provider_implementation: governed-by-engine-declaration
