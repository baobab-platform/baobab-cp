schema:
  name: baobab-capability-definitions
  version: '1.0'
capabilities:
- capability_key: finance.journal.manage
  name: Manage governed journal lifecycle
  description: Corporate finance F1 manage governed journal lifecycle scoped by current CP authority and ERP FinanceBaseline; provider support is not implied.
  domain: finance
  owner: baobab-erp
  lifecycle: DRAFT
  maturity: EXPERIMENTAL
  contracts:
  - major: 1
    request_schema: journal-manage-request.schema.json
    response_schema: journal-manage-response.schema.json
    error_schema: ../../errors/v1/problem-details.schema.json
  data_classification: RESTRICTED
