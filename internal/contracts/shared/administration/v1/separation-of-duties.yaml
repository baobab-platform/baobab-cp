# ADR-BCP-020 sections 36-39 (gate ADA-06): separation-of-duties policy.
#
# Shared owns the shape and the default policies; the Control Plane
# evaluates them when it plans and when it decides a grant change
# (changeset-lifecycle.yaml ADMINISTRATIVE_GRANT_ISSUANCE and
# ADMINISTRATIVE_GRANT_DELEGATION). A policy only ever adds a requirement:
# no policy relaxes the grant rules in grant.schema.json or lifecycle.yaml.
#
# actors are the parties to a grant change:
#   requester  who asked for it (the changeset's requested_by)
#   approver   who decided it (the changeset's approval decided_by)
#   grantee    the principal the authority is for
# minimum_distinct_actors counts the distinct principals among them. A
# policy that applies is breached when fewer are distinct, and the change is
# refused with SEPARATION_OF_DUTIES_VIOLATION (SELF_APPROVAL_PROHIBITED where
# the approver is the requester or grantee).
#
# conflicting_permissions are sets of permissions one principal may not hold
# live at the same time. None are declared by default: the owner defines
# them (ADR-BCP-020 section 37 gives examples, not rules). The mechanism is
# in place so adding a set is a Shared change, not a Control Plane change.
version: 1
policies:
  - id: sod-privileged-grant-independent-approval
    description: >-
      Requester, approver and grantee of a HIGH or CRITICAL grant change are
      three different principals. Nobody requests authority for themselves,
      approves their own request, or approves authority for themselves
      (sections 37, 39).
    applies_to:
      change_kinds: [ADMINISTRATIVE_GRANT_ISSUANCE, ADMINISTRATIVE_GRANT_DELEGATION]
    risk_threshold: HIGH
    actors: [requester, approver, grantee]
    minimum_distinct_actors: 3
    status: ACTIVE
  - id: sod-critical-grant-bounded
    description: >-
      A CRITICAL grant is never STANDING and lasts at most
      maximum_duration_days (section 40: risk may influence duration). This
      matches the bootstrap bound of sections 128-129. A proposed default,
      pending owner confirmation.
    applies_to:
      change_kinds: [ADMINISTRATIVE_GRANT_ISSUANCE]
    risk_threshold: CRITICAL
    allowed_grant_types: [TIME_BOUND, JUST_IN_TIME]
    maximum_duration_days: 30
    status: ACTIVE
conflicting_permissions: []
