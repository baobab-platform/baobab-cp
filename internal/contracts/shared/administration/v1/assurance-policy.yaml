# ADR-BCP-020 sections 72-74 (gate ADA-07): authentication assurance policy
# for administrative authority.
#
# Shared owns the ladder and the default requirements; the Control Plane
# reads the session's assurance from the verified token and evaluates them
# (administration.Evaluate). Baobab IAM owns the mechanism that produces the
# assurance (section 72): the raw_acr_values below are what IAM's realm
# issues today (realm attribute acr.loa.map {silver: 1, gold: 2}; the
# "Baobab - Step-Up" flow at loa-condition-level 2 with loa-max-age 300 is
# the only flow that sets a level; Keycloak emits no amr by default) and are
# the one place this file depends on IAM. Changing IAM's vocabulary is a
# change to this file first.
#
# Assurance is never permission (section 74): meeting a requirement lets a
# grant be used, it never creates authority. A policy only ever adds a
# requirement; it never relaxes a grant's own conditions.minimum_acr.
#
# Rules the evaluator applies, in this order:
#   1. The session's rank is that of the level whose raw_acr_values contain
#      the token's acr. An absent or unlisted acr has no rank: it meets no
#      requirement above basic (fail closed), and so cannot be mistaken for a
#      level. The basic level is any verified authentication.
#   2. A grant's conditions.minimum_acr names a level here. A name the ladder
#      does not list is never met (fail closed) and a grant naming one is
#      refused at issuance.
#   3. A session meets a level when its rank is at least the level's rank.
#      A level IAM does not issue (issuable: false) is met by no session.
#   4. When the requirement sets max_authentication_age_seconds, the session's
#      latest authentication (step_up_at, else auth_time) is no older and no
#      later than now (a future time is not fresh).
#   5. When phishing_resistant_required, at least one amr value is in
#      phishing_resistant_methods.
#   6. The effective requirement is the strictest of the grant's own
#      minimum_acr and the requirement for the grant's risk class.
version: 1
levels:
  - name: urn:baobab:acr:basic
    rank: 0
    description: >-
      Authenticated by the realm (a first-factor login, or an existing SSO
      session). IAM's "Baobab forms" flow sets no level, so a password login
      carries acr "1" and a reused SSO session "0". Privileged users also
      present OTP in that flow, but it is not distinguishable by acr.
    issuable: true
    raw_acr_values: ["0", "1"]
  - name: urn:baobab:acr:mfa
    rank: 1
    description: >-
      A second factor was presented on demand by the "Baobab - Step-Up" flow
      (loa-condition-level 2, IAM LoA "gold", loa-max-age 300): the only IAM
      path that asserts a second factor through acr today.
    issuable: true
    raw_acr_values: ["2", "gold"]
  - name: urn:baobab:acr:step-up
    rank: 2
    description: >-
      Phishing-resistant step-up. IAM issues no such level yet, so nothing
      meets it: a requirement at this level is unmet until IAM adds a flow
      and this file lists the acr it emits.
    issuable: false
    raw_acr_values: []
phishing_resistant_methods: [hwk, webauthn]
requirements:
  # ADR-BCP-020 section 72: ordinary use needs a normal session, privileged
  # configuration needs MFA, critical configuration needs phishing-resistant
  # step-up.
  - risk_class: LOW
    minimum_acr: urn:baobab:acr:basic
  - risk_class: MODERATE
    minimum_acr: urn:baobab:acr:basic
  - risk_class: HIGH
    minimum_acr: urn:baobab:acr:mfa
  - risk_class: CRITICAL
    minimum_acr: urn:baobab:acr:step-up
    max_authentication_age_seconds: 300
    phishing_resistant_required: true
