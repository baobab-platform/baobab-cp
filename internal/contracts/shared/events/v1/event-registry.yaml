# contracts/events/v1/event-registry.yaml
#
# The Canonical Event Registry (ADR-SHARED-018 SS3.3). Conforms to
# event-registry.schema.json. It is the platform index of canonical event
# types: it indexes the AsyncAPI definitions and does not replace them. The
# payload schema of a type is the one its AsyncAPI message declares.
#
# Rules (scripts/event_contexts.py, run in Shared CI):
#   - entries are unique and sorted by type, and correspond one to one with
#     the messages of every contracts/*/v*/asyncapi.yaml;
#   - the context is registered, not RESERVED, and a DEPRECATED context
#     accepts only its frozen_types;
#   - an ACTIVE, DEPRECATED or RETIRED type has exactly one producer, and
#     that producer is a steward of its context; a PROPOSED type is a
#     defined contract whose producer authority is not yet assigned;
#   - the name follows the SS3.4 hygiene rules unless an already-published
#     type carries an explicit naming_exception;
#   - `supersedes` is the only place in contracts/ where a legacy
#     com.nabhold.* type may appear.
#
# Producers are recorded only where Shared carries the evidence: a
# package's stated runtime authority, the owner of the capability whose
# related_events name the type, or an accepted ADR.

