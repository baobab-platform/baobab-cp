# contracts/capability/v1/registration-bundles.yaml
#
# TRANSITIONAL (ADR-SHARED-017 SS30, SS32). Conforms to
# registration.schema.json#/$defs/RegistrationBundleIndex.
#
# The explicit list of EngineRegistration bundles the Control Plane
# bootstraps providers from while provider registration still ships inside
# Shared. It replaces the Control Plane's discovery of any embedded file
# whose name ends in "/capabilities.json": membership is stated here, not
# inferred from a file name or extension.
#
# Each bundle's capabilities must equal the canonical definitions in
# catalogue.yaml, and scripts/capability_catalogue.py generates the same
# shape from those definitions plus an engine's provider declaration.
# Every EngineRegistration in contracts/ must be listed here (CI enforces).
#
# This file is removed once providers register through governed provider
# registration from engine provider declarations (EA-02E) rather than from
# Shared.

schema:
  name: baobab-engine-registration-bundle-index
  version: "1.0"

bundles:
  - path: intelligence/v1/pulse-registration.json
    engine_id: baobab-pulse
    provider_key: baobab-pulse.core
  - path: payments/v1/capabilities.json
    engine_id: baobab-payments
    provider_key: baobab-payments.sandbox
  - path: subscriptions/v1/capabilities.json
    engine_id: baobab-subscriptions
    provider_key: baobab-subscriptions.temporary-billing
