    source: ../../trade/v1/capabilities.yaml
  - capability_key: commercial.quotation.manage
    owner: baobab-trade
    source: ../../trade/v1/capabilities.yaml
  - capability_key: commercial.rfq.manage
    owner: baobab-trade
    source: ../../trade/v1/capabilities.yaml
  - capability_key: finance.order-consequence.process
    owner: baobab-erp
    source: ../../erp/v1/capabilities.yaml
  - capability_key: payment.intent.cancel
    owner: baobab-payments
    source: ../../payments/v1/capabilities.yaml
  - capability_key: payment.intent.create
    owner: baobab-payments
    source: ../../payments/v1/capabilities.yaml
  - capability_key: payment.payment.authorize
