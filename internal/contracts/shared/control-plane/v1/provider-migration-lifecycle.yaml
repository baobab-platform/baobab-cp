# The ProviderMigration lifecycle (ADR-BCP-006 sections 45-52). Stages are
# the migration's own lifecycle; ExecutionOperation status is separate
# (execution-operation.schema.json) and is never folded into it.
#
# A migration is created in PLAN with a side-effect-free plan. Every advance
# past PLAN is a controlled mutation (ADR-BCP-021): it requires an approval
# bound to the current plan's digest and a plan without blockers, and runs as
# a durable operation (ADR-BCP-022). CANARY and SHIFT move one cohort at a
# time, in the request's order; VALIDATE follows each cohort.
id: baobab-platform.control-plane.provider-migration-lifecycle.v1
# Section 45's DISCOVER is the side-effect-free preview
# (POST /provider-migrations/plan), never a stage a migration is in: a
# created migration has already been discovered and starts in PLAN.
initial_state: PLAN
terminal_states:
  - COMPLETE
  - CANCELLED
  - ROLLED_BACK
states:
  PLAN:
    transitions:
      replan: PLAN
      prepare: PREPARE
      cancel: CANCELLED
  PREPARE:
    # The target is registered, contract-compatible, provisioned, healthy,
    # configured and bound in MIGRATION mode before it receives authoritative
    # traffic (section 48).
    transitions:
      shadow: SHADOW
      canary: CANARY
      cancel: CANCELLED
  SHADOW:
    # Comparison only; shadow never determines a result (sections 41, 49).
    transitions:
      canary: CANARY
      cancel: CANCELLED
  CANARY:
    # The first cohort (sections 50-51).
    transitions:
      validate: VALIDATE
      roll_back: ROLLED_BACK
  SHIFT:
    # Each later cohort in turn (section 52).
    transitions:
      validate: VALIDATE
      roll_back: ROLLED_BACK
  VALIDATE:
    # A cohort passed validation: the next cohort shifts, or, after the last,
    # the source bindings retire.
    transitions:
      shift: SHIFT
      retire_old: RETIRE_OLD
      roll_back: ROLLED_BACK
  RETIRE_OLD:
    transitions:
      complete: COMPLETE
# The one-and-only authoritative writer rule (sections 55-56) as a
# constraint on every STATEFUL_CUTOVER cohort's steps, in order.
stateful_cohort_sequence:
  - FREEZE_COHORT_WRITES
  - MIGRATE_COHORT_DATA
  - RECONCILE_COHORT_DATA
  - SHIFT_COHORT
  - UNFREEZE_COHORT_WRITES
# Codes a ProviderMigrationPlan may carry as blockers; each is registered in
# authorization/v1/reason-code-registry.yaml under provider_migration_blocker.
blocking_codes:
  - MIGRATION_SOURCE_NOT_BOUND
  - MIGRATION_TARGET_NOT_REGISTERED
  - MIGRATION_TARGET_NOT_SUPPORTED
  - MIGRATION_TARGET_CONTRACT_INCOMPATIBLE
  - MIGRATION_TARGET_UNHEALTHY
  - MIGRATION_TARGET_NOT_ELIGIBLE
  - MIGRATION_CONTEXT_UNASSIGNED
  - MIGRATION_COHORT_OVERLAP
  - MIGRATION_SHADOW_UNSAFE
  - MIGRATION_ALREADY_IN_PROGRESS
# Codes a plan may carry as warnings: they never block, and are not reason
# codes.
warning_codes:
  - MIGRATION_NOT_REVERSIBLE
  - MIGRATION_COHORT_EMPTY
# ADR-SHARED-016 section 2: the approved plan's operations each command
# transition runs, in plan order. `scope` says which of the plan's steps:
# MIGRATION-wide steps, the first cohort's, the next cohort's, or the
# current cohort's. A transition runs only the listed operations the plan
# actually contains: a STATELESS_REBIND cohort has SHIFT_COHORT only, and
# STOP_SHADOW is planned only when shadowing was requested.
stage_steps:
  prepare:
    scope: MIGRATION
    operations: [VERIFY_TARGET_READINESS, CREATE_MIGRATION_BINDING]
  shadow:
    scope: MIGRATION
    operations: [START_SHADOW]
  canary:
    scope: FIRST_COHORT
    operations: [STOP_SHADOW, FREEZE_COHORT_WRITES, MIGRATE_COHORT_DATA, RECONCILE_COHORT_DATA, SHIFT_COHORT, UNFREEZE_COHORT_WRITES]
  validate:
    scope: CURRENT_COHORT
    operations: [VALIDATE_COHORT]
  shift:
    scope: NEXT_COHORT
    operations: [FREEZE_COHORT_WRITES, MIGRATE_COHORT_DATA, RECONCILE_COHORT_DATA, SHIFT_COHORT, UNFREEZE_COHORT_WRITES]
  retire_old:
    scope: MIGRATION
    operations: [RETIRE_SOURCE_BINDING]
  complete:
    scope: MIGRATION
    operations: []
# ADR-SHARED-016 sections 3-4: the operations engines perform as engine
# migration tasks (engine-migration-task.schema.json), and the role of the
# instance each is assigned to, going forward and in rollback. Every other
# operation the Control Plane runs on its own state and never calls a
# provider. At every moment at most one side accepts a cohort's writes.
engine_steps:
  FREEZE_COHORT_WRITES:
    forward: [SOURCE]
    reverse: [TARGET]
  MIGRATE_COHORT_DATA:
    forward: [TARGET]
    reverse: [SOURCE]
  RECONCILE_COHORT_DATA:
    forward: [SOURCE, TARGET]
    reverse: [SOURCE, TARGET]
  UNFREEZE_COHORT_WRITES:
    forward: [TARGET]
    reverse: [SOURCE]
# ADR-SHARED-016 section 5: what roll_back runs for each cohort whose
# authority moved, most recent first, by the request's rollback_strategy,
# followed by REMOVE_MIGRATION_BINDING. A STATELESS_REBIND migration runs
# only the operations that are not engine_steps. FORWARD_FIX_ONLY refuses
# roll_back once any cohort's authority moved (MIGRATION_NOT_REVERSIBLE);
# before that, it only releases a cohort frozen mid-step.
rollback_steps:
  REBIND_SOURCE: [FREEZE_COHORT_WRITES, SHIFT_COHORT, UNFREEZE_COHORT_WRITES]
  RESTORE_AND_REBIND_SOURCE: [FREEZE_COHORT_WRITES, MIGRATE_COHORT_DATA, RECONCILE_COHORT_DATA, SHIFT_COHORT, UNFREEZE_COHORT_WRITES]
  FORWARD_FIX_ONLY: []
# What cancel runs: it is valid only before any cohort's authority moved.
compensation:
  cancel: [STOP_SHADOW, REMOVE_MIGRATION_BINDING]
# ADR-SHARED-016 section 4: an engine migration task's lease and default
# deadline.
task_lease_seconds: 300
task_default_deadline_hours: 24
