# The canonical Changeset lifecycle (ADR-BCP-021 sections 15-33, 49-58,
# 103-105, 113-118). ExecutionOperation status is the operation's own
# lifecycle (execution-operation.schema.json) and is never folded into this
# one: an operation SUCCEEDED does not mean the changeset is COMPLETED.
#
# Every transition is a command, named by the operation that requests it, or
# a system transition the Control Plane takes. No state is a dead end: a
# changeset that cannot proceed is replanned, cancelled, or ends terminally.
id: baobab-platform.control-plane.changeset-lifecycle.v1
initial_state: DRAFT
terminal_states:
  - INVALID
  - REJECTED
  - COMPLETED
  - CANCELLED
  - SUPERSEDED
  - EXPIRED
  - COMPENSATED
states:
  DRAFT:
    # The only mutable state (section 210).
    transitions:
      submit: VALIDATING
      cancel: CANCELLED
  VALIDATING:
    transitions:
      validated: PLANNING
      invalidate: INVALID
  PLANNING:
    # Side-effect free (section 20).
    transitions:
      planned: PLANNED
      block: BLOCKED
  BLOCKED:
    transitions:
      submit: VALIDATING
      cancel: CANCELLED
  PLANNED:
    transitions:
      request_approval: AWAITING_APPROVAL
      cancel: CANCELLED
  AWAITING_APPROVAL:
    # One decision on the exact current plan; the approver is never the
    # requester (sections 24, 49-52).
    transitions:
      approve: APPROVED
      reject: REJECTED
      request_changes: CHANGES_REQUESTED
      expire: EXPIRED
      supersede: SUPERSEDED
      cancel: CANCELLED
  CHANGES_REQUESTED:
    # Revision produces a new plan version; earlier decisions stay (section 58).
    transitions:
      submit: VALIDATING
      cancel: CANCELLED
  APPROVED:
    # Apply-time revalidation: a stale plan cannot be applied and needs a
    # new plan and a new approval (sections 29-30, 71).
    transitions:
      apply: APPLYING
      schedule: SCHEDULED
      submit: VALIDATING
      expire: EXPIRED
      cancel: CANCELLED
  SCHEDULED:
    # Scheduling is not approval (section 123).
    transitions:
      start: APPLYING
      cancel: CANCELLED
  APPLYING:
    # The changeset follows its operation (execution-operation.schema.json):
    # SUCCEEDED -> applied; FAILED with no step effective -> fail;
    # FAILED or CANCELLED after a step took effect -> partially_apply;
    # CANCELLED before any step took effect -> operation_cancelled;
    # COMPENSATED -> compensate. Cancelling an applying changeset is always
    # a cancel of its operation (section 104), never of the changeset.
    transitions:
      applied: VERIFYING
      fail: FAILED
      partially_apply: PARTIALLY_APPLIED
      operation_cancelled: CANCELLED
      compensate: COMPENSATED
  VERIFYING:
    transitions:
      complete: COMPLETED
      fail_verification: VERIFICATION_FAILED
  FAILED:
    # No hidden partial failure (section 100): a failed apply is retried as
    # the same operation or compensated.
    transitions:
      retry: APPLYING
      compensate: COMPENSATED
  PARTIALLY_APPLIED:
    transitions:
      retry: APPLYING
      compensate: COMPENSATED
  VERIFICATION_FAILED:
    transitions:
      reverify: VERIFYING
      compensate: COMPENSATED
triggers:
  # Commands name the Shared operationId that requests them.
  commands:
    submit: submitChangeset
    cancel: cancelChangeset
    approve: decideChangesetPlan
    reject: decideChangesetPlan
    request_changes: decideChangesetPlan
    apply: applyChangeset
    retry: retryOperation
  system:
    - validated
    - invalidate
    - planned
    - block
    - request_approval
    - expire
    - supersede
    - schedule
    - start
    - applied
    - fail
    - partially_apply
    - operation_cancelled
    - complete
    - fail_verification
    - reverify
    - compensate
# The change kinds this version supports: the target resource each acts on,
# the changeset type it derives, the target status it requires and produces
# (in that resource's own lifecycle vocabulary), and the canonical operations
# its plan runs, in order. approval_scope, where set, is the scope the
# approver must also hold, so a changeset never grants authority the
# resource's direct route would refuse (ADR-BCP-020, ADR-BCP-021 section 24).
change_kinds:
  TENANT_SUSPENSION:
    target: TENANT
    changeset_type: SUSPEND
    from_status: [active]
    to_status: suspended
    operations: [SUSPEND_TENANT, VERIFY_TENANT_STATE]
  TENANT_REINSTATEMENT:
    target: TENANT
    changeset_type: REINSTATE
    from_status: [suspended]
    to_status: active
    operations: [REINSTATE_TENANT, VERIFY_TENANT_STATE]
  # The governed path to market-lifecycle.yaml activate. activateMarket
  # stays served; both require an approver who is neither the market's
  # creator nor its last editor.
  MARKET_ACTIVATION:
    target: MARKET
    changeset_type: MODIFY
    from_status: [VALIDATED]
    to_status: ACTIVE
    approval_scope: "market:approve"
    operations: [ACTIVATE_MARKET, VERIFY_MARKET_STATE]
  # The governed path to mapping activation (ADR-SHARED-013). activateMapping
  # stays served; both require an approver who is not the mapping's creator.
  MAPPING_ACTIVATION:
    target: MAPPING
    changeset_type: MODIFY
    from_status: [VALIDATED]
    to_status: ACTIVE
    approval_scope: "mapping:approve"
    operations: [ACTIVATE_MAPPING, VERIFY_MAPPING_STATE]
  # EA-02D. The only path from a registered (DRAFT) capability provider to
  # ACTIVE: registration never activates a provider (EA-02C, capability/v1
  # registration.schema.json). There is no direct activation route. The
  # plan runs every plan_check, side-effect free, and records each failure
  # as a blocker with its code, so a blocked plan cannot be approved. The
  # approver holds provider:approve and is never the requester.
  PROVIDER_ACTIVATION:
    target: PROVIDER
    changeset_type: MODIFY
    from_status: [DRAFT]
    to_status: ACTIVE
    approval_scope: "provider:approve"
    operations: [ACTIVATE_PROVIDER, VERIFY_PROVIDER_STATE]
    plan_checks:
      # The provider is declared by its engine, in that engine's
      # .baobab/capability-provider.yaml (ADR-SHARED-017).
      - check: PROVIDER_DECLARATION
        blocker: PROVIDER_DECLARATION_MISSING
      # At least one capability has IMPLEMENTED support; PARTIAL and
      # planned support never count.
      - check: CAPABILITY_SUPPORT
        blocker: PROVIDER_SUPPORT_NOT_IMPLEMENTED
      # Every contract major it supports is one its capability defines.
      - check: CONTRACT_COMPATIBILITY
        blocker: PROVIDER_CONTRACT_INCOMPATIBLE
      # Only where topology/v1 release-policy.yaml approval
      # certification_required is true for an environment it would serve
      # (EA-09 records certification; ADR-BCP-025 amendment A3).
      - check: CERTIFICATION
        blocker: PROVIDER_NOT_CERTIFIED
      # A simulated provider, or one whose declaration says
      # production_permitted: false, never activates for an instance in the
      # production environment.
      - check: PRODUCTION_PERMITTED
        blocker: PROVIDER_PRODUCTION_NOT_PERMITTED
      # An APPROVED engine release of the provider's engine whose
      # provider_support covers the provider's contracts (ADR-BCP-025).
      - check: ENGINE_RELEASE
        blocker: PROVIDER_NO_ELIGIBLE_RELEASE
      # An engine instance of the provider's engine that can serve it.
      - check: ENGINE_INSTANCE
        blocker: PROVIDER_NO_ELIGIBLE_INSTANCE
      # Its instances' and its own health are eligible under
      # capability/v1 health-policy.yaml.
      - check: HEALTH
        blocker: PROVIDER_HEALTH_NOT_ELIGIBLE
      # No provider migration that has not ended moves capabilities to or
      # from it.
      - check: MIGRATION_CONFLICTS
        blocker: PROVIDER_MIGRATION_CONFLICT
  # ADR-BCP-025 section 2.4. The only path from a recorded (CANDIDATE)
  # engine release to APPROVED: recording never approves, and approval is a
  # controlled mutation under ADR-BCP-021. Approval is not certification
  # (amendment A3). The approver holds engine-release:approve, is never the
  # requester, and never the principal who recorded the release (maker/
  # checker, ADR-BCP-020). Releases are not revisioned: status is the only
  # thing about a release that moves, and only forward
  # (topology/v1 release-policy.yaml status_transitions).
  ENGINE_RELEASE_APPROVAL:
    target: ENGINE_RELEASE
    changeset_type: MODIFY
    from_status: [CANDIDATE]
    to_status: APPROVED
    approval_scope: "engine-release:approve"
    operations: [APPROVE_ENGINE_RELEASE, VERIFY_ENGINE_RELEASE_STATE]
    plan_checks:
      # Every capability and contract major in the release's provider
      # support is still in the Shared capability catalogue.
      - check: SUPPORT_CATALOGUED
        blocker: RELEASE_SUPPORT_NOT_CATALOGUED
      # release-policy.yaml approval.provenance_required, for the Control
      # Plane's own environment and every environment in which the
      # release's engine has an instance that is not RETIRED.
      - check: PROVENANCE
        blocker: RELEASE_PROVENANCE_MISSING
      # release-policy.yaml approval.certification_required, for the same
      # environments. EA-09 records certification; until it does, an
      # environment that requires it always blocks.
      - check: CERTIFICATION
        blocker: RELEASE_NOT_CERTIFIED
# Codes a changeset carries as blocking_reasons, or its plan as blockers;
# each is registered in authorization/v1/reason-code-registry.yaml under
# changeset_blocker.
blocking_codes:
  - CHANGESET_TARGET_NOT_FOUND
  - CHANGESET_TARGET_STATE_CONFLICT
  - CHANGESET_TARGET_LOCKED
  - PROVIDER_DECLARATION_MISSING
  - PROVIDER_SUPPORT_NOT_IMPLEMENTED
  - PROVIDER_CONTRACT_INCOMPATIBLE
  - PROVIDER_NOT_CERTIFIED
  - PROVIDER_PRODUCTION_NOT_PERMITTED
  - PROVIDER_NO_ELIGIBLE_RELEASE
  - PROVIDER_NO_ELIGIBLE_INSTANCE
  - PROVIDER_HEALTH_NOT_ELIGIBLE
  - PROVIDER_MIGRATION_CONFLICT
  - RELEASE_SUPPORT_NOT_CATALOGUED
  - RELEASE_PROVENANCE_MISSING
  - RELEASE_NOT_CERTIFIED
