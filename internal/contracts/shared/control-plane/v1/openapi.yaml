      operationId: concludeVerificationCase
      summary: Conclude a verification case
      description: >-
        Concludes a VERIFYING case at the version If-Match names.
        complete_verified requires at least one claim, and every claim of the
        case that still stands (not WITHDRAWN or SUPERSEDED) to be VERIFIED;
