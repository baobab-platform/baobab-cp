      summary: Activate a VALIDATED mapping
      description: >-
        Takes no body. Moves VALIDATED to ACTIVE, approved by the verified caller, who must not be its creator (MAPPING_SELF_APPROVAL, 403; four-eyes, Canonical Mapping Model section 48). An overlapping ACTIVE mapping for the same subject and scope is MAPPING_OVERLAP (409).
      security:
