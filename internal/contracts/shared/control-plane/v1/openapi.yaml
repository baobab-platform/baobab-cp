  /resolution/mappings:
    post:
      tags: [Mappings]
      operationId: resolveMapping
      summary: Resolve a canonical entity to its mapped representation in a trusted context
      description: >-
        Redeems a context the Control Plane resolved and stored earlier; the
        caller never supplies scope dimensions inline (Canonical Mapping Model
        section 17.3, ADR-SHARED-014). Follows the context tenant's ACTIVE
        CANONICAL_TO_EXTERNAL, BIDIRECTIONAL or SOURCE_TO_TARGET Mappings in
        effect whose scope the context matches, ranked by scope specificity,
        then resolution priority, then confidence (section 23). An unknown or
        expired context is CONTEXT_NOT_FOUND (404) and another tenant's
        context is TENANT_CONTEXT_MISMATCH (403). No match is
        MAPPING_NOT_FOUND (404); equally authoritative matches are
        MAPPING_AMBIGUOUS (409) and resolve to nothing.
      security:
        - workloadOidc: [mapping:resolve]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CausationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Tracestate"
