      - $ref: "#/components/parameters/CanonicalEntityIfMatch"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Canonical registry]
      operationId: validateCanonicalEntity
      summary: Validate a DRAFT canonical entity
      description: >-
        Takes no body. Moves DRAFT to VALIDATED; any other state is refused with CANONICAL_ENTITY_LIFECYCLE_CONFLICT (409).
