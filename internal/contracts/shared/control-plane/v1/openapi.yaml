        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /client-applications/{application_id}/claims:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Applications]
      operationId: createApplicantClaim
      summary: Assert a claim about my own application
      description: >-
        Records what the applicant asserts, such as a legal name or
        registration number, as an ADR-BCP-023 claim (sections 7, 9, 191).
        Only the applicant's own application, and only while it is DRAFT or
        INFORMATION_REQUIRED. The Control Plane derives the rest:
          - the application's ORGANISATION_ADMISSION VerificationCase, with
            subject APPLICATION, opened on the first claim;
          - asserted_by, which is the caller;
          - origin APPLICANT and status SELF_ASSERTED.
        A claim never verifies itself: only a reviewer's verification result
        changes its standing, and only VERIFIED claims are promoted at
        admission (section 192). A closed case takes no claims (409). A
        withdrawn claim no longer stands: it neither blocks nor counts towards
        concluding the case VERIFIED. A replay with the same Idempotency-Key and
        body returns the original claim with 200; a different body under the
        same key is refused (409).
      security:
        - adminOidc: [application:write]
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../evidence/v1/evidence.schema.json#/$defs/ApplicantClaimSubmission
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: ../../evidence/v1/evidence.schema.json#/$defs/EvidenceClaim
        "200":
          description: A replay of the same Idempotency-Key and body; the original claim
          content:
            application/json:
              schema:
                $ref: ../../evidence/v1/evidence.schema.json#/$defs/EvidenceClaim
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags: [Applications]
      operationId: listApplicantClaims
      summary: List the claims made on my own application
      security:
        - adminOidc: [application:read]
      responses:
        "200":
          description: The application's claims, oldest first
          content:
            application/json:
              schema:
                $ref: ../../evidence/v1/evidence.schema.json#/$defs/EvidenceClaimList
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
