    parameters:
      - $ref: "#/components/parameters/ApplicationId"
      - $ref: "#/components/parameters/EvidenceClaimId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Applications]
      operationId: withdrawApplicantClaim
      summary: Withdraw a claim I asserted
      description: >-
