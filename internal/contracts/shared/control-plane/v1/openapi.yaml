openapi: 3.1.0
info:
  title: Baobab-Platform Baobab Control Plane API
  version: 1.5.0
  description: >-
    The Control Plane's runtime and administrative API (ADR-BCP-022).
    Implementations live in baobab-platform/baobab-cp. Every adminOidc
    operation also requires Control Plane authority beyond its scope (the
    platform-administrator role, or tenant-administrator membership for
    tenant-scoped operations) and, for administrative commands, a registered
    Control Plane principal; the scope is necessary, never sufficient.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
tags:
  - name: Applications
    description: An applicant's own ClientApplications (ADR-BCP-017).
  - name: Admission
    description: Platform review and decision of ClientApplications (ADR-BCP-017, ADR-BCP-020 sections 34-35).
  - name: Onboarding
    description: TenantOnboardingRequests between an APPROVED decision and tenant registration (ADR-BCP-017 sections 22-24).
  - name: Tenants
    description: Reading tenants, their product entitlements and lifecycle commands (ADR-BCP-022 section 43).
  - name: Classification
    description: A ProductSubscription's classification and its explanation (ADR-BCP-018 ORG-11, ADR-SHARED-011).
  - name: Canonical registry
    description: Registering canonical entities and their lifecycle commands (ADR-BCP-001, ADR-0006, ADR-BCP-016).
  - name: Organisations
    description: IAM organisation links, organisation admission, legacy reconciliation and duplicate review (ADR-BCP-018 ORG-09, ORG-10, ORG-13).
  - name: Counterparties
    description: Tenant-scoped counterparty roles held by Organisations (ADR-BCP-018 ORG-13).
  - name: Platform accounts
    description: Platform accounts and tenants' bindings to them (ADR-BCP-018 ORG-07).
  - name: Audit
    description: Read-only audit lineage (ADR-BCP-022 section 46).
  - name: Diagnostics
    description: Privileged, read-only diagnostics (ADR-BCP-022 section 47).
servers:
  - url: https://control.baobab-platform.com/v1
    description: Production placeholder; activation requires an approved domain binding.
paths:
  /tenants:
    post:
      security:
        - adminOidc: [tenant:write]
      operationId: registerTenant
      summary: Register the tenant of an AUTHORISED TenantOnboardingRequest and start an idempotent provisioning operation
      description: >-
        There is no direct registration (ADR-BCP-017 sections 22-24). The
        command names an AUTHORISED TenantOnboardingRequest whose desired
        state it must match; the request is recorded FULFILLED with the minted
        tenant, and produces at most one tenant.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CausationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Tracestate"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./tenant-registration.schema.json
      responses:
        "202":
          description: Registration accepted or an existing idempotent result returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningOperation"
              examples:
                controlPlaneMintedTenant:
                  summary: The Control Plane returns the tenant identity it minted
                  value:
                    operation_id: bb5e2e28-51e8-476b-b9cc-d4e94ced3d3d
                    tenant_id: tn_01k4m7x9q2v6c8r3d5f1h0j4
                    state: accepted
                    revision: 1
                    created_at: "2026-08-31T12:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /tenants/bootstrap-registrations:
    post:
      security:
        - adminOidc: [tenant:bootstrap]
      operationId: bootstrapRegisterTenant
      summary: Register a tenant that predates the admission workflow (migration and platform bootstrap only)
      description: >-
        The only registration path without a TenantOnboardingRequest. It needs
        the privileged tenant:bootstrap scope, is disabled unless the Control
        Plane explicitly enables it, and audits its reason and evidence
        reference. It is never a route for a new customer.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CausationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Tracestate"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./tenant-bootstrap-registration.schema.json
      responses:
        "202":
          description: Registration accepted or an existing idempotent result returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /context/resolve:
    post:
      operationId: resolveTenantContext
      summary: Resolve authoritative tenant and product-entitlement context from the authenticated principal
      security:
        - workloadOidc: [context:resolve]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CausationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Tracestate"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./context-resolution.schema.json#/$defs/request
      responses:
        "200":
          description: Active, entitled tenant context
          headers:
            Cache-Control:
              schema: { type: string, const: "private, max-age=15" }
          content:
            application/json:
              schema:
                $ref: ./context-resolution.schema.json#/$defs/response
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /mappings:
    post:
      operationId: createMapping
      summary: Create a new canonical mapping in DRAFT state
      security:
        - adminOidc: [mapping:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CausationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Tracestate"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./canonical-mapping.schema.json#/$defs/mapping
      responses:
        "201":
          description: Mapping created in DRAFT state
          content:
            application/json:
              schema:
                $ref: ./canonical-mapping.schema.json#/$defs/mapping
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /mappings/{mapping_id}:
    get:
      operationId: getMapping
      summary: Retrieve a mapping by ID
      security:
        - workloadOidc: [mapping:read]
      parameters:
        - name: mapping_id
          in: path
          required: true
          schema:
            $ref: ./domain.schema.json#/$defs/mappingId
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Mapping details
          content:
            application/json:
              schema:
                $ref: ./canonical-mapping.schema.json#/$defs/mapping
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Mapping not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    patch:
      operationId: updateMapping
      summary: Update an existing mapping (requires If-Match revision header for optimistic concurrency)
      security:
        - adminOidc: [mapping:write]
      parameters:
        - name: mapping_id
          in: path
          required: true
          schema:
            $ref: ./domain.schema.json#/$defs/mappingId
        - name: If-Match
          in: header
          required: false
          description: Optimistic concurrency control. Supply the current revision (e.g., '5') from the mapping resource.
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CausationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./canonical-mapping.schema.json#/$defs/mapping
      responses:
        "200":
          description: Mapping updated
          content:
            application/json:
              schema:
                $ref: ./canonical-mapping.schema.json#/$defs/mapping
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Mapping not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Revision conflict or state transition not permitted
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /mappings/{mapping_id}/activate:
    post:
      operationId: activateMapping
      summary: Transition a mapping from VALIDATED state to ACTIVE state
      security:
        - adminOidc: [mapping:approve]
      parameters:
        - name: mapping_id
          in: path
          required: true
          schema:
            $ref: ./domain.schema.json#/$defs/mappingId
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CausationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [approved_by]
              properties:
                approved_by:
                  type: string
                  maxLength: 256
                  description: Identity of the approver executing this activation.
      responses:
        "200":
          description: Mapping activated
          content:
            application/json:
              schema:
                $ref: ./canonical-mapping.schema.json#/$defs/mapping
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Mapping not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Mapping not in VALIDATED state or other state transition conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /mappings/{mapping_id}/retire:
    post:
      operationId: retireMapping
      summary: Transition a mapping to RETIRED state, optionally superseding it with a new mapping
      security:
        - adminOidc: [mapping:write]
      parameters:
        - name: mapping_id
          in: path
          required: true
          schema:
            $ref: ./domain.schema.json#/$defs/mappingId
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CausationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [retired_by]
              properties:
                retired_by:
                  type: string
                  maxLength: 256
                  description: Identity of the actor retiring this mapping.
                successor_mapping_id:
                  $ref: ./domain.schema.json#/$defs/mappingId
                reason:
                  type: string
                  maxLength: 500
                  description: Explanation for retirement.
      responses:
        "200":
          description: Mapping retired
          content:
            application/json:
              schema:
                $ref: ./canonical-mapping.schema.json#/$defs/mapping
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Mapping not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: State transition conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /resolution/mappings:
    post:
      operationId: resolveMapping
      summary: Resolve a canonical entity to its external representation(s) in a given context and capability
      security:
        - workloadOidc: [mapping:resolve]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CausationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Tracestate"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./canonical-mapping.schema.json#/$defs/resolutionRequest
      responses:
        "200":
          description: Mapping resolved (may be cached)
          headers:
            Cache-Control:
              schema:
                type: string
                example: "private, max-age=60"
          content:
            application/json:
              schema:
                $ref: ./canonical-mapping.schema.json#/$defs/resolutionResponse
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No applicable mapping found in active state for this context
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Ambiguous equally-specific authoritative mappings detected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /markets:
    post:
      operationId: createMarket
      summary: Create a new market in DRAFT state
      security:
        - adminOidc: [market:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CausationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./market.schema.json#/$defs/market
      responses:
        "201":
          description: Market created in DRAFT state
          content:
            application/json:
              schema:
                $ref: ./market.schema.json#/$defs/market
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /markets/{market_id}:
    get:
      operationId: getMarket
      summary: Retrieve market configuration by ID
      security:
        - workloadOidc: [market:read]
      parameters:
        - name: market_id
          in: path
          required: true
          schema:
            $ref: ./market.schema.json#/$defs/marketId
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Market details
          content:
            application/json:
              schema:
                $ref: ./market.schema.json#/$defs/market
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Market not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    patch:
      operationId: updateMarket
      summary: Update market configuration (requires If-Match revision header)
      security:
        - adminOidc: [market:write]
      parameters:
        - name: market_id
          in: path
          required: true
          schema:
            $ref: ./market.schema.json#/$defs/marketId
        - name: If-Match
          in: header
          required: false
          description: Optimistic concurrency control (current revision number).
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CausationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./market.schema.json#/$defs/market
      responses:
        "200":
          description: Market updated
          content:
            application/json:
              schema:
                $ref: ./market.schema.json#/$defs/market
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Market not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Revision conflict or state transition not permitted
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /markets/{market_id}/activate:
    post:
      operationId: activateMarket
      summary: Transition a market from VALIDATED to ACTIVE state
      security:
        - adminOidc: [market:approve]
      parameters:
        - name: market_id
          in: path
          required: true
          schema:
            $ref: ./market.schema.json#/$defs/marketId
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CausationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [approved_by]
              properties:
                approved_by:
                  type: string
                  maxLength: 256
      responses:
        "200":
          description: Market activated
          content:
            application/json:
              schema:
                $ref: ./market.schema.json#/$defs/market
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Market not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Market not in VALIDATED state
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  # ---------------------------------------------------------------------------
  # Applications (ADR-BCP-017): the applicant's own ClientApplications.
  # Another applicant's application is reported as not found.
  # ---------------------------------------------------------------------------
  /client-applications:
    post:
      tags: [Applications]
      operationId: createClientApplication
      summary: Open a DRAFT ClientApplication as the authenticated applicant
      description: >-
        The applicant's first request registers their Control Plane principal
        (ADR-BCP-017 section 5). The body is a ClientApplicationDraft without
        a version. Status, channel, classification and verification are
        server-authoritative and cannot be supplied. A replay with the same
        Idempotency-Key returns the original application with 200.
      security:
        - adminOidc: [application:write]
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../admission/v1/application.schema.json#/$defs/ClientApplicationDraft
      responses:
        "201":
          $ref: "#/components/responses/ClientApplication"
        "200":
          $ref: "#/components/responses/ClientApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags: [Applications]
      operationId: listMyClientApplications
      summary: List the authenticated applicant's own applications, newest first
      security:
        - adminOidc: [application:read]
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/ApplicationCursor"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          $ref: "#/components/responses/ClientApplicationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /client-applications/{application_id}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Applications]
      operationId: getMyClientApplication
      summary: Read one of the authenticated applicant's own applications
      security:
        - adminOidc: [application:read]
      responses:
        "200":
          $ref: "#/components/responses/ClientApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags: [Applications]
      operationId: updateMyClientApplication
      summary: Replace the editable content of a DRAFT or INFORMATION_REQUIRED application
      description: >-
        The body is a complete ClientApplicationDraft naming the version it
        was based on; a stale version is refused with VERSION_CONFLICT.
      security:
        - adminOidc: [application:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../admission/v1/application.schema.json#/$defs/ClientApplicationDraft
      responses:
        "200":
          $ref: "#/components/responses/ClientApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /client-applications/{application_id}/submit:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Applications]
      operationId: submitMyClientApplication
      summary: Submit a complete DRAFT application for admission
      description: Takes no body. An incomplete application is refused with APPLICATION_INCOMPLETE (422).
      security:
        - adminOidc: [application:write]
      responses:
        "200":
          $ref: "#/components/responses/ClientApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /client-applications/{application_id}/response:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Applications]
      operationId: respondToInformationRequest
      summary: Answer an information request, returning the application to VALIDATING
      security:
        - adminOidc: [application:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../admission/v1/application.schema.json#/$defs/ApplicantResponseCommand
      responses:
        "200":
          $ref: "#/components/responses/ClientApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /client-applications/{application_id}/withdraw:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Applications]
      operationId: withdrawMyClientApplication
      summary: Withdraw an open application
      security:
        - adminOidc: [application:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../admission/v1/application.schema.json#/$defs/ClosureCommand
      responses:
        "200":
          $ref: "#/components/responses/ClientApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  # ---------------------------------------------------------------------------
  # Admission (ADR-BCP-017, ADR-BCP-020 sections 34-35): platform review and
  # decision. Every operation also requires Control Plane platform-administrator
  # authority and a registered principal.
  # ---------------------------------------------------------------------------
  /admission/applications:
    get:
      tags: [Admission]
      operationId: listAdmissionQueue
      summary: List applications for review, newest first
      description: Without a status filter, lists SUBMITTED, VALIDATING, INFORMATION_REQUIRED and UNDER_REVIEW applications.
      security:
        - adminOidc: [admission:review]
      parameters:
        - name: status
          in: query
          required: false
          description: Comma-separated application statuses.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            items:
              $ref: ../../admission/v1/application.schema.json#/$defs/applicationStatus
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/ApplicationCursor"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          $ref: "#/components/responses/ClientApplicationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admission/applications/{application_id}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Admission]
      operationId: getApplicationForReview
      summary: Read any application for review
      security:
        - adminOidc: [admission:review]
      responses:
        "200":
          $ref: "#/components/responses/ClientApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admission/applications/{application_id}/begin-validation:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Admission]
      operationId: beginApplicationValidation
      summary: Move a SUBMITTED application to VALIDATING
      description: Takes no body.
      security:
        - adminOidc: [admission:review]
      responses:
        "200":
          $ref: "#/components/responses/ClientApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admission/applications/{application_id}/information-request:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Admission]
      operationId: requestApplicationInformation
      summary: Ask the applicant for more information
      security:
        - adminOidc: [admission:review]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../admission/v1/application.schema.json#/$defs/InformationRequestCommand
      responses:
        "200":
          $ref: "#/components/responses/ClientApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admission/applications/{application_id}/begin-review:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Admission]
      operationId: beginApplicationReview
      summary: Move a VALIDATING application to UNDER_REVIEW
      description: Takes no body.
      security:
        - adminOidc: [admission:review]
      responses:
        "200":
          $ref: "#/components/responses/ClientApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admission/applications/{application_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Admission]
      operationId: cancelApplication
      summary: Cancel an open application on the platform's side
      security:
        - adminOidc: [admission:review]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../admission/v1/application.schema.json#/$defs/ClosureCommand
      responses:
        "200":
          $ref: "#/components/responses/ClientApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admission/applications/{application_id}/decision:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Admission]
      operationId: getAdmissionDecision
      summary: Read the application's AdmissionDecision
      description: Not found when the application does not exist or has not been decided.
      security:
        - adminOidc: [admission:review]
      responses:
        "200":
          $ref: "#/components/responses/AdmissionDecision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [Admission]
      operationId: decideApplication
      summary: Approve or reject an application UNDER_REVIEW
      description: >-
        The decider comes from authentication, never the body, and is never
        the application's applicant (SELF_DECISION_FORBIDDEN, 403). An
        approval outside the requested markets is refused with
        MARKET_SCOPE_EXCEEDED, and INTERNAL without Control Plane-established
        eligibility with NOT_INTERNAL_ELIGIBLE (both 422). The decision is
        immutable.
      security:
        - adminOidc: [admission:decide]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../admission/v1/decision.schema.json#/$defs/AdmissionDecisionRequest
      responses:
        "201":
          $ref: "#/components/responses/AdmissionDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  # ---------------------------------------------------------------------------
  # Onboarding (ADR-BCP-017 sections 22-24, 39): the handoff from an APPROVED
  # decision to tenant registration. Every operation also requires Control
  # Plane platform-administrator authority and a registered principal;
  # onboarding:request and onboarding:authorise each also require their IAM
  # client role, and the service enforces separation of duties per principal.
  # ---------------------------------------------------------------------------
  /tenant-onboarding-requests:
    post:
      tags: [Onboarding]
      operationId: requestTenantOnboarding
      summary: Hand an APPROVED AdmissionDecision to onboarding
      description: >-
        Desired state is copied from the decision. There is one live request
        per decision: repeating the request returns the live one with 200.
        The requester is never the applicant or the decider
        (SEPARATION_OF_DUTIES, 403).
      security:
        - adminOidc: [onboarding:request]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../admission/v1/onboarding.schema.json#/$defs/TenantOnboardingRequestCommand
      responses:
        "201":
          $ref: "#/components/responses/TenantOnboardingRequest"
        "200":
          $ref: "#/components/responses/TenantOnboardingRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags: [Onboarding]
      operationId: listTenantOnboardingRequests
      summary: List onboarding requests, newest first
      security:
        - adminOidc: [onboarding:request]
        - adminOidc: [onboarding:authorise]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: ../../admission/v1/onboarding.schema.json#/$defs/onboardingRequestStatus
        - name: limit
          in: query
          required: false
          description: 1 to 200; any other value lists 50.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Onboarding requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantOnboardingRequestList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tenant-onboarding-requests/{request_id}:
    parameters:
      - $ref: "#/components/parameters/OnboardingRequestId"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Onboarding]
      operationId: getTenantOnboardingRequest
      summary: Read one onboarding request
      security:
        - adminOidc: [onboarding:request]
        - adminOidc: [onboarding:authorise]
      responses:
        "200":
          $ref: "#/components/responses/TenantOnboardingRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tenant-onboarding-requests/{request_id}/authorisation:
    parameters:
      - $ref: "#/components/parameters/OnboardingRequestId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Onboarding]
      operationId: authoriseTenantOnboarding
      summary: Authorise a REQUESTED onboarding request
      description: The authoriser is never the requester or the applicant (SEPARATION_OF_DUTIES, 403).
      security:
        - adminOidc: [onboarding:authorise]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../admission/v1/onboarding.schema.json#/$defs/OnboardingAuthorisationCommand
      responses:
        "200":
          $ref: "#/components/responses/TenantOnboardingRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tenant-onboarding-requests/{request_id}/cancellation:
    parameters:
      - $ref: "#/components/parameters/OnboardingRequestId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Onboarding]
      operationId: cancelTenantOnboarding
      summary: Cancel a REQUESTED or AUTHORISED onboarding request
      description: The admission decision is never rewritten.
      security:
        - adminOidc: [onboarding:request]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../admission/v1/onboarding.schema.json#/$defs/OnboardingCancellationCommand
      responses:
        "200":
          $ref: "#/components/responses/TenantOnboardingRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tenant-onboarding-requests/{request_id}/fulfilment:
    parameters:
      - $ref: "#/components/parameters/OnboardingRequestId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Onboarding]
      operationId: fulfilTenantOnboarding
      summary: Record the tenant an AUTHORISED request produced
      description: >-
        Registration (registerTenant) already fulfils its request; this
        records a tenant produced elsewhere. The tenant must exist
        (TENANT_NOT_FOUND, 422), must not belong to another request
        (TENANT_ALREADY_ONBOARDED, 409) and must match the desired state
        (DESIRED_STATE_MISMATCH, 422).
      security:
        - adminOidc: [onboarding:request]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../admission/v1/onboarding.schema.json#/$defs/OnboardingFulfilmentCommand
      responses:
        "200":
          $ref: "#/components/responses/TenantOnboardingRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  # ---------------------------------------------------------------------------
  # Tenants (ADR-BCP-022 section 43): reading and lifecycle commands. A
  # tenant administrator reaches only tenants they hold an ACTIVE workforce
  # membership for; a platform administrator reaches every tenant.
  # ---------------------------------------------------------------------------
  /tenants/{tenant_id}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Tenants]
      operationId: getTenant
      summary: Read a tenant
      description: A malformed tenant id is refused with INVALID_TENANT_ID (400).
      security:
        - adminOidc: [tenant:read]
      responses:
        "200":
          description: The tenant
          content:
            application/json:
              schema:
                $ref: ./tenant.schema.json#/$defs/Tenant
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tenants/{tenant_id}/suspend:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Tenants]
      operationId: suspendTenant
      summary: Suspend a tenant
      description: >-
        Takes no body. Sets the tenant's desired and observed state to
        suspended. A malformed tenant id is refused with VALIDATION_FAILED
        (422).
      security:
        - adminOidc: [tenant:write]
      responses:
        "200":
          $ref: "#/components/responses/TenantLifecycleResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tenants/{tenant_id}/activate:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Tenants]
      operationId: activateTenant
      summary: Activate a tenant
      description: >-
        Takes no body. Sets the tenant's desired and observed state to
        active. A malformed tenant id is refused with VALIDATION_FAILED (422).
      security:
        - adminOidc: [tenant:write]
      responses:
        "200":
          $ref: "#/components/responses/TenantLifecycleResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tenants/{tenant_id}/decommission:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Tenants]
      operationId: decommissionTenant
      summary: Decommission a tenant
      description: >-
        Takes no body. Sets the tenant's desired and observed state to
        decommissioned. A malformed tenant id is refused with
        VALIDATION_FAILED (422).
      security:
        - adminOidc: [tenant:write]
      responses:
        "200":
          $ref: "#/components/responses/TenantLifecycleResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /entitlements:
    get:
      tags: [Tenants]
      operationId: getEntitlement
      summary: Read a tenant's entitlement to a product
      description: A malformed tenantId or productId is refused with VALIDATION_FAILED (422).
      security:
        - adminOidc: [tenant:read]
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            $ref: ./domain.schema.json#/$defs/tenantId
        - name: productId
          in: query
          required: true
          schema:
            $ref: ./domain.schema.json#/$defs/productId
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The entitlement
          content:
            application/json:
              schema:
                $ref: ./tenant.schema.json#/$defs/Entitlement
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  # ---------------------------------------------------------------------------
  # Classification (ADR-BCP-018 ORG-11, ADR-SHARED-011): a ProductSubscription's
  # type and why. Every operation also requires Control Plane
  # platform-administrator authority and a registered principal.
  # ---------------------------------------------------------------------------
  /product-subscriptions/{subscription_id}/classification:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Classification]
      operationId: classifySubscription
      summary: Classify an unclassified subscription from its tenant's AdmissionDecision
      description: >-
        The type is the decision's. Repeating the classification with the
        same decision returns the existing record with 200. The classifier is
        never a principal of the subscription's own organisation
        (SELF_CLASSIFICATION_FORBIDDEN, 403). INTERNAL requires eligibility
        the Control Plane establishes itself (NOT_INTERNAL_ELIGIBLE, 422).
      security:
        - adminOidc: [subscription:classify]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../product/v1/subscription.schema.json#/$defs/SubscriptionClassificationCommand
      responses:
        "201":
          $ref: "#/components/responses/SubscriptionClassificationRecord"
        "200":
          $ref: "#/components/responses/SubscriptionClassificationRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags: [Classification]
      operationId: explainSubscriptionClassification
      summary: Explain why a subscription is classified as it is
      description: >-
        The current record and its history, INTERNAL eligibility re-evaluated
        now (NOT_ELIGIBLE is reported as drift and never acted on) and the
        billing policy. It exposes relationship identifiers, never the
        corporate graph.
      security:
        - adminOidc: [subscription:read]
      responses:
        "200":
          $ref: "#/components/responses/ClassificationExplanation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /product-subscriptions/{subscription_id}/reclassification:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Classification]
      operationId: reclassifySubscription
      summary: Change a classified subscription's type
      description: >-
        Repeating the same reclassification (same type and reference) returns
        the existing record with 200. An unchanged type is refused with
        SUBSCRIPTION_TYPE_UNCHANGED and an unclassified subscription with
        SUBSCRIPTION_NOT_CLASSIFIED (both 409).
      security:
        - adminOidc: [subscription:classify]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../product/v1/subscription.schema.json#/$defs/SubscriptionReclassificationCommand
      responses:
        "201":
          $ref: "#/components/responses/SubscriptionClassificationRecord"
        "200":
          $ref: "#/components/responses/SubscriptionClassificationRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tenants/{tenant_id}/products/{product_id}/classification:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: product_id
        in: path
        required: true
        schema:
          $ref: ./domain.schema.json#/$defs/productId
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Classification]
      operationId: explainTenantProductClassification
      summary: Explain the classification of a tenant's subscription to a product
      security:
        - adminOidc: [subscription:read]
      responses:
        "200":
          $ref: "#/components/responses/ClassificationExplanation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  # ---------------------------------------------------------------------------
  # Canonical registry (ADR-BCP-001, ADR-0006, ADR-BCP-016): registering
  # canonical entities and moving them through their lifecycle. A new entity
  # is always DRAFT; each command needs the current version in If-Match
  # (ADR-BCP-022 sections 123-130). Every operation also requires Control
  # Plane platform-administrator authority.
  # ---------------------------------------------------------------------------
  /canonical-entities:
    post:
      tags: [Canonical registry]
      operationId: createCanonicalEntity
      summary: Register a canonical entity
      description: >-
        The Control Plane mints the identifier and starts the entity DRAFT at
        version 1. A body that is not JSON or names a field the request does
        not define, such as an identifier, status, version or timestamp, is
        refused with INVALID_REQUEST (400); one that breaks a field's rule
        with VALIDATION_FAILED (400); an effective_to not after
        effective_from with VALIDATION_FAILED (422).
      security:
        - adminOidc: [canonical:write]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./canonical-entity.schema.json#/$defs/CanonicalEntityCreateRequest
      responses:
        "201":
          description: Registered
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: ./canonical-entity.schema.json#/$defs/CanonicalEntity
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /canonical-entities/{entity_id}:
    parameters:
      - $ref: "#/components/parameters/CanonicalEntityId"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Canonical registry]
      operationId: getCanonicalEntity
      summary: Read a canonical entity
      security:
        - adminOidc: [canonical:read]
      responses:
        "200":
          $ref: "#/components/responses/CanonicalEntity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /canonical-entities/{entity_id}/validate:
    parameters:
      - $ref: "#/components/parameters/CanonicalEntityId"
      - $ref: "#/components/parameters/CanonicalEntityIfMatch"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Canonical registry]
      operationId: validateCanonicalEntity
      summary: Validate a DRAFT canonical entity
      description: >-
        Takes no body. Moves DRAFT to VALIDATED; any other state is refused with CANONICAL_ENTITY_LIFECYCLE_CONFLICT (409).
      security:
        - adminOidc: [canonical:write]
      responses:
        "200":
          $ref: "#/components/responses/CanonicalEntity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /canonical-entities/{entity_id}/activate:
    parameters:
      - $ref: "#/components/parameters/CanonicalEntityId"
      - $ref: "#/components/parameters/CanonicalEntityIfMatch"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Canonical registry]
      operationId: activateCanonicalEntity
      summary: Activate a VALIDATED canonical entity
      description: >-
        Takes no body. Moves VALIDATED to ACTIVE; any other state is refused with CANONICAL_ENTITY_LIFECYCLE_CONFLICT (409). Only an ACTIVE organisation-kind entity can be asserted as a request's organisation_id (ADR-BCP-016).
      security:
        - adminOidc: [canonical:write]
      responses:
        "200":
          $ref: "#/components/responses/CanonicalEntity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /canonical-entities/{entity_id}/suspend:
    parameters:
      - $ref: "#/components/parameters/CanonicalEntityId"
      - $ref: "#/components/parameters/CanonicalEntityIfMatch"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Canonical registry]
      operationId: suspendCanonicalEntity
      summary: Suspend an ACTIVE canonical entity
      description: >-
        Takes no body. Moves ACTIVE to SUSPENDED; any other state is refused with CANONICAL_ENTITY_LIFECYCLE_CONFLICT (409). Suspending an organisation also suspends its profile and emits OrganisationSuspended, atomically (ADR-BCP-018); every context resolution through it then fails closed. There is no reinstatement command.
      security:
        - adminOidc: [canonical:write]
      responses:
        "200":
          $ref: "#/components/responses/CanonicalEntity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /canonical-entities/{entity_id}/retire:
    parameters:
      - $ref: "#/components/parameters/CanonicalEntityId"
      - $ref: "#/components/parameters/CanonicalEntityIfMatch"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Canonical registry]
      operationId: retireCanonicalEntity
      summary: Retire a canonical entity
      description: >-
        Takes no body. Moves ACTIVE, SUSPENDED or DEPRECATED to RETIRED; any other state is refused with CANONICAL_ENTITY_LIFECYCLE_CONFLICT (409).
      security:
        - adminOidc: [canonical:write]
      responses:
        "200":
          $ref: "#/components/responses/CanonicalEntity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  # ---------------------------------------------------------------------------
  # Organisations (ADR-BCP-018): IAM organisation links (ORG-10), organisation
  # admission (ORG-09), legacy reconciliation and duplicate review (ORG-13).
  # Every operation also requires Control Plane platform-administrator
  # authority.
  # ---------------------------------------------------------------------------
  /canonical-entities/{entity_id}/iam-organisations:
    parameters:
      - $ref: "#/components/parameters/CanonicalEntityId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Organisations]
      operationId: linkIamOrganisation
      summary: Link an Organisation to its IAM-native organisation
      description: >-
        Records an ACTIVE link. Repeating an existing link returns it with
        200; a link held by another Organisation is refused with
        IAM_ORGANISATION_ALREADY_LINKED (409), and only ORGANISATION entities
        can be linked (NOT_AN_ORGANISATION, 422). The link never grants
        authority; context resolution fails closed on any evidence it does not
        resolve.
      security:
        - adminOidc: [canonical:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../organisation/v1/iam.schema.json#/$defs/IamOrganisationLinkRequest
      responses:
        "201":
          $ref: "#/components/responses/IamOrganisationReference"
        "200":
          $ref: "#/components/responses/IamOrganisationReference"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      tags: [Organisations]
      operationId: listIamOrganisationLinks
      summary: List an Organisation's IAM organisation links, including retired ones
      security:
        - adminOidc: [canonical:read]
      responses:
        "200":
          $ref: "#/components/responses/IamOrganisationReferenceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /iam-organisation-references/{reference_id}/retire:
    parameters:
      - $ref: "#/components/parameters/IamOrganisationReferenceId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Organisations]
      operationId: retireIamOrganisationLink
      summary: Retire an IAM organisation link
      description: >-
        A retired link never resolves. A link that is not ACTIVE, or an
        effective_to before it took effect, is refused with
        IAM_ORGANISATION_REFERENCE_NOT_RETIRABLE (409).
      security:
        - adminOidc: [canonical:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../organisation/v1/iam.schema.json#/$defs/IamOrganisationRetireRequest
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /iam-organisations:
    get:
      tags: [Organisations]
      operationId: resolveIamOrganisation
      summary: Resolve IAM organisation evidence to its canonical Organisation
      description: >-
        Answers through an ACTIVE link in effect now, failing closed exactly
        as context resolution does (IAM_ORGANISATION_NOT_LINKED, 404).
      security:
        - adminOidc: [canonical:read]
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            $ref: ../../organisation/v1/iam.schema.json#/$defs/iamProvider
        - name: issuer
          in: query
          required: true
          schema:
            $ref: ../../organisation/v1/iam.schema.json#/$defs/iamIssuer
        - name: provider_organisation_id
          in: query
          required: true
          schema:
            $ref: ../../organisation/v1/iam.schema.json#/$defs/providerOrganisationId
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          $ref: "#/components/responses/IamOrganisationResolution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /tenants/{tenant_id}/organisation-admission:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Organisations]
      operationId: onboardAdmittedOrganisation
      summary: Onboard the Organisation behind an approved admission decision
      description: >-
        Issued by platform staff after an APPROVED decision, never by the
        applicant. The body is decoded strictly: it cannot carry a platform
        relationship or a verification flag the contract does not define (ADR-
        BCP-018 sections 69-70). A quarantined identity answers 409 with the
        outcome and its candidates, having written nothing; a first-party
        organisation is refused with FIRST_PARTY_ORGANISATION and a
        conflicting one with ORGANISATION_CONFLICT (both 409 problems).
      security:
        - adminOidc: [tenant:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../organisation/v1/admission.schema.json#/$defs/OrganisationAdmissionRequest
      responses:
        "200":
          $ref: "#/components/responses/OrganisationAdmissionOutcome"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "409":
          description: The identity was quarantined (the outcome, nothing written), or the organisation is first-party or conflicts (a problem)
          content:
            application/json:
              schema:
                $ref: ../../organisation/v1/admission.schema.json#/$defs/OrganisationAdmissionOutcome
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /organisation-reconciliation:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Organisations]
      operationId: reconcileOrganisations
      summary: Run the legacy buyer and supplier reconciliation and refresh duplicate candidates
      description: >-
        Takes no body. Migrates every pending legacy record, reports what
        could not be migrated and why, and refreshes the resolution
        candidates. It merges nothing and is safe to repeat.
      security:
        - adminOidc: [canonical:write]
      responses:
        "200":
          $ref: "#/components/responses/CounterpartyReconciliationReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /organisation-resolution-candidates:
    get:
      tags: [Organisations]
      operationId: listResolutionCandidates
      summary: List possible duplicate Organisations awaiting or after review
      security:
        - adminOidc: [canonical:read]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: ../../organisation/v1/counterparty.schema.json#/$defs/resolutionCandidateStatus
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: after
          in: query
          required: false
          description: The previous page's next cursor.
          schema:
            $ref: ../../organisation/v1/counterparty.schema.json#/$defs/resolutionCandidateId
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          $ref: "#/components/responses/ResolutionCandidatePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /organisation-resolution-candidates/{candidate_id}:
    parameters:
      - $ref: "#/components/parameters/ResolutionCandidateId"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Organisations]
      operationId: getResolutionCandidate
      summary: Read a resolution candidate
      security:
        - adminOidc: [canonical:read]
      responses:
        "200":
          $ref: "#/components/responses/OrganisationResolutionCandidate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /organisation-resolution-candidates/{candidate_id}/decision:
    parameters:
      - $ref: "#/components/parameters/ResolutionCandidateId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Organisations]
      operationId: decideResolutionCandidate
      summary: Record a reviewer's decision on a resolution candidate
      description: >-
        The reviewer comes from authentication, never the body. A decision
        merges nothing (ADR-BCP-023 section 52): a confirmed duplicate is
        merged by a separate controlled change. A candidate already decided
        differently is refused with RESOLUTION_CANDIDATE_DECIDED (409); an
        inconsistent decision with RESOLUTION_DECISION_INVALID (422).
      security:
        - adminOidc: [canonical:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../organisation/v1/counterparty.schema.json#/$defs/ResolutionCandidateDecision
      responses:
        "200":
          $ref: "#/components/responses/OrganisationResolutionCandidate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
  # ---------------------------------------------------------------------------
  # Counterparties (ADR-BCP-018 gate ORG-13): tenant-scoped roles an
  # Organisation holds towards a tenant (buyer, supplier and so on).
  # ---------------------------------------------------------------------------
  /tenants/{tenant_id}/counterparty-roles:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Counterparties]
      operationId: assignCounterpartyRole
      summary: Assign a counterparty role in a tenant to an Organisation
      description: >-
        Repeating a live assignment returns the stored role with 200. Only
        ORGANISATION entities hold roles (NOT_AN_ORGANISATION, 422).
      security:
        - adminOidc: [tenant:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../organisation/v1/counterparty.schema.json#/$defs/CounterpartyRoleAssignRequest
      responses:
        "201":
          $ref: "#/components/responses/CounterpartyRole"
        "200":
          $ref: "#/components/responses/CounterpartyRole"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Counterparties]
      operationId: listCounterpartyRoles
      summary: List a tenant's counterparty roles, including ended ones
      security:
        - adminOidc: [tenant:read]
      parameters:
        - name: organisation_id
          in: query
          required: false
          schema:
            $ref: ./domain.schema.json#/$defs/canonicalEntityId
      responses:
        "200":
          $ref: "#/components/responses/CounterpartyRoleList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /counterparty-roles/{role_id}/end:
    parameters:
      - $ref: "#/components/parameters/CounterpartyRoleId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Counterparties]
      operationId: endCounterpartyRole
      summary: End a counterparty role
      security:
        - adminOidc: [tenant:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../organisation/v1/counterparty.schema.json#/$defs/CounterpartyRoleEndRequest
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  # ---------------------------------------------------------------------------
  # Platform accounts (ADR-BCP-018 gate ORG-07): the commercial account and
  # the tenant's explicit binding to it.
  # ---------------------------------------------------------------------------
  /platform-accounts/{account_id}:
    parameters:
      - $ref: "#/components/parameters/PlatformAccountId"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Platform accounts]
      operationId: getPlatformAccount
      summary: Read a platform account
      security:
        - adminOidc: [canonical:read]
      responses:
        "200":
          $ref: "#/components/responses/PlatformAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /platform-accounts/{account_id}/status:
    parameters:
      - $ref: "#/components/parameters/PlatformAccountId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Platform accounts]
      operationId: changePlatformAccountStatus
      summary: Change a platform account's status
      description: >-
        Only the platformAccountTransitions are allowed
        (PLATFORM_ACCOUNT_TRANSITION_NOT_ALLOWED, 409), and an account with
        ACTIVE tenant bindings cannot close
        (PLATFORM_ACCOUNT_HAS_ACTIVE_BINDINGS, 409). Requires a registered
        principal.
      security:
        - adminOidc: [canonical:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../organisation/v1/platform.schema.json#/$defs/PlatformAccountStatusChangeRequest
      responses:
        "200":
          $ref: "#/components/responses/PlatformAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tenants/{tenant_id}/platform-account-binding:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Platform accounts]
      operationId: bindTenantPlatformAccount
      summary: Bind a tenant to a platform account
      description: >-
        The account must be ACTIVE and the tenant's ACTIVE primary
        Organisation must hold a live membership in it
        (TENANT_ORGANISATION_REQUIRED and ORGANISATION_NOT_ACCOUNT_MEMBER,
        422). A tenant has at most one ACTIVE binding (TENANT_ALREADY_BOUND,
        409). Repeating the current binding returns it with 200. Requires a
        registered principal.
      security:
        - adminOidc: [tenant:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../organisation/v1/platform.schema.json#/$defs/TenantPlatformAccountBindingRequest
      responses:
        "201":
          $ref: "#/components/responses/TenantPlatformAccountBinding"
        "200":
          $ref: "#/components/responses/TenantPlatformAccountBinding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tenants/{tenant_id}/platform-account-binding/end:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Platform accounts]
      operationId: endTenantPlatformAccountBinding
      summary: End a tenant's ACTIVE platform account binding
      description: >-
        Requires a registered principal. A tenant with no ACTIVE binding is
        refused with PLATFORM_ACCOUNT_BINDING_NOT_FOUND (404).
      security:
        - adminOidc: [tenant:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../organisation/v1/platform.schema.json#/$defs/TenantPlatformAccountBindingEndRequest
      responses:
        "200":
          $ref: "#/components/responses/TenantPlatformAccountBinding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tenants/{tenant_id}/platform-account-bindings:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Platform accounts]
      operationId: listTenantPlatformAccountBindings
      summary: List a tenant's platform account bindings, including ended ones
      security:
        - adminOidc: [tenant:read]
      responses:
        "200":
          $ref: "#/components/responses/TenantPlatformAccountBindingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  # ---------------------------------------------------------------------------
  # Audit and diagnostics (ADR-BCP-018 gate ORG-15, ADR-BCP-022 sections
  # 46-47): read-only.
  # ---------------------------------------------------------------------------
  /organisation-drift:
    get:
      tags: [Diagnostics]
      operationId: getOrganisationDrift
      summary: Report current relationship drift
      description: >-
        Changes nothing: drift is resolved by review, never by cascade (ADR-
        BCP-018 section 129).
      security:
        - adminOidc: [canonical:read]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          $ref: "#/components/responses/RelationshipDriftReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /capabilities/explain:
    post:
      tags: [Diagnostics]
      operationId: explainCapability
      summary: Explain a capability resolution for a stored context
      description: >-
        Runs capability resolution against a context the Control Plane stored
        earlier and reports the stage it reached and why it stopped (ADR-BCP-
        003 section 80). Not restricted to the caller's own tenant: explaining
        a customer's failed resolution is its purpose. It exposes internal
        topology, so it is privileged, and it never grants access. A failed
        resolution is still a 200 whose outcome is FAILED. An unknown or
        expired context is refused with CONTEXT_NOT_FOUND (404). Also
        requires Control Plane platform-administrator authority.
      security:
        - adminOidc: [capabilities:explain]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./capability-explanation.schema.json#/$defs/CapabilityExplanationRequest
      responses:
        "200":
          description: The explanation
          content:
            application/json:
              schema:
                $ref: ./capability-explanation.schema.json#/$defs/CapabilityExplanation
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /organisations/{organisation_id}/audit:
    parameters:
      - name: organisation_id
        in: path
        required: true
        schema:
          $ref: ./domain.schema.json#/$defs/canonicalEntityId
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Audit]
      operationId: listOrganisationAudit
      summary: List an Organisation's audit lineage, newest first
      security:
        - adminOidc: [canonical:read]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: before
          in: query
          required: false
          description: The previous page's next cursor.
          schema: { type: string, format: uuid }
      responses:
        "200":
          $ref: "#/components/responses/OrganisationAuditPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
        minLength: 16
        maxLength: 128
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Makes the command replayable; a replay with a different body is refused with IDEMPOTENCY_KEY_REUSED (409).
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
        minLength: 16
        maxLength: 128
    ApplicationId:
      name: application_id
      in: path
      required: true
      schema:
        $ref: ../../admission/v1/application.schema.json#/$defs/clientApplicationId
    OnboardingRequestId:
      name: request_id
      in: path
      required: true
      schema:
        $ref: ../../admission/v1/onboarding.schema.json#/$defs/tenantOnboardingRequestId
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema:
        $ref: ./domain.schema.json#/$defs/tenantId
    SubscriptionId:
      name: subscription_id
      in: path
      required: true
      schema:
        $ref: ../../product/v1/domain.schema.json#/$defs/subscriptionId
    CanonicalEntityId:
      name: entity_id
      in: path
      required: true
      schema:
        $ref: ./domain.schema.json#/$defs/canonicalEntityId
    CanonicalEntityIfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        The entity's current version as a strong entity tag, e.g. "3" (the
        ETag of its last read). Missing is refused with IF_MATCH_REQUIRED
        (428); malformed with INVALID_IF_MATCH (400); stale with
        CANONICAL_ENTITY_VERSION_MISMATCH (412), after which the client
        reloads the entity rather than retrying (ADR-BCP-022 sections 127-131).
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    IamOrganisationReferenceId:
      name: reference_id
      in: path
      required: true
      schema:
        $ref: ../../organisation/v1/domain.schema.json#/$defs/iamOrganisationReferenceId
    ResolutionCandidateId:
      name: candidate_id
      in: path
      required: true
      schema:
        $ref: ../../organisation/v1/counterparty.schema.json#/$defs/resolutionCandidateId
    CounterpartyRoleId:
      name: role_id
      in: path
      required: true
      schema:
        $ref: ../../organisation/v1/counterparty.schema.json#/$defs/counterpartyRoleId
    PlatformAccountId:
      name: account_id
      in: path
      required: true
      schema:
        $ref: ../../organisation/v1/domain.schema.json#/$defs/platformAccountId
    PageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    ApplicationCursor:
      name: before
      in: query
      required: false
      description: The previous page's next cursor; lists applications older than it.
      schema:
        $ref: ../../admission/v1/application.schema.json#/$defs/clientApplicationId
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: A caller-supplied business correlation UUID. The service mints one when absent and returns it in problem details and emitted consequences.
      schema: { type: string, format: uuid }
    CausationId:
      name: X-Causation-ID
      in: header
      required: false
      description: UUID of the immediate command or event that caused this request. Omit it for a root interaction.
      schema: { type: string, format: uuid }
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context version 00 traceparent value.
      schema:
        type: string
        pattern: "^00-(?!00000000000000000000000000000000)[0-9a-f]{32}-(?!0000000000000000)[0-9a-f]{16}-[0-9a-f]{2}$"
    Tracestate:
      name: tracestate
      in: header
      required: false
      description: Optional W3C vendor trace state; never use it for credentials or business payloads.
      schema:
        type: string
        pattern: "^[ -~]+$"
        minLength: 1
        maxLength: 512
  schemas:
    ProblemDetails:
      $ref: ../../errors/v1/problem-details.schema.json
    ClientApplicationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: ../../admission/v1/application.schema.json#/$defs/ClientApplication
        next:
          description: Cursor for the next (older) page, passed as before; absent on the last page.
          $ref: ../../admission/v1/application.schema.json#/$defs/clientApplicationId
    TenantOnboardingRequestList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: ../../admission/v1/onboarding.schema.json#/$defs/TenantOnboardingRequest
    ProvisioningOperation:
      type: object
      additionalProperties: false
      required: [operation_id, tenant_id, state, revision, created_at]
      properties:
        operation_id: { type: string, format: uuid }
        tenant_id: { $ref: ./domain.schema.json#/$defs/tenantId }
        state:
          type: string
          enum: [requested, accepted, provisioning, reconciling, active, suspended, failed, decommissioning, cancelled]
        revision: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        failure_code: { type: [string, "null"] }
  responses:
    ClientApplication:
      description: The ClientApplication
      content:
        application/json:
          schema:
            $ref: ../../admission/v1/application.schema.json#/$defs/ClientApplication
    ClientApplicationPage:
      description: A page of ClientApplications
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClientApplicationPage"
    AdmissionDecision:
      description: The immutable AdmissionDecision
      content:
        application/json:
          schema:
            $ref: ../../admission/v1/decision.schema.json#/$defs/AdmissionDecision
    TenantOnboardingRequest:
      description: The TenantOnboardingRequest
      content:
        application/json:
          schema:
            $ref: ../../admission/v1/onboarding.schema.json#/$defs/TenantOnboardingRequest
    TenantLifecycleResult:
      description: The status the command set
      content:
        application/json:
          schema:
            $ref: ./tenant.schema.json#/$defs/TenantLifecycleResult
    SubscriptionClassificationRecord:
      description: The classification record
      content:
        application/json:
          schema:
            $ref: ../../product/v1/subscription.schema.json#/$defs/SubscriptionClassificationRecord
    ClassificationExplanation:
      description: Why the subscription is classified as it is
      content:
        application/json:
          schema:
            $ref: ../../product/v1/subscription.schema.json#/$defs/ClassificationExplanation
    IamOrganisationReference:
      description: The IAM organisation link
      content:
        application/json:
          schema:
            $ref: ../../organisation/v1/iam.schema.json#/$defs/IamOrganisationReference
    IamOrganisationReferenceList:
      description: The Organisation's IAM organisation links
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: ../../organisation/v1/iam.schema.json#/$defs/IamOrganisationReference
    IamOrganisationResolution:
      description: The canonical Organisation the evidence resolves to
      content:
        application/json:
          schema:
            $ref: ../../organisation/v1/iam.schema.json#/$defs/IamOrganisationResolution
    OrganisationAdmissionOutcome:
      description: The admission outcome
      content:
        application/json:
          schema:
            $ref: ../../organisation/v1/admission.schema.json#/$defs/OrganisationAdmissionOutcome
    CounterpartyReconciliationReport:
      description: The reconciliation run
      content:
        application/json:
          schema:
            $ref: ../../organisation/v1/counterparty.schema.json#/$defs/CounterpartyReconciliationReport
    OrganisationResolutionCandidate:
      description: The resolution candidate
      content:
        application/json:
          schema:
            $ref: ../../organisation/v1/counterparty.schema.json#/$defs/OrganisationResolutionCandidate
    ResolutionCandidatePage:
      description: A page of resolution candidates
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: ../../organisation/v1/counterparty.schema.json#/$defs/OrganisationResolutionCandidate
                next:
                  description: Cursor for the next page; absent on the last page.
                  $ref: ../../organisation/v1/counterparty.schema.json#/$defs/resolutionCandidateId
    CounterpartyRole:
      description: The counterparty role as stored
      content:
        application/json:
          schema:
            $ref: ../../organisation/v1/counterparty.schema.json#/$defs/CounterpartyRole
    CounterpartyRoleList:
      description: The tenant's counterparty roles
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: ../../organisation/v1/counterparty.schema.json#/$defs/CounterpartyRole
    PlatformAccount:
      description: The platform account
      content:
        application/json:
          schema:
            $ref: ../../organisation/v1/platform.schema.json#/$defs/PlatformAccount
    TenantPlatformAccountBinding:
      description: The binding
      content:
        application/json:
          schema:
            $ref: ../../organisation/v1/platform.schema.json#/$defs/TenantPlatformAccountBinding
    TenantPlatformAccountBindingList:
      description: The tenant's bindings
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: ../../organisation/v1/platform.schema.json#/$defs/TenantPlatformAccountBinding
    RelationshipDriftReport:
      description: Current relationship drift
      content:
        application/json:
          schema:
            $ref: ../../organisation/v1/observability.schema.json#/$defs/RelationshipDriftReport
    OrganisationAuditPage:
      description: A page of audit lineage, newest first
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: ../../organisation/v1/observability.schema.json#/$defs/OrganisationAuditEntry
                next:
                  description: Cursor for the next page; absent on the last page.
                  $ref: ../../organisation/v1/observability.schema.json#/$defs/OrganisationAuditEntry/properties/audit_id
    CanonicalEntity:
      description: The canonical entity
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: ./canonical-entity.schema.json#/$defs/CanonicalEntity
    NoContent:
      description: Done; no body
    PreconditionFailed:
      description: The If-Match version is stale; reload before changing the resource
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PreconditionRequired:
      description: The command requires an If-Match version
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InternalError:
      description: The Control Plane failed; the problem is retryable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: No such resource, or one the caller may not see
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PayloadTooLarge:
      description: The request body exceeds 1 MiB
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ServiceUnavailable:
      description: A dependency is unavailable; the problem is retryable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: Unresolved tenant or insufficient authority or entitlement
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: Lifecycle conflict or incompatible idempotent replay
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unprocessable:
      description: The command is well formed but contradicts governed state, e.g. it departs from the onboarding request's desired state
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  headers:
    ETag:
      description: The resource's current version as a strong entity tag, e.g. "3".
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    Location:
      description: The created resource's path.
      schema:
        type: string
  securitySchemes:
    adminOidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.baobab-platform.com/.well-known/openid-configuration
      description: Human administrator identity; issuer is environment-configured by the implementation.
    workloadOidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.baobab-platform.com/.well-known/openid-configuration
      description: Short-lived workload or delegated identity token used only over the infrastructure-owned mTLS path.
