openapi: 3.1.0
info:
  title: Baobab-Platform Baobab Control Plane API
  version: 1.23.0
  description: >-
    The Control Plane's runtime and administrative API (ADR-BCP-022).
    Implementations live in baobab-platform/baobab-cp. Every adminOidc
    operation also requires Control Plane authority beyond its scope (the
    platform-administrator role, or tenant-administrator membership for
    tenant-scoped operations) and, for administrative commands, a registered
    Control Plane principal; the scope is necessary, never sufficient. The
    one exception is getEffectiveAuthority, which reports the caller's own
    administrative grants and so needs no authority beyond its scope.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
tags:
  - name: Applications
    description: An applicant's own ClientApplications (ADR-BCP-017).
  - name: Admission
    description: Platform review and decision of ClientApplications (ADR-BCP-017, ADR-BCP-020 sections 34-35).
  - name: Onboarding
    description: TenantOnboardingRequests between an APPROVED decision and tenant registration (ADR-BCP-017 sections 22-24).
  - name: Tenants
    description: Reading tenants, their product entitlements and lifecycle commands (ADR-BCP-022 section 43).
  - name: Classification
    description: A ProductSubscription's classification and its explanation (ADR-BCP-018 ORG-11, ADR-SHARED-011).
  - name: Mappings
    description: ExternalReferences, canonical Mappings, their lifecycle and resolution (Canonical Mapping Model, ADR-SHARED-012).
  - name: Canonical registry
    description: Registering canonical entities and their lifecycle commands (ADR-BCP-001, ADR-0006, ADR-BCP-016).
  - name: Organisations
    description: IAM organisation links, organisation admission, legacy reconciliation and duplicate review (ADR-BCP-018 ORG-09, ORG-10, ORG-13).
  - name: Counterparties
    description: Tenant-scoped counterparty roles held by Organisations (ADR-BCP-018 ORG-13).
  - name: Platform accounts
    description: Platform accounts and tenants' bindings to them (ADR-BCP-018 ORG-07).
  - name: Audit
    description: Read-only audit lineage (ADR-BCP-022 section 46).
  - name: Diagnostics
    description: Privileged, read-only diagnostics (ADR-BCP-022 section 47).
  - name: Provisioning
    description: Tenant provisioning as desired-state convergence - plan, approve, apply, readiness and drift (ADR-SHARED-015).
  - name: Topology
    description: Provider migration - discovery, planning and the migration aggregate (ADR-BCP-006 sections 44-58, 119-122) - and engine releases (ADR-BCP-025).
  - name: Markets
    description: The market registry - register, read, update and activate commercial markets (ADR-BCP-004 section 18).
  - name: Verification
    description: Verification cases, claims, checks, results and discrepancies; evidence metadata and sources (ADR-BCP-023 gate OEV-03).
  - name: Changesets
    description: The governed unit of change - draft, submit, plan, approve, apply, cancel and outcome (ADR-BCP-021, ADR-BCP-022 section 44).
  - name: Operations
    description: Durable long-running operations and their retry and cancellation (ADR-BCP-022 sections 54-67).
  - name: Administration
    description: Administrative authority - what the caller may administer and where (ADR-BCP-020).
servers:
  - url: https://control.baobab-platform.com/v1
    description: Production placeholder; activation requires an approved domain binding.
paths:
  /tenants:
    post:
      security:
        - adminOidc: [tenant:write]
      operationId: registerTenant
      summary: Record the tenant of an AUTHORISED TenantOnboardingRequest
      description: >-
        There is no direct registration (ADR-BCP-017 sections 22-24). The
        command names an AUTHORISED TenantOnboardingRequest whose desired
        state it must match; the request is recorded FULFILLED with the minted
        tenant, and produces at most one tenant. It only records the tenant
        identity in the Control Plane registry and has no runtime effect:
        nothing is registered with engines, granted, bound, configured or
        projected. The tenant's provisioning is planned with
        createTenantProvisioning and takes effect only when an approved plan
        is applied (ADR-SHARED-015). The ProvisioningOperation returned is
        the deprecated coarse projection and is `accepted` until then.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CausationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Tracestate"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./tenant-registration.schema.json
      responses:
        "202":
          description: Registration accepted or an existing idempotent result returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningOperation"
              examples:
                controlPlaneMintedTenant:
                  summary: The Control Plane returns the tenant identity it minted
                  value:
                    operation_id: bb5e2e28-51e8-476b-b9cc-d4e94ced3d3d
                    tenant_id: tn_01k4m7x9q2v6c8r3d5f1h0j4
                    state: accepted
                    revision: 1
                    created_at: "2026-08-31T12:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /tenants/bootstrap-registrations:
    post:
      security:
        - adminOidc: [tenant:bootstrap]
      operationId: bootstrapRegisterTenant
      summary: Register a tenant that predates the admission workflow (migration and platform bootstrap only)
      description: >-
        The only registration path without a TenantOnboardingRequest. It needs
        the privileged tenant:bootstrap scope, is disabled unless the Control
        Plane explicitly enables it, and audits its reason and evidence
        reference. It is never a route for a new customer. Like
        registerTenant, it only records the tenant and has no runtime effect
        (ADR-SHARED-015).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CausationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Tracestate"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./tenant-bootstrap-registration.schema.json
      responses:
        "202":
          description: Registration accepted or an existing idempotent result returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /context/resolve:
    post:
      operationId: resolveTenantContext
      summary: Resolve authoritative tenant and product-entitlement context from the authenticated principal
      security:
        - workloadOidc: [context:resolve]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CausationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Tracestate"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./context-resolution.schema.json#/$defs/request
      responses:
        "200":
          description: Active, entitled tenant context
          headers:
            Cache-Control:
              schema: { type: string, const: "private, max-age=15" }
          content:
            application/json:
              schema:
                $ref: ./context-resolution.schema.json#/$defs/response
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /capabilities/resolve:
    post:
      operationId: resolveCapability
      summary: Resolve one capability for a resolved PlatformContext
      description: >-
        Redeems a context_id from resolvePlatformContext (bound to the caller's
        tenant: another tenant's context is TENANT_CONTEXT_MISMATCH, 403; an
        unknown or expired one is CONTEXT_NOT_FOUND, 404) and decides the
        capability as capability/v1 resolution.schema.json. A non-RESOLVED
        decision is a normal 200 carrying a capability_resolution_denial
        reason_code: DENIED for CAPABILITY_UNKNOWN, GRANT_NOT_FOUND,
        GRANT_SUSPENDED, GRANT_REVOKED, GRANT_EXPIRED and
        RESIDENCY_POLICY_MISMATCH; UNAVAILABLE for CAPABILITY_INACTIVE,
        BINDING_NOT_FOUND, PROVIDER_UNAVAILABLE, PROVIDER_HEALTH_UNKNOWN and
        PROVIDER_INVOCATION_UNDECLARED; AMBIGUOUS for BINDING_AMBIGUOUS;
        INCOMPATIBLE for CONTRACT_VERSION_UNSUPPORTED. A RESOLVED decision
        names the grant, the binding and the invocation (the binding's
        provider's registered logical reference and engine instance) and
        expires when the health it relied on does. Every decision is recorded
        under its resolution_id.
      security:
        - workloadOidc: [context:resolve]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../capability/v1/resolution.schema.json#/$defs/resolutionRequest
      responses:
        "200":
          description: The resolution decision
          content:
            application/json:
              schema:
                $ref: ../../capability/v1/resolution.schema.json#/$defs/resolution
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /capabilities/resolve-batch:
    post:
      operationId: resolveCapabilityBatch
      summary: Resolve up to 50 capabilities for one resolved PlatformContext
      description: >-
        As resolveCapability for each capability, decided independently: a
        batch has no atomicity across its members, and each decision is
        recorded under its own resolution_id.
      security:
        - workloadOidc: [context:resolve]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../capability/v1/resolution.schema.json#/$defs/batchResolutionRequest
      responses:
        "200":
          description: One decision per requested capability, in request order
          content:
            application/json:
              schema:
                $ref: ../../capability/v1/resolution.schema.json#/$defs/batchResolution
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /platform-context/resolve:
    post:
      operationId: resolvePlatformContext
      summary: Resolve and persist the trusted PlatformContext a capability resolution redeems
      description: >-
        Resolves identity, tenant, the principal's relationship to the tenant
        and legal entity from the verified workload token, fails closed at each
        step (ADR-BCP-004 section 52), and optionally attests an organisation
        the caller names, by organisation_id or by IAM organisation evidence,
        and its exact kind (ADR-BCP-016, ADR-BCP-018 ORG-10, ADR-BCP-024). The
        context is persisted and returned by context_id, which capability
        resolution (capability/v1 resolution.schema.json) redeems instead of
        an inline tenant. An empty body is valid.
      security:
        - workloadOidc: [context:resolve]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ./platform-context.schema.json#/$defs/PlatformContextResolveRequest
      responses:
        "200":
          description: >-
            The resolved, persisted context, carrying the tenant's market
            participation: its only ACTIVE participation, or the one
            country_code selects. 403 codes: TENANT_CONTEXT_MISMATCH,
            ORGANISATION_NOT_RESOLVED, IDENTITY_RESOLUTION_FAILED,
            TENANT_NOT_ACTIVE, MARKET_CONTEXT_AMBIGUOUS (several
            participations and none selected), MARKET_CONTEXT_NOT_PARTICIPATING
            (the selected country is not an ACTIVE participation) and
            CONTEXT_DENIED.
          content:
            application/json:
              schema:
                $ref: ./platform-context.schema.json#/$defs/PlatformContext
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /resolve:
    post:
      operationId: resolveComposed
      deprecated: true
      summary: Deprecated composed resolution of a canonical entity and capability
      description: >-
        Deprecated: it takes tenant_id in the body, which capability resolution
        never accepts, and answers with the composed pipeline's internals rather
        than a CapabilityResolution. Callers move to resolvePlatformContext and
        then capability resolution by context_id. Served until its callers have
        moved. A request the pipeline cannot resolve is RESOLUTION_FAILED (400)
        with an opaque detail (ADR-0008 section 45).
      security:
        - workloadOidc: [context:resolve]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./platform-context.schema.json#/$defs/ComposedResolutionRequest
      responses:
        "200":
          description: The composed routing decision
          content:
            application/json:
              schema:
                $ref: ./platform-context.schema.json#/$defs/ComposedResolution
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  # ---------------------------------------------------------------------------
  # Mappings (Canonical Mapping Model sections 8-9, 23 and 46-49; ADR-SHARED-012):
  # ExternalReferences record that a native object exists; Mappings relate a
  # canonical entity to one, or to another canonical entity, within a tenant.
  # Every lifecycle command needs the mapping's revision in If-Match, and the
  # actor is always the verified caller, never a body field. Administrative
  # operations also require Control Plane platform-administrator authority.
  # ---------------------------------------------------------------------------
  /external-references:
    post:
      tags: [Mappings]
      operationId: createExternalReference
      summary: Record a native object's identity
      description: >-
        The (system_namespace, engine_id) pair must be registered in
        external-systems.yaml, or the request is refused with
        EXTERNAL_SYSTEM_NOT_REGISTERED (422). A native identity is recorded
        once: a second registration is refused with
        EXTERNAL_REFERENCE_EXISTS (409); look it up with
        listExternalReferences. The reference starts unverified.
      security:
        - adminOidc: [mapping:write]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./canonical-mapping.schema.json#/$defs/externalReferenceCreateRequest
      responses:
        "201":
          description: Recorded
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: ./canonical-mapping.schema.json#/$defs/externalReference
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags: [Mappings]
      operationId: listExternalReferences
      summary: Find the ExternalReference for a native identity
      description: >-
        Returns the reference with exactly this native identity, or an empty
        list. It says nothing about which canonical entity the object
        corresponds to: that is resolveExternalReference.
      security:
        - adminOidc: [canonical:read]
      parameters:
        - { name: system_namespace, in: query, required: true, schema: { $ref: "./canonical-mapping.schema.json#/$defs/externalReference/properties/system_namespace" } }
        - { name: engine_id, in: query, required: true, schema: { $ref: "./domain.schema.json#/$defs/engineId" } }
        - { name: native_entity_type, in: query, required: true, schema: { $ref: "./canonical-mapping.schema.json#/$defs/externalReference/properties/native_entity_type" } }
        - { name: native_id, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 256 } }
        - { name: engine_instance_id, in: query, required: false, schema: { $ref: "./domain.schema.json#/$defs/engineInstanceId" } }
        - { name: environment, in: query, required: false, schema: { $ref: "./domain.schema.json#/$defs/environment" } }
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The matching reference, if any
          content:
            application/json:
              schema:
                $ref: ./canonical-mapping.schema.json#/$defs/externalReferenceList
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /external-references/{external_reference_id}:
    parameters:
      - $ref: "#/components/parameters/ExternalReferenceId"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Mappings]
      operationId: getExternalReference
      summary: Read an ExternalReference
      security:
        - adminOidc: [canonical:read]
      responses:
        "200":
          description: The reference
          content:
            application/json:
              schema:
                $ref: ./canonical-mapping.schema.json#/$defs/externalReference
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /resolution/external-references:
    post:
      tags: [Mappings]
      operationId: resolveExternalReference
      summary: Resolve a native object to its canonical entity
      description: >-
        Follows ACTIVE EXTERNAL_TO_CANONICAL or BIDIRECTIONAL Mappings of the
        tenant in effect at effective_timestamp (Canonical Mapping Model
        section 23). No match is MAPPING_NOT_FOUND (404); several equally
        authoritative matches are MAPPING_AMBIGUOUS (409) and resolve to
        nothing. An IAM organisation is resolved by resolveIamOrganisation,
        never here (ADR-BCP-018 ORG-10).
      security:
        - adminOidc: [canonical:read]
        - workloadOidc: [mapping:resolve]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Tracestate"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./canonical-mapping.schema.json#/$defs/externalReferenceResolutionRequest
      responses:
        "200":
          description: The canonical entity and the mapping that relates it
          content:
            application/json:
              schema:
                $ref: ./canonical-mapping.schema.json#/$defs/externalReferenceResolutionResponse
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /mappings:
    post:
      tags: [Mappings]
      operationId: createMapping
      summary: Propose a canonical mapping
      description: >-
        The mapping starts DRAFT at revision 1, created by the verified
        caller. Its canonical entity, target and scope must belong to its
        tenant (CROSS_TENANT_MAPPING, 422), and each must exist (404).
      security:
        - adminOidc: [mapping:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CausationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Tracestate"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./canonical-mapping.schema.json#/$defs/mappingCreateRequest
      responses:
        "201":
          description: Proposed, DRAFT
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: ./canonical-mapping.schema.json#/$defs/mapping
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /mappings/{mapping_id}:
    parameters:
      - $ref: "#/components/parameters/MappingId"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Mappings]
      operationId: getMapping
      summary: Read a mapping
      security:
        - adminOidc: [canonical:read]
        - workloadOidc: [mapping:read]
      responses:
        "200":
          $ref: "#/components/responses/Mapping"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Mappings]
      operationId: updateMapping
      summary: Change a DRAFT mapping
      description: >-
        Only a DRAFT mapping changes (MAPPING_NOT_DRAFT, 409). What it relates,
        its tenant and its type never change.
      security:
        - adminOidc: [mapping:write]
      parameters:
        - $ref: "#/components/parameters/MappingIfMatch"
        - $ref: "#/components/parameters/CausationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./canonical-mapping.schema.json#/$defs/mappingUpdateRequest
      responses:
        "200":
          $ref: "#/components/responses/Mapping"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /mappings/{mapping_id}/validate:
    parameters:
      - $ref: "#/components/parameters/MappingId"
      - $ref: "#/components/parameters/MappingIfMatch"
      - $ref: "#/components/parameters/CorrelationId"
      - $ref: "#/components/parameters/CausationId"
    post:
      tags: [Mappings]
      operationId: validateMapping
      summary: Validate a DRAFT mapping
      description: >-
        Takes no body. Moves DRAFT to VALIDATED; any other status is MAPPING_LIFECYCLE_CONFLICT (409).
      security:
        - adminOidc: [mapping:write]
      responses:
        "200":
          $ref: "#/components/responses/Mapping"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
