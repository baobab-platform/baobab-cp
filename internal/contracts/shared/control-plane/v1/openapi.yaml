        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /canonical-entities/{entity_id}/suspend:
    parameters:
      - $ref: "#/components/parameters/CanonicalEntityId"
      - $ref: "#/components/parameters/CanonicalEntityIfMatch"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Canonical registry]
      operationId: suspendCanonicalEntity
      summary: Suspend an ACTIVE canonical entity
      description: >-
        Takes no body. Moves ACTIVE to SUSPENDED; any other state is refused with CANONICAL_ENTITY_LIFECYCLE_CONFLICT (409). Suspending an organisation also suspends its profile and emits OrganisationSuspended, atomically (ADR-BCP-018); every context resolution through it then fails closed. There is no reinstatement command.
      security:
        - adminOidc: [canonical:write]
      responses:
        "200":
          $ref: "#/components/responses/CanonicalEntity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
