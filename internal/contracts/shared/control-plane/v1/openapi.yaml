      operationId: explainCapability
      summary: Explain a capability resolution for a stored context
      description: >-
        Runs capability resolution against a context the Control Plane stored
        earlier and reports the stage it reached and why it stopped (ADR-BCP-
        003 section 80). Not restricted to the caller's own tenant: explaining
        a customer's failed resolution is its purpose. It exposes internal
        topology, so it is privileged, and it never grants access. A failed
        resolution is still a 200 whose outcome is FAILED. An unknown or
        expired context is refused with CONTEXT_NOT_FOUND (404). Also
        requires Control Plane platform-administrator authority.
      security:
        - adminOidc: [capabilities:explain]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
