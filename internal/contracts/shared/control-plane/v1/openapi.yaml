            $ref: ./domain.schema.json#/$defs/tenantId
      responses:
        "200":
          description: A page of changesets
          content:
            application/json:
              schema:
                $ref: ./changeset.schema.json#/$defs/ChangesetPage
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/changesets/{changeset_id}:
    parameters:
      - $ref: "#/components/parameters/ChangesetId"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Changesets]
      operationId: getChangeset
      summary: Read a changeset
      security:
        - adminOidc: [changeset:read]
      responses:
        "200":
          $ref: "#/components/responses/Changeset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/changesets/{changeset_id}/submit:
    parameters:
      - $ref: "#/components/parameters/ChangesetId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Changesets]
      operationId: submitChangeset
      summary: Validate and plan the changeset
      description: >-
        Valid from DRAFT, BLOCKED, CHANGES_REQUESTED and APPROVED (a stale
        approved plan), otherwise CHANGESET_STATE_CONFLICT (409). Validates
        the desired change against authoritative state and generates a new,
        side-effect-free plan version. The changeset returns INVALID or
        BLOCKED with its blocking reasons, or AWAITING_APPROVAL with its
        current plan. A decision on an earlier plan version lapses. The
        changeset's revision is required in If-Match.
      security:
        - adminOidc: [changeset:write]
      parameters:
        - $ref: "#/components/parameters/ChangesetIfMatch"
      responses:
        "200":
          $ref: "#/components/responses/Changeset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admin/changesets/{changeset_id}/plan:
    parameters:
      - $ref: "#/components/parameters/ChangesetId"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Changesets]
      operationId: getChangesetPlan
      summary: Read the changeset's current immutable plan and its impact
      description: >-
        The plan a reviewer approves: its steps, impact analysis, risk class,
        blockers and digest. The ETag is the plan digest.
      security:
        - adminOidc: [changeset:read]
      responses:
        "200":
          description: The current plan
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: ./changeset.schema.json#/$defs/ChangesetPlan
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/changesets/{changeset_id}/approve:
    parameters:
      - $ref: "#/components/parameters/ChangesetId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Changesets]
      operationId: decideChangesetPlan
      summary: Approve, reject or request changes to the exact current plan
      description: >-
        Records an ApprovalDecision (subject CHANGESET) bound to the plan id,
        version and digest the approver reviewed (ADR-BCP-021 sections 24,
        49-52). Valid only in AWAITING_APPROVAL. The approver is the verified
        caller, holds administrative authority to approve at the target's
        scope, and is never the requester (CHANGESET_SELF_APPROVAL, 403).
        When the change kind names an approval_scope
        (changeset-lifecycle.yaml change_kinds), the approver also holds that
        scope (403) and meets the target's own maker-checker rule, exactly as
        on the kind's direct route: a MARKET_ACTIVATION approver is neither
        the market's creator nor its last editor (MARKET_SELF_ACTIVATION,
        403), a MAPPING_ACTIVATION approver is not the mapping's creator
        (MAPPING_SELF_APPROVAL, 403) and an ENGINE_RELEASE_APPROVAL approver
        is not the principal who recorded the release
        (RELEASE_SELF_APPROVAL, 403). A
        decision naming another plan or digest is PLAN_DIGEST_MISMATCH (409);
        a stale plan is PLAN_STALE (409). The changeset's revision is
        required in If-Match.
      security:
        - adminOidc: [changeset:approve]
      parameters:
        - $ref: "#/components/parameters/ChangesetIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./approval-decision.schema.json#/$defs/ApprovalDecisionRequest
      responses:
        "200":
          description: The recorded decision
          content:
            application/json:
              schema:
                $ref: ./approval-decision.schema.json#/$defs/ApprovalDecision
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/changesets/{changeset_id}/apply:
    parameters:
      - $ref: "#/components/parameters/ChangesetId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Changesets]
      operationId: applyChangeset
      summary: Start asynchronous execution of the approved plan
      description: >-
        Takes no body. Executes exactly the approved plan (section 72): the
        changeset must be APPROVED, its plan not stale and the approval's
        digest equal to the current plan's (PLAN_NOT_APPROVED, PLAN_STALE,
        PLAN_DIGEST_MISMATCH; 409). Returns 202 with a CHANGESET_APPLY
        operation; 202 does not mean the change is complete (ADR-BCP-022
        section 57). Replaying the same Idempotency-Key returns the same
        operation.
      security:
        - adminOidc: [changeset:write]
      parameters:
        - $ref: "#/components/parameters/ChangesetIfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/ExecutionOperationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admin/changesets/{changeset_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ChangesetId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Changesets]
      operationId: cancelChangeset
      summary: Cancel a changeset that has not started applying
      description: >-
        Valid before apply starts (section 103), otherwise
        CHANGESET_STATE_CONFLICT (409). An applying changeset is cancelled
        through its operation (/admin/operations/{operation_id}/cancel,
        section 104): the changeset then becomes CANCELLED if no step took
        effect, PARTIALLY_APPLIED if one did, or COMPENSATED once compensated
        (changeset-lifecycle.yaml). Records the reason. The changeset's
        revision is required in If-Match.
      security:
        - adminOidc: [changeset:write]
      parameters:
        - $ref: "#/components/parameters/ChangesetIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./changeset.schema.json#/$defs/ChangesetCancelRequest
      responses:
        "200":
          $ref: "#/components/responses/Changeset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/changesets/{changeset_id}/outcome:
    parameters:
      - $ref: "#/components/parameters/ChangesetId"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Changesets]
      operationId: getChangeOutcome
      summary: Read the outcome record of a changeset that has ended
      description: >-
        Present once the changeset reached a terminal state (section 114);
        before that CHANGE_OUTCOME_NOT_FOUND (404).
      security:
        - adminOidc: [changeset:read]
      responses:
        "200":
          description: The outcome
          content:
            application/json:
              schema:
                $ref: ./changeset.schema.json#/$defs/ChangeOutcome
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/operations/{operation_id}:
    parameters:
      - $ref: "#/components/parameters/OperationId"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Operations]
      operationId: getOperation
      summary: Poll a long-running operation
      description: >-
        The durable operation resource (ADR-BCP-022 sections 58-67). Its
        status is the operation's; its result names the resulting resource
        and state. Supports If-None-Match with the ETag, returning 304 while
        unchanged, and may suggest a polling interval with Retry-After. An
        operation outside the caller's authority is NOT_FOUND.
      security:
        - adminOidc: [operation:read]
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/ExecutionOperation"
        "304":
          description: Not modified since the ETag given in If-None-Match
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/operations/{operation_id}/retry:
    parameters:
      - $ref: "#/components/parameters/OperationId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Operations]
      operationId: retryOperation
      summary: Retry a failed operation
      description: >-
        Valid only while the operation is retryable (OPERATION_NOT_RETRYABLE,
        409). Retrying a provisioning apply resumes the approved plan while
        it is not stale; a stale plan must be replanned and approved again
        (PLAN_STALE, 409). Never recomputes business intent.
      security:
        - adminOidc: [operation:control]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./execution-operation.schema.json#/$defs/OperationCommandRequest
      responses:
        "202":
          $ref: "#/components/responses/ExecutionOperationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/operations/{operation_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/OperationId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Operations]
      operationId: cancelOperation
      summary: Request cancellation of a running operation
      description: >-
        Moves the operation to CANCEL_REQUESTED; it reaches CANCELLED, or a
        compensation status, when execution stops at a safe point. A
        cancelled provisioning apply or remediation leaves the provisioning
        BLOCKED with the reason EXECUTION_CANCELLED. Abandoning a
        provisioning that is not executing is withdrawTenantProvisioning, not
        an operation command. A finished operation is
        OPERATION_NOT_CANCELLABLE (409).
      security:
        - adminOidc: [operation:control]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./execution-operation.schema.json#/$defs/OperationCommandRequest
      responses:
        "202":
          $ref: "#/components/responses/ExecutionOperationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
        minLength: 16
        maxLength: 128
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Makes the command replayable; a replay with a different body is refused with IDEMPOTENCY_KEY_REUSED (409).
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
        minLength: 16
        maxLength: 128
    ApplicationId:
      name: application_id
      in: path
      required: true
      schema:
        $ref: ../../admission/v1/application.schema.json#/$defs/clientApplicationId
    OnboardingRequestId:
      name: request_id
      in: path
      required: true
      schema:
        $ref: ../../admission/v1/onboarding.schema.json#/$defs/tenantOnboardingRequestId
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema:
        $ref: ./domain.schema.json#/$defs/tenantId
    SubscriptionId:
      name: subscription_id
      in: path
      required: true
      schema:
        $ref: ../../product/v1/domain.schema.json#/$defs/subscriptionId
    CanonicalEntityId:
      name: entity_id
      in: path
      required: true
      schema:
        $ref: ./domain.schema.json#/$defs/canonicalEntityId
    MappingId:
      name: mapping_id
      in: path
      required: true
      schema:
        $ref: ./domain.schema.json#/$defs/mappingId
    ExternalReferenceId:
      name: external_reference_id
      in: path
      required: true
      schema:
        $ref: ./domain.schema.json#/$defs/externalReferenceId
    TenantProvisioningId:
      name: tenant_provisioning_id
      in: path
      required: true
      schema:
        $ref: ./domain.schema.json#/$defs/tenantProvisioningId
    ChangesetId:
      name: changeset_id
      in: path
      required: true
      schema:
        $ref: ./domain.schema.json#/$defs/changesetId
    VerificationCaseId:
      name: case_id
      in: path
      required: true
      schema:
        $ref: ../../evidence/v1/domain.schema.json#/$defs/verificationCaseId
    EvidenceClaimId:
      name: claim_id
      in: path
      required: true
      schema:
        $ref: ../../evidence/v1/domain.schema.json#/$defs/evidenceClaimId
    EvidenceDiscrepancyId:
      name: discrepancy_id
      in: path
      required: true
      schema:
        $ref: ../../evidence/v1/domain.schema.json#/$defs/evidenceDiscrepancyId
    EvidenceId:
      name: evidence_id
      in: path
      required: true
      schema:
        $ref: ../../evidence/v1/domain.schema.json#/$defs/evidenceRecordId
    VersionIfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        The resource's current version as a strong entity tag, e.g. "3" (the
        ETag of its last read). Missing is refused with IF_MATCH_REQUIRED
        (428); malformed with INVALID_IF_MATCH (400); stale with
        VERSION_MISMATCH (412).
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    MarketId:
      name: market_id
      in: path
      required: true
      schema:
        $ref: ./market.schema.json#/$defs/marketId
    MarketIfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        The market's current revision as a strong entity tag, e.g. "3" (the
        ETag of its last read). Missing is refused with IF_MATCH_REQUIRED
        (428); malformed with INVALID_IF_MATCH (400); stale with
        MARKET_REVISION_MISMATCH (412).
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    ChangesetIfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        The changeset's current revision as a strong entity tag, e.g. "3"
        (the ETag of its last read). Missing is refused with
        IF_MATCH_REQUIRED (428); malformed with INVALID_IF_MATCH (400); stale
        with CHANGESET_REVISION_MISMATCH (412).
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    EngineReleaseId:
      name: release_id
      in: path
      required: true
      schema:
        $ref: ./domain.schema.json#/$defs/engineReleaseId
    ProviderMigrationId:
      name: provider_migration_id
      in: path
      required: true
      schema:
        $ref: ./domain.schema.json#/$defs/providerMigrationId
    ProviderMigrationIfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        The migration's current revision as a strong entity tag, e.g. "3"
        (the ETag of its last read). Missing is refused with
        IF_MATCH_REQUIRED (428); malformed with INVALID_IF_MATCH (400); stale
        with PROVIDER_MIGRATION_REVISION_MISMATCH (412).
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    EngineMigrationTaskId:
      name: task_id
      in: path
      required: true
      schema:
        $ref: ./engine-migration-task.schema.json#/$defs/engineMigrationTaskId
    EngineMigrationTaskIfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        The task's current revision as a strong entity tag, e.g. "2" (the
        ETag of its last read). Missing is refused with IF_MATCH_REQUIRED
        (428); malformed with INVALID_IF_MATCH (400); stale with
        ENGINE_MIGRATION_TASK_REVISION_MISMATCH (412).
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: ./domain.schema.json#/$defs/operationId
    ProvisioningIfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        The provisioning's current revision as a strong entity tag, e.g. "3"
        (the ETag of its last read). Missing is refused with
        IF_MATCH_REQUIRED (428); malformed with INVALID_IF_MATCH (400); stale
        with PROVISIONING_REVISION_MISMATCH (412).
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    MappingIfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        The mapping's current revision as a strong entity tag, e.g. "3" (the
        ETag of its last read). Missing is refused with IF_MATCH_REQUIRED
        (428); malformed with INVALID_IF_MATCH (400); stale with
        MAPPING_REVISION_MISMATCH (412), after which the client reloads the
        mapping rather than retrying.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    CanonicalEntityIfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        The entity's current version as a strong entity tag, e.g. "3" (the
        ETag of its last read). Missing is refused with IF_MATCH_REQUIRED
        (428); malformed with INVALID_IF_MATCH (400); stale with
        CANONICAL_ENTITY_VERSION_MISMATCH (412), after which the client
        reloads the entity rather than retrying (ADR-BCP-022 sections 127-131).
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    IamOrganisationReferenceId:
      name: reference_id
      in: path
      required: true
      schema:
        $ref: ../../organisation/v1/domain.schema.json#/$defs/iamOrganisationReferenceId
    ResolutionCandidateId:
      name: candidate_id
      in: path
      required: true
      schema:
        $ref: ../../organisation/v1/counterparty.schema.json#/$defs/resolutionCandidateId
    CounterpartyRoleId:
      name: role_id
      in: path
      required: true
      schema:
        $ref: ../../organisation/v1/counterparty.schema.json#/$defs/counterpartyRoleId
    PlatformAccountId:
      name: account_id
      in: path
      required: true
      schema:
        $ref: ../../organisation/v1/domain.schema.json#/$defs/platformAccountId
    PageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    ApplicationCursor:
      name: before
      in: query
      required: false
      description: The previous page's next cursor; lists applications older than it.
      schema:
        $ref: ../../admission/v1/application.schema.json#/$defs/clientApplicationId
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: A caller-supplied business correlation UUID. The service mints one when absent and returns it in problem details and emitted consequences.
      schema: { type: string, format: uuid }
    CausationId:
      name: X-Causation-ID
      in: header
      required: false
      description: UUID of the immediate command or event that caused this request. Omit it for a root interaction.
      schema: { type: string, format: uuid }
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context version 00 traceparent value.
      schema:
        type: string
        pattern: "^00-(?!00000000000000000000000000000000)[0-9a-f]{32}-(?!0000000000000000)[0-9a-f]{16}-[0-9a-f]{2}$"
    Tracestate:
      name: tracestate
      in: header
      required: false
      description: Optional W3C vendor trace state; never use it for credentials or business payloads.
      schema:
        type: string
        pattern: "^[ -~]+$"
        minLength: 1
        maxLength: 512
  schemas:
    ProblemDetails:
      $ref: ../../errors/v1/problem-details.schema.json
    ClientApplicationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: ../../admission/v1/application.schema.json#/$defs/ClientApplication
        next:
          description: Cursor for the next (older) page, passed as before; absent on the last page.
          $ref: ../../admission/v1/application.schema.json#/$defs/clientApplicationId
    TenantOnboardingRequestList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: ../../admission/v1/onboarding.schema.json#/$defs/TenantOnboardingRequest
    ProvisioningOperation:
      type: object
      additionalProperties: false
      required: [operation_id, tenant_id, state, revision, created_at]
      properties:
        operation_id: { type: string, format: uuid }
        tenant_id: { $ref: ./domain.schema.json#/$defs/tenantId }
        state:
          type: string
          enum: [requested, accepted, provisioning, reconciling, active, suspended, failed, decommissioning, cancelled]
        revision: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        failure_code: { type: [string, "null"] }
  responses:
    ClientApplication:
      description: The ClientApplication
      content:
        application/json:
          schema:
            $ref: ../../admission/v1/application.schema.json#/$defs/ClientApplication
    ClientApplicationPage:
      description: A page of ClientApplications
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClientApplicationPage"
    AdmissionDecision:
      description: The immutable AdmissionDecision
      content:
        application/json:
          schema:
            $ref: ../../admission/v1/decision.schema.json#/$defs/AdmissionDecision
    TenantOnboardingRequest:
      description: The TenantOnboardingRequest
      content:
        application/json:
          schema:
            $ref: ../../admission/v1/onboarding.schema.json#/$defs/TenantOnboardingRequest
    TenantLifecycleResult:
      description: The status the command set
      content:
        application/json:
          schema:
            $ref: ./tenant.schema.json#/$defs/TenantLifecycleResult
    SubscriptionClassificationRecord:
      description: The classification record
      content:
        application/json:
          schema:
            $ref: ../../product/v1/subscription.schema.json#/$defs/SubscriptionClassificationRecord
    ClassificationExplanation:
      description: Why the subscription is classified as it is
      content:
        application/json:
          schema:
            $ref: ../../product/v1/subscription.schema.json#/$defs/ClassificationExplanation
    IamOrganisationReference:
      description: The IAM organisation link
      content:
        application/json:
          schema:
            $ref: ../../organisation/v1/iam.schema.json#/$defs/IamOrganisationReference
    IamOrganisationReferenceList:
      description: The Organisation's IAM organisation links
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: ../../organisation/v1/iam.schema.json#/$defs/IamOrganisationReference
    IamOrganisationResolution:
      description: The canonical Organisation the evidence resolves to
      content:
        application/json:
          schema:
            $ref: ../../organisation/v1/iam.schema.json#/$defs/IamOrganisationResolution
    OrganisationAdmissionOutcome:
      description: The admission outcome
      content:
        application/json:
          schema:
            $ref: ../../organisation/v1/admission.schema.json#/$defs/OrganisationAdmissionOutcome
    CounterpartyReconciliationReport:
      description: The reconciliation run
      content:
        application/json:
          schema:
            $ref: ../../organisation/v1/counterparty.schema.json#/$defs/CounterpartyReconciliationReport
    OrganisationResolutionCandidate:
      description: The resolution candidate
      content:
        application/json:
          schema:
            $ref: ../../organisation/v1/counterparty.schema.json#/$defs/OrganisationResolutionCandidate
    ResolutionCandidatePage:
      description: A page of resolution candidates
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: ../../organisation/v1/counterparty.schema.json#/$defs/OrganisationResolutionCandidate
                next:
                  description: Cursor for the next page; absent on the last page.
                  $ref: ../../organisation/v1/counterparty.schema.json#/$defs/resolutionCandidateId
    CounterpartyRole:
      description: The counterparty role as stored
      content:
        application/json:
          schema:
            $ref: ../../organisation/v1/counterparty.schema.json#/$defs/CounterpartyRole
    CounterpartyRoleList:
      description: The tenant's counterparty roles
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: ../../organisation/v1/counterparty.schema.json#/$defs/CounterpartyRole
    PlatformAccount:
