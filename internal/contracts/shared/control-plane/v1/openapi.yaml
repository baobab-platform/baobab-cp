  /engine-migration-tasks:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Topology]
      operationId: listEngineMigrationTasks
      summary: The caller's open engine migration tasks
      description: >-
        The PENDING and CLAIMED tasks assigned to the engine instances whose
        Control Plane registration names the calling workload client as
        their attested workload (ADR-SHARED-016 section 4), oldest first. The
        instance is never taken from the request; a workload attested for no
        instance gets an empty page.
      security:
        - workloadOidc: [provider-migration:task]
      parameters:
        - name: page_token
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: The caller's open tasks
          content:
            application/json:
              schema:
                $ref: ./engine-migration-task.schema.json#/$defs/EngineMigrationTaskPage
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /engine-migration-tasks/{task_id}/claim:
    parameters:
      - $ref: "#/components/parameters/EngineMigrationTaskId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Topology]
      operationId: claimEngineMigrationTask
      summary: Claim a task and take its lease
      description: >-
        Takes no body. A PENDING task assigned to an instance the caller is
        attested for moves to CLAIMED with a lease of task_lease_seconds
        (provider-migration-lifecycle.yaml). Another instance's task does not
        exist for the caller (404). A task already claimed under a live lease
        is ENGINE_MIGRATION_TASK_CLAIMED (409); a final task is
        ENGINE_MIGRATION_TASK_FINAL (409). The claimant renews its lease by
        claiming again. The task's revision is required in If-Match.
      security:
        - workloadOidc: [provider-migration:task]
      parameters:
        - $ref: "#/components/parameters/EngineMigrationTaskIfMatch"
      responses:
        "200":
          description: The claimed task
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: ./engine-migration-task.schema.json#/$defs/EngineMigrationTask
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
