      - $ref: "#/components/parameters/CanonicalEntityIfMatch"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Canonical registry]
      operationId: activateCanonicalEntity
      summary: Activate a VALIDATED canonical entity
      description: >-
        Takes no body. Moves VALIDATED to ACTIVE; any other state is refused with CANONICAL_ENTITY_LIFECYCLE_CONFLICT (409). Only an ACTIVE organisation-kind entity can be asserted as a request's organisation_id (ADR-BCP-016).
      security:
        - adminOidc: [canonical:write]
      responses:
        "200":
          $ref: "#/components/responses/CanonicalEntity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
