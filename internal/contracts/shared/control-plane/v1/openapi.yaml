  /tenants/{tenant_id}/provisioning:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Provisioning]
      operationId: createTenantProvisioning
      summary: Plan a tenant's provisioning from its authorised desired state
      description: >-
        Freezes the desired state of the tenant's AUTHORISED onboarding
        request and generates an immutable plan. Planning is side-effect
        free: nothing is registered, granted, bound, configured or projected
        until an approved plan is applied (ADR-SHARED-015). The body names the
        source of desired state and never carries a manifest, grants,
        bindings or engines. A request that is not AUTHORISED, or whose
        desired_state_version is no longer current, is refused with 409.
      security:
        - adminOidc: [tenant:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./provisioning-desired-state.schema.json#/$defs/TenantProvisioningCreateRequest
      responses:
        "201":
          description: Planned. The provisioning is PLANNED, or BLOCKED with its blocking reasons.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: ./tenant-provisioning.schema.json#/$defs/TenantProvisioning
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags: [Provisioning]
      operationId: listTenantProvisionings
      summary: List a tenant's provisionings
      security:
        - adminOidc: [tenant:read]
      parameters:
        - $ref: "#/components/parameters/PageLimit"
