        "200":
          description: The mapping that resolved and what it resolves to
          content:
            application/json:
              schema:
                $ref: ./canonical-mapping.schema.json#/$defs/resolutionResponse
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /markets:
    post:
      tags: [Markets]
      operationId: createMarket
      summary: Register a market
      description: >-
        Registers a market from its creator's configuration. The Control Plane
        mints market_id, derives created_by from the caller and sets status:
        VALIDATED when every market-lifecycle.yaml validation rule holds,
        otherwise DRAFT with validation_findings. A market is never created
        ACTIVE. Replaying the same Idempotency-Key returns the same market.
        An unknown owner tenant is refused with MARKET_OWNER_UNKNOWN (422);
        a canonical_key already registered with MARKET_CANONICAL_KEY_TAKEN
        (409). An unknown parent market is not refused: like every other
        validation rule, it is reported as a MARKET_PARENT_UNKNOWN finding
        and the market stays DRAFT.
      security:
        - adminOidc: [market:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CausationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./market.schema.json#/$defs/MarketCreateRequest
      responses:
        "201":
          description: Registered, DRAFT or VALIDATED
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: ./market.schema.json#/$defs/market
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /markets/{market_id}:
    parameters:
      - $ref: "#/components/parameters/MarketId"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Markets]
      operationId: getMarket
      summary: Read a market's configuration
      description: >-
        Workloads read markets with market:read. Administrators read them
        with market:write or market:approve, to review a market and obtain
        the revision an update or activation must name.
      security:
        - workloadOidc: [market:read]
        - adminOidc: [market:write]
        - adminOidc: [market:approve]
      responses:
        "200":
          description: The market
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: ./market.schema.json#/$defs/market
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Markets]
      operationId: updateMarket
      summary: Update a DRAFT or VALIDATED market
      description: >-
        Applies a JSON merge patch at the revision the caller read. The
        Control Plane re-evaluates validation afterwards, so an update can
        move a market between DRAFT and VALIDATED. An ACTIVE or later market
        is refused with MARKET_NOT_EDITABLE (409): changes to an active
        market are governed changes.
      security:
        - adminOidc: [market:write]
      parameters:
        - $ref: "#/components/parameters/MarketIfMatch"
        - $ref: "#/components/parameters/CausationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./market.schema.json#/$defs/MarketUpdateRequest
      responses:
        "200":
          description: Updated
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: ./market.schema.json#/$defs/market
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /markets/{market_id}/activate:
    parameters:
      - $ref: "#/components/parameters/MarketId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Markets]
      operationId: activateMarket
      summary: Activate a VALIDATED market
      description: >-
        Activates the market at the revision the approver reviewed. The
        approver is the authenticated caller, never a request field, and must
        be neither the market's creator nor its last editor
        (MARKET_SELF_ACTIVATION, 403). A market that is not VALIDATED is
        refused with MARKET_NOT_VALIDATED (409).
