  /provider-migrations/plan:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Topology]
      operationId: previewProviderMigration
      summary: Discover and plan a provider migration without creating it
      description: >-
        The administrative preview of ADR-BCP-006 section 122: discovers the
        bindings, tenants, estates and markets the migration touches from
        authoritative state (section 46), assigns them to the request's
        cohorts, checks every precondition of section 48 and returns the
        plan with its blockers and warnings. Side-effect free: nothing is
        created, bound or recorded, and the preview has no
        provider_migration_id. An unknown source or target provider is a
        blocker in the plan, not an error.
      security:
        - adminOidc: [topology:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./provider-migration.schema.json#/$defs/ProviderMigrationRequest
      responses:
        "200":
          description: The previewed plan
          content:
            application/json:
              schema:
                $ref: ./provider-migration.schema.json#/$defs/ProviderMigrationPlan
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
