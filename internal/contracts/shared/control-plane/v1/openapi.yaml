        Takes no body. Moves ACTIVE, SUSPENDED or DEPRECATED to RETIRED; any other state is refused with CANONICAL_ENTITY_LIFECYCLE_CONFLICT (409).
      security:
        - adminOidc: [canonical:write]
      responses:
        "200":
          $ref: "#/components/responses/CanonicalEntity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
