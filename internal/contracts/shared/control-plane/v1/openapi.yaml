              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: ./provider-migration.schema.json#/$defs/ProviderMigrationPlan
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /provider-migrations/{provider_migration_id}/approve:
    parameters:
      - $ref: "#/components/parameters/ProviderMigrationId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Topology]
      operationId: decideProviderMigrationPlan
      summary: Approve, reject or request changes to the migration's current plan
      description: >-
        Records an ApprovalDecision (subject PROVIDER_MIGRATION) bound to the
        plan id, version and digest the approver reviewed (ADR-SHARED-016
        section 1). Valid in PLAN, on a plan without blockers. The approver
        is the verified caller and never the migration's creator
        (PROVIDER_MIGRATION_SELF_APPROVAL, 403). One APPROVED decision
        authorises the plan's whole sequence; a replan needs a new decision.
        A decision naming another plan or digest is PLAN_DIGEST_MISMATCH
        (409); a stale or blocked plan is PLAN_STALE or
        PROVIDER_MIGRATION_BLOCKED (409). The migration's revision is
        required in If-Match.
      security:
        - adminOidc: [provider-migration:approve]
      parameters:
        - $ref: "#/components/parameters/ProviderMigrationIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./approval-decision.schema.json#/$defs/ApprovalDecisionRequest
      responses:
        "200":
          description: The recorded decision
          content:
            application/json:
              schema:
                $ref: ./approval-decision.schema.json#/$defs/ApprovalDecision
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /provider-migrations/{provider_migration_id}/advance:
    parameters:
      - $ref: "#/components/parameters/ProviderMigrationId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Topology]
      operationId: advanceProviderMigration
      summary: Run one lifecycle transition of an approved migration
      description: >-
        Starts one transition of provider-migration-lifecycle.yaml as a
        PROVIDER_MIGRATION_ADVANCE operation (ADR-SHARED-016 section 2). The
        transition runs exactly the approved plan's operations its
        stage_steps name; the request never names steps. A forward
        transition needs an APPROVED decision on the current plan
        (PLAN_NOT_APPROVED), a plan that is not blocked, expired or stale
        (PROVIDER_MIGRATION_BLOCKED, PLAN_STALE; expiry applies up to prepare,
        and staleness ignores the migration's own effects), no other running operation
        of the migration (PROVIDER_MIGRATION_OPERATION_RUNNING) and, for
        canary and shift, an open cutover window where one is named
        (MIGRATION_CUTOVER_WINDOW_CLOSED);
        each is 409, as is a transition the lifecycle does not allow from the
        current stage (PROVIDER_MIGRATION_STAGE_CONFLICT). The current plan's
        approver never advances it forward (PROVIDER_MIGRATION_SELF_EXECUTION,
        403). cancel (only
        before any cohort's authority moved) and roll_back need no approval,
        but a reason. FORWARD_FIX_ONLY refuses roll_back once a cohort moved
        (MIGRATION_NOT_REVERSIBLE, 409). Engine steps become engine migration
        tasks; 202 does not mean the stage is complete. Replaying the same
        Idempotency-Key returns the same operation.
      security:
        - adminOidc: [provider-migration:execute]
      parameters:
        - $ref: "#/components/parameters/ProviderMigrationIfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./provider-migration.schema.json#/$defs/ProviderMigrationAdvanceRequest
      responses:
        "202":
          $ref: "#/components/responses/ExecutionOperationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /engine-releases:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Topology]
      operationId: recordEngineRelease
      summary: Record an immutable engine release
      description: >-
        Records one version of one engine as CANDIDATE (ADR-BCP-025 section
        2.1, gate ER-02). The Control Plane mints release_id and takes the
        recorder from the verified caller. A release is immutable: recording
        the same (engine_id, release_version) again with byte-identical
        content is a replay and returns the recorded release (200); other
        content is RELEASE_VERSION_CONFLICT (409). An artifact digest that
        another release owns is RELEASE_ARTIFACT_DIGEST_CONFLICT (409). A
        provider of another engine is RELEASE_PROVIDER_NOT_OWNED and an
        uncatalogued capability or contract major
        RELEASE_CAPABILITY_NOT_CATALOGUED (422). Recording never approves a
        release, desires it or changes resolution.
      security:
        - workloadOidc: [engine-release:record]
        - adminOidc: [topology:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../topology/v1/release.schema.json#/$defs/EngineReleaseRecordRequest
      responses:
        "200":
          description: A replay of an already recorded release; nothing changed.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: ../../topology/v1/release.schema.json#/$defs/EngineRelease
        "201":
          description: Recorded as CANDIDATE.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: ../../topology/v1/release.schema.json#/$defs/EngineRelease
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Topology]
      operationId: listEngineReleases
      summary: List engine releases
      description: >-
        Recorded releases, newest first, optionally of one engine and in one
        status (ADR-BCP-025 gate ER-02).
      security:
        - adminOidc: [topology:read]
      parameters:
        - name: engine_id
          in: query
          required: false
          schema:
            $ref: ./domain.schema.json#/$defs/engineId
        - name: status
          in: query
          required: false
          schema:
            $ref: ../../topology/v1/domain.schema.json#/$defs/releaseStatus
        - name: page_token
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: A page of releases
          content:
            application/json:
              schema:
                $ref: ../../topology/v1/release.schema.json#/$defs/EngineReleasePage
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /engine-releases/{release_id}:
    parameters:
      - $ref: "#/components/parameters/EngineReleaseId"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Topology]
      operationId: getEngineRelease
