  /engine-migration-tasks/{task_id}/report:
    parameters:
      - $ref: "#/components/parameters/EngineMigrationTaskId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Topology]
      operationId: reportEngineMigrationTask
      summary: Report a claimed task's final outcome
      description: >-
        Only the claimant reports, while its lease holds
        (ENGINE_MIGRATION_TASK_LEASE_EXPIRED, 409). A report is final; the
        same report replayed returns the task (200), a different one is
        ENGINE_MIGRATION_TASK_FINAL (409). A FAILED report carries a
        provider_migration_task_failure reason code. The Control Plane then
        advances the step: a RECONCILE_COHORT_DATA step succeeds only when
        its SOURCE and TARGET reports match, and otherwise fails with
        MIGRATION_RECONCILIATION_MISMATCH, leaving the cohort frozen. A
        report never carries business data.
      security:
        - workloadOidc: [provider-migration:task]
      parameters:
        - $ref: "#/components/parameters/EngineMigrationTaskIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./engine-migration-task.schema.json#/$defs/EngineMigrationTaskReport
      responses:
        "200":
          description: The reported task
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: ./engine-migration-task.schema.json#/$defs/EngineMigrationTask
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/effective-authority:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Administration]
      operationId: getEffectiveAuthority
      summary: The caller's effective administrative authority
      description: >-
        Who the caller is to the Control Plane and what they may administer
        where: every AdministrativeGrant that is ACTIVE and valid now, with
        its permission and scope (ADR-BCP-020 sections 99-102, 110). The CP
        Console drives navigation, scope display and elevated-access notices
        from it. It is derived from grants only: no IAM role, membership or
        token scope is reported, and nothing here authorises an action -
        every administrative request is evaluated again when it is made. A
        principal with no grants receives an empty list, not an error. Never
        cached across principals.
      security:
        - adminOidc: [authority:self]
      responses:
        "200":
          description: The caller's effective authority
          headers:
            Cache-Control:
              description: private, no-store
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: ../../administration/v1/grant.schema.json#/$defs/EffectiveAuthority
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/changesets:
