            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: ../../organisation/v1/observability.schema.json#/$defs/OrganisationAuditEntry
                next:
                  description: Cursor for the next page; absent on the last page.
                  $ref: ../../organisation/v1/observability.schema.json#/$defs/OrganisationAuditEntry/properties/audit_id
    TenantProvisioning:
      description: The provisioning
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: ./tenant-provisioning.schema.json#/$defs/TenantProvisioning
    TenantProvisioningPage:
      description: A page of provisionings, newest first
      content:
        application/json:
          schema:
            $ref: ./tenant-provisioning.schema.json#/$defs/TenantProvisioningPage
    ExecutionOperation:
      description: The operation
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: ./execution-operation.schema.json#/$defs/ExecutionOperation
    Changeset:
      description: The changeset
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: ./changeset.schema.json#/$defs/Changeset
    ExecutionOperationAccepted:
      description: Accepted for asynchronous execution. Poll the operation at Location; 202 does not mean success.
      headers:
        Location:
          $ref: "#/components/headers/Location"
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            $ref: ./execution-operation.schema.json#/$defs/ExecutionOperation
    Mapping:
      description: The mapping
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: ./canonical-mapping.schema.json#/$defs/mapping
    CanonicalEntity:
      description: The canonical entity
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: ./canonical-entity.schema.json#/$defs/CanonicalEntity
    NoContent:
      description: Done; no body
    PreconditionFailed:
      description: The If-Match version is stale; reload before changing the resource
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PreconditionRequired:
      description: The command requires an If-Match version
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InternalError:
      description: The Control Plane failed; the problem is retryable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: No such resource, or one the caller may not see
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PayloadTooLarge:
      description: The request body exceeds 1 MiB
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ServiceUnavailable:
      description: A dependency is unavailable; the problem is retryable
      content:
