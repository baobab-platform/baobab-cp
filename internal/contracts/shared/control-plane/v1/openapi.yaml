    post:
      tags: [Verification]
      operationId: recordVerificationResult
      summary: Record a claim's verification result
      description: >-
        Records a claim's result from checks already recorded on it in this case;
        the claim's status becomes the outcome and the newer result supersedes
        any earlier one. The caller is decided_by and never the claim's asserter.
        VERIFIED needs a positive check from a source trusted for the claim type in
        the claim's jurisdiction (VERIFICATION_UNSUPPORTED, 422). A CONFLICTED
        result moves a VERIFYING case to CONFLICTED.
      security:
        - adminOidc: [verification:decide]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../evidence/v1/verification.schema.json#/$defs/VerificationResultRecordRequest
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: ../../evidence/v1/verification.schema.json#/$defs/VerificationResult
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    get:
      tags: [Verification]
      operationId: listVerificationResults
      summary: List a verification case's results
      security:
        - adminOidc: [verification:read]
      responses:
        "200":
          description: The case's results
          content:
            application/json:
              schema:
                $ref: ../../evidence/v1/verification.schema.json#/$defs/VerificationResultList
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
