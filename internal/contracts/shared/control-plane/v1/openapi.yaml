      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Provisioning]
      operationId: getTenantProvisioning
      summary: Read a provisioning's lifecycle and progress
      description: >-
        Its state is the canonical lifecycle (tenant-provisioning-lifecycle.yaml);
        the applying operation and readiness are read separately. A
        provisioning of another tenant is NOT_FOUND, indistinguishable from
        one that does not exist.
      security:
        - adminOidc: [tenant:read]
      responses:
        "200":
          $ref: "#/components/responses/TenantProvisioning"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /tenants/{tenant_id}/provisioning/{tenant_provisioning_id}/plan:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/TenantProvisioningId"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Provisioning]
      operationId: getTenantProvisioningPlan
      summary: Read the immutable plan and its impact
      description: >-
        The plan preview a reviewer approves (ADR-BCP-019 section 28): its
        steps in canonical operation types, resolved topology in
        ADR-SHARED-012 identifiers, blockers, warnings, impact analysis, risk
        class and digest. The ETag is the plan digest.
      security:
        - adminOidc: [tenant:read]
      responses:
        "200":
          description: The current plan
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: ./provisioning-plan.schema.json#/$defs/ProvisioningPlan
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Provisioning]
      operationId: replanTenantProvisioning
      summary: Regenerate the plan
      description: >-
        Valid from PLANNED, BLOCKED and FAILED (PROVISIONING_STATE_CONFLICT,
        409). Supersedes the current plan with a new plan_version generated
        from authoritative state and the current, or named, desired-state
        version; a decision on the superseded plan lapses and the new plan
        needs its own approval. Side-effect free, like planning. The way
        forward from a stale plan, a REJECTED or CHANGES_REQUESTED decision,
        or a blocker that needs another plan. The provisioning's revision is
        required in If-Match.
      security:
        - adminOidc: [tenant:write]
      parameters:
        - $ref: "#/components/parameters/ProvisioningIfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./tenant-provisioning.schema.json#/$defs/TenantProvisioningReplanRequest
      responses:
        "200":
          $ref: "#/components/responses/TenantProvisioning"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /tenants/{tenant_id}/provisioning/{tenant_provisioning_id}/approve:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/TenantProvisioningId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Provisioning]
      operationId: decideTenantProvisioningPlan
      summary: Approve, reject or request changes to the exact current plan
      description: >-
        Records an ApprovalDecision bound to the plan id, version and digest
        the approver reviewed (ADR-BCP-021 sections 24 and 50). The approver
        is the verified caller and never the principal who requested the
        provisioning (PROVISIONING_SELF_APPROVAL, 403). A decision naming
        another plan or digest than the current one is PLAN_DIGEST_MISMATCH
        (409); a stale plan is PLAN_STALE (409); a plan with blockers cannot
        be approved (PLAN_BLOCKED, 409). The provisioning's revision is
        required in If-Match.
      security:
        - adminOidc: [provisioning:approve]
      parameters:
        - $ref: "#/components/parameters/ProvisioningIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./approval-decision.schema.json#/$defs/ApprovalDecisionRequest
      responses:
        "200":
          description: The recorded decision
          content:
            application/json:
              schema:
                $ref: ./approval-decision.schema.json#/$defs/ApprovalDecision
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /tenants/{tenant_id}/provisioning/{tenant_provisioning_id}/apply:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/TenantProvisioningId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Provisioning]
      operationId: applyTenantProvisioning
      summary: Start asynchronous execution of the approved plan
      description: >-
        Takes no body. Executes exactly the approved plan: the provisioning
        must be PLANNED, its plan not stale, and the latest decision APPROVED
        with a digest equal to the current plan's (PLAN_NOT_APPROVED,
        PLAN_STALE, PLAN_DIGEST_MISMATCH; 409). Returns 202 with the durable
        operation; 202 does not mean the tenant is provisioned (ADR-BCP-022
        section 57). Replaying the same Idempotency-Key returns the same
        operation.
      security:
        - adminOidc: [tenant:write]
      parameters:
        - $ref: "#/components/parameters/ProvisioningIfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/ExecutionOperationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tenants/{tenant_id}/provisioning/{tenant_provisioning_id}/withdraw:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/TenantProvisioningId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Provisioning]
      operationId: withdrawTenantProvisioning
      summary: Abandon a provisioning that is not executing
      description: >-
        Moves a DRAFT, PLANNED, BLOCKED or FAILED provisioning to CANCELLED
        (PROVISIONING_STATE_CONFLICT, 409, otherwise). It changes no runtime
        state: resources an earlier apply created remain and are reported as
        drift. An executing provisioning is stopped with cancelOperation on
        its operation instead. The provisioning's revision is required in
        If-Match.
      security:
        - adminOidc: [tenant:write]
      parameters:
        - $ref: "#/components/parameters/ProvisioningIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./tenant-provisioning.schema.json#/$defs/ProvisioningCommandRequest
      responses:
        "200":
          $ref: "#/components/responses/TenantProvisioning"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /tenants/{tenant_id}/provisioning/{tenant_provisioning_id}/remediate:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/TenantProvisioningId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Provisioning]
      operationId: remediateTenantProvisioning
      summary: Resolve a BLOCKED provisioning's blockers under its approved plan
      description: >-
        Deliberate remediation, not a retry: valid only while the
        provisioning is BLOCKED (PROVISIONING_STATE_CONFLICT, 409) and its
        blockers can be resolved within the approved, non-stale plan, for
        example re-establishing a binding that is not found. A blocker that
        needs another plan is PLAN_CHANGE_REQUIRED (409) and is replanned
        instead. Returns 202 with a TENANT_PROVISIONING_REMEDIATE operation;
        the provisioning is REMEDIATING, then verifies readiness. The
        provisioning's revision is required in If-Match.
      security:
        - adminOidc: [tenant:write]
      parameters:
        - $ref: "#/components/parameters/ProvisioningIfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./tenant-provisioning.schema.json#/$defs/ProvisioningCommandRequest
      responses:
        "202":
          $ref: "#/components/responses/ExecutionOperationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
