          $ref: "#/components/responses/AdmissionDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  # ---------------------------------------------------------------------------
  # Onboarding (ADR-BCP-017 sections 22-24, 39): the handoff from an APPROVED
  # decision to tenant registration. Every operation also requires Control
  # Plane platform-administrator authority and a registered principal;
  # onboarding:request and onboarding:authorise each also require their IAM
  # client role, and the service enforces separation of duties per principal.
  # ---------------------------------------------------------------------------
  /tenant-onboarding-requests:
    post:
      tags: [Onboarding]
      operationId: requestTenantOnboarding
      summary: Hand an APPROVED AdmissionDecision to onboarding
      description: >-
        Desired state is copied from the decision. There is one live request
        per decision: repeating the request returns the live one with 200.
        The requester is never the applicant or the decider
        (SEPARATION_OF_DUTIES, 403).
      security:
        - adminOidc: [onboarding:request]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../admission/v1/onboarding.schema.json#/$defs/TenantOnboardingRequestCommand
      responses:
        "201":
          $ref: "#/components/responses/TenantOnboardingRequest"
        "200":
          $ref: "#/components/responses/TenantOnboardingRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags: [Onboarding]
      operationId: listTenantOnboardingRequests
      summary: List onboarding requests, newest first
      security:
        - adminOidc: [onboarding:request]
        - adminOidc: [onboarding:authorise]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: ../../admission/v1/onboarding.schema.json#/$defs/onboardingRequestStatus
        - name: limit
          in: query
          required: false
          description: 1 to 200; any other value lists 50.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Onboarding requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantOnboardingRequestList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tenant-onboarding-requests/{request_id}:
    parameters:
      - $ref: "#/components/parameters/OnboardingRequestId"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Onboarding]
      operationId: getTenantOnboardingRequest
      summary: Read one onboarding request
      security:
        - adminOidc: [onboarding:request]
        - adminOidc: [onboarding:authorise]
      responses:
        "200":
          $ref: "#/components/responses/TenantOnboardingRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tenant-onboarding-requests/{request_id}/authorisation:
    parameters:
      - $ref: "#/components/parameters/OnboardingRequestId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Onboarding]
      operationId: authoriseTenantOnboarding
      summary: Authorise a REQUESTED onboarding request
      description: The authoriser is never the requester or the applicant (SEPARATION_OF_DUTIES, 403).
      security:
        - adminOidc: [onboarding:authorise]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../admission/v1/onboarding.schema.json#/$defs/OnboardingAuthorisationCommand
      responses:
        "200":
          $ref: "#/components/responses/TenantOnboardingRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tenant-onboarding-requests/{request_id}/cancellation:
    parameters:
      - $ref: "#/components/parameters/OnboardingRequestId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Onboarding]
      operationId: cancelTenantOnboarding
      summary: Cancel a REQUESTED or AUTHORISED onboarding request
      description: The admission decision is never rewritten.
      security:
        - adminOidc: [onboarding:request]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../admission/v1/onboarding.schema.json#/$defs/OnboardingCancellationCommand
      responses:
        "200":
          $ref: "#/components/responses/TenantOnboardingRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tenant-onboarding-requests/{request_id}/fulfilment:
    parameters:
      - $ref: "#/components/parameters/OnboardingRequestId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Onboarding]
      operationId: fulfilTenantOnboarding
      summary: Record the tenant an AUTHORISED request produced
      description: >-
        Registration (registerTenant) already fulfils its request; this
        records a tenant produced elsewhere. The tenant must exist
        (TENANT_NOT_FOUND, 422), must not belong to another request
        (TENANT_ALREADY_ONBOARDED, 409) and must match the desired state
        (DESIRED_STATE_MISMATCH, 422).
      security:
        - adminOidc: [onboarding:request]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../admission/v1/onboarding.schema.json#/$defs/OnboardingFulfilmentCommand
      responses:
        "200":
          $ref: "#/components/responses/TenantOnboardingRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  # ---------------------------------------------------------------------------
  # Tenants (ADR-BCP-022 section 43): reading and lifecycle commands. A
  # tenant administrator reaches only tenants they hold an ACTIVE workforce
  # membership for; a platform administrator reaches every tenant.
  # ---------------------------------------------------------------------------
  /tenants/{tenant_id}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Tenants]
      operationId: getTenant
      summary: Read a tenant
      description: A malformed tenant id is refused with INVALID_TENANT_ID (400).
      security:
        - adminOidc: [tenant:read]
      responses:
        "200":
          description: The tenant
          content:
            application/json:
              schema:
                $ref: ./tenant.schema.json#/$defs/Tenant
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tenants/{tenant_id}/suspend:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Tenants]
      operationId: suspendTenant
      summary: Suspend a tenant
      description: >-
        Takes no body. Sets the tenant's desired and observed state to
        suspended. A malformed tenant id is refused with VALIDATION_FAILED
        (422).
      security:
        - adminOidc: [tenant:write]
      responses:
        "200":
          $ref: "#/components/responses/TenantLifecycleResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tenants/{tenant_id}/activate:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Tenants]
      operationId: activateTenant
      summary: Activate a tenant
      description: >-
        Takes no body. Sets the tenant's desired and observed state to
        active. A malformed tenant id is refused with VALIDATION_FAILED (422).
      security:
        - adminOidc: [tenant:write]
      responses:
        "200":
          $ref: "#/components/responses/TenantLifecycleResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tenants/{tenant_id}/decommission:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Tenants]
      operationId: decommissionTenant
      summary: Decommission a tenant
      description: >-
        Takes no body. Sets the tenant's desired and observed state to
        decommissioned. A malformed tenant id is refused with
        VALIDATION_FAILED (422).
      security:
        - adminOidc: [tenant:write]
      responses:
        "200":
          $ref: "#/components/responses/TenantLifecycleResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /entitlements:
    get:
      tags: [Tenants]
      operationId: getEntitlement
      summary: Read a tenant's entitlement to a product
      description: A malformed tenantId or productId is refused with VALIDATION_FAILED (422).
      security:
        - adminOidc: [tenant:read]
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            $ref: ./domain.schema.json#/$defs/tenantId
        - name: productId
          in: query
          required: true
          schema:
            $ref: ./domain.schema.json#/$defs/productId
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The entitlement
          content:
            application/json:
              schema:
                $ref: ./tenant.schema.json#/$defs/Entitlement
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  # ---------------------------------------------------------------------------
  # Classification (ADR-BCP-018 ORG-11, ADR-SHARED-011): a ProductSubscription's
  # type and why. Every operation also requires Control Plane
  # platform-administrator authority and a registered principal.
  # ---------------------------------------------------------------------------
  /product-subscriptions/{subscription_id}/classification:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Classification]
      operationId: classifySubscription
      summary: Classify an unclassified subscription from its tenant's AdmissionDecision
      description: >-
        The type is the decision's. Repeating the classification with the
        same decision returns the existing record with 200. The classifier is
        never a principal of the subscription's own organisation
        (SELF_CLASSIFICATION_FORBIDDEN, 403). INTERNAL requires eligibility
        the Control Plane establishes itself (NOT_INTERNAL_ELIGIBLE, 422).
      security:
        - adminOidc: [subscription:classify]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../product/v1/subscription.schema.json#/$defs/SubscriptionClassificationCommand
      responses:
        "201":
          $ref: "#/components/responses/SubscriptionClassificationRecord"
        "200":
          $ref: "#/components/responses/SubscriptionClassificationRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags: [Classification]
      operationId: explainSubscriptionClassification
      summary: Explain why a subscription is classified as it is
      description: >-
        The current record and its history, INTERNAL eligibility re-evaluated
        now (NOT_ELIGIBLE is reported as drift and never acted on) and the
        billing policy. It exposes relationship identifiers, never the
        corporate graph.
      security:
        - adminOidc: [subscription:read]
      responses:
        "200":
          $ref: "#/components/responses/ClassificationExplanation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /product-subscriptions/{subscription_id}/reclassification:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
      - $ref: "#/components/parameters/CorrelationId"
    post:
      tags: [Classification]
      operationId: reclassifySubscription
      summary: Change a classified subscription's type
      description: >-
        Repeating the same reclassification (same type and reference) returns
        the existing record with 200. An unchanged type is refused with
        SUBSCRIPTION_TYPE_UNCHANGED and an unclassified subscription with
        SUBSCRIPTION_NOT_CLASSIFIED (both 409).
      security:
        - adminOidc: [subscription:classify]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../product/v1/subscription.schema.json#/$defs/SubscriptionReclassificationCommand
      responses:
        "201":
          $ref: "#/components/responses/SubscriptionClassificationRecord"
        "200":
          $ref: "#/components/responses/SubscriptionClassificationRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tenants/{tenant_id}/products/{product_id}/classification:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: product_id
        in: path
        required: true
        schema:
          $ref: ./domain.schema.json#/$defs/productId
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Classification]
      operationId: explainTenantProductClassification
      summary: Explain the classification of a tenant's subscription to a product
      security:
        - adminOidc: [subscription:read]
      responses:
        "200":
          $ref: "#/components/responses/ClassificationExplanation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  # ---------------------------------------------------------------------------
  # Canonical registry (ADR-BCP-001, ADR-0006, ADR-BCP-016): registering
  # canonical entities and moving them through their lifecycle. A new entity
  # is always DRAFT; each command needs the current version in If-Match
  # (ADR-BCP-022 sections 123-130). Every operation also requires Control
  # Plane platform-administrator authority.
  # ---------------------------------------------------------------------------
  /canonical-entities:
    post:
      tags: [Canonical registry]
      operationId: createCanonicalEntity
      summary: Register a canonical entity
      description: >-
        The Control Plane mints the identifier and starts the entity DRAFT at
        version 1. A body that is not JSON or names a field the request does
        not define, such as an identifier, status, version or timestamp, is
        refused with INVALID_REQUEST (400); one that breaks a field's rule
        with VALIDATION_FAILED (400); an effective_to not after
        effective_from with VALIDATION_FAILED (422).
      security:
        - adminOidc: [canonical:write]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./canonical-entity.schema.json#/$defs/CanonicalEntityCreateRequest
      responses:
        "201":
          description: Registered
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: ./canonical-entity.schema.json#/$defs/CanonicalEntity
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
